<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일 잘하는 강프로</title>
<meta name="description" content="잊기 쉬운 업무를 다시 떠올리게 하는 팀 업무 보조 도구.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23333132%22/%3E%0A%20%20%3Cpath%20d%3D%22M9%2010.5h14v12%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.4%22/%3E%0A%3C/svg%3E%0A">
<style>

:root{
  /* 메인 컬러 — Black  HEX #333132 / RGB 51,49,50 / PANTONE P 179-15C */
  --ink:#333132;        /* 브랜드 블랙 (기준색) */
  --ink-2:#6B696A;      /* 60% */
  --ink-3:#9A9899;      /* 40% — 라벨용 */
  --hover:#4A4849;      /* 버튼 호버 */
  --paper:#FFFFFF;
  --paper-2:#F5F4F4;    /* 기준색 4% */
  --marker:#E7E5E5;     /* 형광펜 자리 — 회색 하이라이트 */
  --rule:#E3E1E2;
  --fs:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  --fs-num:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --wrap:1000px;
  --gnb:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:var(--gnb)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);line-height:1.7;letter-spacing:-.01em;padding-bottom:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}

/* ══ 상단 고정 메뉴 ══ */
.gnb{
  position:sticky;top:0;z-index:50;height:var(--gnb);
  background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--rule);
}
.gnb .wrap{
  max-width:none;height:100%;padding:0 clamp(18px,3.5vw,40px);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.logo{
  display:flex;align-items:center;gap:9px;
  font-size:17px;font-weight:900;letter-spacing:-.035em;line-height:1;
  white-space:nowrap;margin-right:8px;color:var(--ink);
  font-family:var(--fs);
}
.logo:hover{opacity:.62}
.menu{
  display:flex;align-items:center;gap:clamp(26px,4.4vw,56px);
  font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:-.005em;
  list-style:none;margin:0;padding:0;
}
.menu > li{position:relative}
.menu > li > a{position:relative;padding:4px 0;display:inline-block}
.menu em{font-style:normal;font-size:9px;color:var(--ink-3);margin-left:2px;vertical-align:2px}
.menu a::after{
  content:'';position:absolute;left:0;right:0;bottom:-2px;height:1.5px;
  background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .22s ease;
}
.menu > li > a:hover{color:var(--ink)}
.menu > li > a:hover::after{transform:scaleX(1)}

/* 하위 메뉴 */
.sub{
  position:absolute;top:100%;left:-16px;padding-top:14px;min-width:212px;
  opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s;
}
.has-sub:hover .sub,.has-sub:focus-within .sub{opacity:1;visibility:visible;transform:none}
.sub ul{
  list-style:none;margin:0;padding:9px;background:var(--ink);border-radius:12px;
  box-shadow:0 14px 34px rgba(51,49,50,.22);
}
.sub a{
  display:block;color:#CFCDCE;font-size:13.5px;font-weight:600;
  padding:9px 13px;border-radius:7px;white-space:nowrap;transition:background .15s ease,color .15s ease;
}
.sub a:hover{background:rgba(255,255,255,.11);color:#fff}

/* 햄버거 + 드로어 */
.gnb-right{display:flex;align-items:center;gap:10px}
.burger{
  display:none;width:38px;height:38px;border:1px solid var(--rule);border-radius:9px;
  background:var(--paper);cursor:pointer;padding:0;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.burger span{display:block;width:16px;height:1.6px;background:var(--ink);transition:transform .2s ease,opacity .2s ease}
.burger[aria-expanded="true"] span:first-child{transform:translateY(3.3px) rotate(45deg)}
.burger[aria-expanded="true"] span:last-child{transform:translateY(-3.3px) rotate(-45deg)}
.drawer{
  position:fixed;left:0;right:0;top:var(--gnb);bottom:0;z-index:45;
  background:var(--ink);overflow-y:auto;
}
.drawer-in{padding:22px 24px 40px}
.drawer a{display:block;color:#E6E4E5;font-size:17px;font-weight:700;letter-spacing:-.03em;padding:11px 0}
.drawer a:hover{color:#fff}
.drawer p{
  margin:24px 0 4px;font-family:var(--fs-num);font-size:11px;letter-spacing:.18em;
  color:#8A8889;font-weight:700;
}
.btn{
  display:inline-block;background:var(--ink);color:#fff;border-radius:999px;
  padding:9px 18px;font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  transition:transform .12s ease,background .2s ease;
}
.btn:hover{background:var(--hover);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.lg{padding:15px 30px;font-size:15px}
@media (max-width:760px){.menu{display:none}}

/* ══ 히어로 ══ */
.hero{text-align:center;padding:64px 0 72px}
.portrait{
  display:block;margin:0 auto 12px;width:clamp(92px,15vw,128px);height:auto;
  animation:portraitIn .7s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes portraitIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{margin:0;font-size:clamp(38px,8.4vw,72px);font-weight:900;letter-spacing:-.028em;line-height:1.06}
.hero .sub{margin:22px auto 0;font-size:clamp(15px,3.8vw,18px);color:var(--ink-2);max-width:32em;font-weight:500}
.cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}

.hero .sub b{color:var(--ink);font-weight:800}

/* ══ 섹션 공통 ══ */
section{padding:78px 0}
.sec-head{text-align:center;margin-bottom:40px}
.sec-head .tag{font-family:var(--fs-num);font-size:11.5px;letter-spacing:.18em;color:var(--ink-3);font-weight:700}
.sec-head h2{margin:10px 0 0;font-size:clamp(24px,5.6vw,34px);font-weight:900;letter-spacing:-.045em;line-height:1.25}
.sec-head p{margin:12px 0 0;font-size:14.5px;color:var(--ink-2)}

/* ══ 이런 분께 ══ */
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.need{border:1px solid var(--rule);border-radius:14px;padding:26px 22px;background:var(--paper)}
.need .n{font-family:var(--fs-num);font-size:12px;color:var(--ink-3);font-weight:700}
.need h3{margin:10px 0 8px;font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.4}
.need p{margin:0;font-size:14px;color:var(--ink-2)}

/* ══ 없앤 일 카드 ══ */
.works{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.work{
  border:1px solid var(--rule);border-radius:14px;padding:26px 24px;display:block;background:var(--paper);
  transition:border-color .2s ease,transform .15s ease,box-shadow .2s ease;
}
/* 호버 반응은 실제로 눌리는 카드(a.work)에만. article.work는 읽기 전용입니다. */
a.work:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.06)}
.work.now{border:1.5px dashed var(--ink);background:var(--paper-2)}
.work.now .cut{background:var(--ink);color:#fff;border-radius:999px;padding:2px 10px}
.work-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.work h3{
  margin:0;font-size:18.5px;font-weight:800;letter-spacing:-.035em;
  background-image:linear-gradient(var(--marker),var(--marker));
  background-repeat:no-repeat;background-size:0% 40%;background-position:0 80%;transition:background-size .3s ease;
}
a.work:hover h3{background-size:100% 40%}
.cut{flex:none;font-family:var(--fs-num);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.work dl{margin:14px 0 0;display:grid;grid-template-columns:52px 1fr;gap:5px 12px;font-size:14px}
.work dt{color:var(--ink-2);font-size:12px;padding-top:2px}
.work dd{margin:0}
.tags{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.tag-s{font-family:var(--fs-num);font-size:11px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:2px 9px}

/* ══ 일하는 방식 ══ */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.step{padding:30px 24px;position:relative}
.step + .step{border-left:1px solid var(--rule)}
.step b{font-family:var(--fs-num);font-size:12px;color:var(--ink-3)}
.step h3{margin:8px 0 8px;font-size:18px;font-weight:800;letter-spacing:-.03em}
.step p{margin:0;font-size:14px;color:var(--ink-2)}

/* ══ 딴짓 ══ */
.play{
  border:1px solid var(--ink);border-radius:14px;padding:30px;display:flex;
  align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--paper-2);
  transition:background .2s ease;
}
.play:hover{background:var(--paper)}
.play h3{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.035em}
.play p{margin:0;font-size:14px;color:var(--ink-2);max-width:34em}

/* ══ 문의 밴드 ══ */
.band{background:var(--ink);color:#fff;text-align:center;padding:76px 0}
.band h2{margin:0;font-size:clamp(24px,5.6vw,34px);font-weight:900;letter-spacing:-.045em;line-height:1.3}
.band p{margin:14px 0 0;color:#B0AEAF;font-size:15px}
.band .btn{background:#fff;color:var(--ink);margin-top:28px}
.band .btn:hover{background:var(--hover);color:#fff}

/* ══ 제보 폼 (어두운 밴드 안) ══ */
.ask{max-width:560px;margin:30px auto 0;text-align:left}
.ask label{display:block;margin-bottom:14px}
.ask label > span{
  display:block;font-size:12.5px;font-weight:700;color:#B0AEAF;
  letter-spacing:-.01em;margin-bottom:6px;
}
.ask label > span em{font-style:normal;font-size:11px;color:#8A8889;margin-left:4px}
.ask input,.ask textarea{
  width:100%;font-family:var(--fs);font-size:15px;line-height:1.6;color:var(--ink);
  background:var(--paper);border:1.5px solid transparent;border-radius:10px;
  padding:12px 14px;transition:border-color .15s ease;
}
.ask textarea{resize:vertical;min-height:64px}
.ask input::placeholder,.ask textarea::placeholder{color:var(--ink-3)}
.ask input:focus,.ask textarea:focus{outline:none;border-color:#B0AEAF}
.ask-row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ask .btn{width:100%;margin-top:6px;border:0;cursor:pointer;font-family:var(--fs)}
.ask .btn[disabled]{opacity:.55;cursor:default}
.ask .btn[disabled]:hover{background:#fff;color:var(--ink);transform:none}
.ask-msg{min-height:1.2em;margin:12px 0 0;font-size:13.5px;color:#B0AEAF;text-align:center}
.ask-msg.bad{color:#fff;font-weight:700}
.ask-trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:520px){.ask-row{grid-template-columns:1fr}}

/* ══ 푸터 ══ */
footer{border-top:1px solid var(--rule);padding:26px 0 32px;font-size:12px;color:var(--ink-2);font-family:var(--fs-num)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* ══ 모바일 하단 고정 버튼 ══ */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--rule);
}
.dock .btn{display:block;text-align:center;padding:14px}
@media (max-width:760px){
  .burger{display:flex}
  .dock{display:block}
  .needs,.works,.steps{grid-template-columns:1fr}
  .steps .step + .step{border-left:0;border-top:1px solid var(--rule)}
  /* 아래에 같은 버튼이 고정으로 뜨므로 위쪽 것은 숨겨 이름 자리를 냅니다 */
  .gnb .btn{display:none}
  section{padding:56px 0}
  footer{padding-bottom:96px}   /* 하단 고정 버튼에 가리지 않게 */
}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:1080px){.menu{gap:26px}}
@media (min-width:761px){.drawer{display:none!important}}
@media (prefers-reduced-motion:reduce){
  .portrait{animation:none}
  .menu > li > a::after{transition:none}
  .sub{transition:none}
  html{scroll-behavior:auto}
  .btn:hover,a.work:hover{transform:none}
}


/* ══ 서브페이지 머리말 ══ */
.page-head{border-bottom:1px solid var(--rule);padding:56px 0 40px}
.page-head .tag{font-family:var(--fs-num);font-size:11.5px;letter-spacing:.18em;color:var(--ink-3);font-weight:700}
.page-head h1{margin:10px 0 0;font-size:clamp(30px,6.4vw,46px);letter-spacing:-.035em;line-height:1.15}
.page-head p{margin:14px 0 0;font-size:15.5px;color:var(--ink-2);max-width:34em}

/* 현재 보고 있는 메뉴 */
.menu > li > a.on{color:var(--ink)}
.menu > li > a.on::after{transform:scaleX(1)}
.drawer a.on{color:#fff;text-decoration:underline;text-underline-offset:5px}

/* 홈의 길잡이 카드 */
.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.guide a{
  border:1px solid var(--rule);border-radius:14px;padding:26px 24px;background:var(--paper);
  transition:border-color .2s ease,transform .15s ease,box-shadow .2s ease;
}
.guide a:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 10px 26px rgba(51,49,50,.07)}
.guide h3{margin:0 0 8px;font-size:19px;font-weight:800;letter-spacing:-.035em}
.guide p{margin:0;font-size:14px;color:var(--ink-2)}
.guide .more{display:inline-block;margin-top:14px;font-size:13px;font-weight:800}
@media (max-width:760px){.guide{grid-template-columns:1fr}}


/* ══ 홈: 이번 주 배너 ══ */
.week{
  background:var(--ink);color:#fff;border-radius:18px;padding:clamp(26px,4vw,38px);
  display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,38px);align-items:start;
}
.week-no{font-family:var(--fs-num);font-size:clamp(40px,9vw,62px);font-weight:800;line-height:.88;letter-spacing:-.04em}
.week-no small{
  display:block;font-family:var(--fs);font-size:11px;font-weight:700;
  letter-spacing:.2em;color:#918F90;margin-bottom:10px;
}
.week h2{margin:0 0 8px;font-size:clamp(20px,4.4vw,27px);font-weight:900;letter-spacing:-.04em;line-height:1.3}
.week p{margin:0;color:#B6B4B5;font-size:15px;max-width:36em}
.week dl{margin:18px 0 0;display:grid;grid-template-columns:56px 1fr;gap:5px 14px;font-size:14px}
.week dt{color:#918F90;font-size:12px;padding-top:2px}
.week dd{margin:0;color:#EDECEC}
.days{display:flex;gap:6px;margin-top:22px;align-items:center}
.days i{display:block;width:clamp(26px,5vw,40px);height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
.days i.on{background:#fff}
.days b{font-family:var(--fs-num);font-size:11px;color:#918F90;font-weight:600;margin-left:8px}
@media (max-width:620px){.week{grid-template-columns:1fr;gap:16px}}

/* ══ 좌우 배치 섹션 머리 ══ */
.sec-head.row{
  display:flex;justify-content:space-between;align-items:flex-end;
  text-align:left;gap:16px;flex-wrap:wrap;
}
.sec-head.row > div{flex:1 1 auto}
.more-link{font-size:13.5px;font-weight:800;white-space:nowrap;border-bottom:2px solid var(--ink);padding-bottom:1px}

/* ══ 한 줄 목록 ══ */
.mini{border-top:1px solid var(--rule)}
.mini a{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  border-bottom:1px solid var(--rule);padding:17px 2px;
  font-size:16px;font-weight:700;letter-spacing:-.025em;transition:padding .18s ease;
}
.mini a:hover{padding-left:8px}
.mini span{font-family:var(--fs-num);font-size:12.5px;color:var(--ink-3);font-weight:600}

/* ══ 로그인 문 ══ */
.gate{position:fixed;inset:0;z-index:200;background:var(--ink);display:grid;place-items:center;padding:24px}
.gate-box{width:min(340px,100%);display:flex;flex-direction:column;gap:10px;text-align:center}
.gate-box b{font-size:22px;font-weight:900;letter-spacing:-.04em;color:#fff}
.gate-box p{margin:0 0 6px;font-size:14px;color:#B0AEAF}
.gate-box input{
  font-family:var(--fs);font-size:16px;text-align:center;color:var(--ink);
  background:var(--paper);border:1.5px solid transparent;border-radius:10px;padding:13px 14px;
}
.gate-box input:focus{outline:none;border-color:#B0AEAF}
.gate-box .btn{background:#fff;color:var(--ink);border:0;cursor:pointer;font-family:var(--fs)}
.gate-box .btn:hover{background:var(--hover);color:#fff}
.gate-msg{min-height:1.2em;font-size:13px;color:#B0AEAF}
.gate-msg.bad{color:#fff;font-weight:700}

/* ══ 머리말 (얇은 형) ══ */
.page-head.slim{padding:34px 0 26px}
.page-head.slim h1{font-size:clamp(24px,5vw,34px)}
.page-head.slim p{font-size:14.5px}

/* 메인은 머리말 없이 업무 목록부터 시작합니다 */
.board{padding-top:36px}

/* ══ 리마인더 판 ══ */
.board{padding-top:30px;padding-bottom:10px}
.board-load{padding:40px 2px;color:var(--ink-2);font-size:14.5px;text-align:center}
.board-load.bad{color:var(--ink)}
.board-empty{
  border:1.5px dashed var(--rule);border-radius:16px;padding:48px 24px;text-align:center;
}
.board-empty b{display:block;font-size:19px;font-weight:800;letter-spacing:-.035em}
.board-empty p{margin:10px 0 22px;font-size:14px;color:var(--ink-2);line-height:1.7}
.board-empty .btn{border:0;cursor:pointer;font-family:var(--fs)}

.blk{padding:0 0 34px}
.blk-head{margin-bottom:12px}
.blk-head .tag{font-family:var(--fs-num);font-size:11px;letter-spacing:.18em;color:var(--ink-3);font-weight:700}
.blk-head h2{margin:6px 0 0;font-size:20px;font-weight:900;letter-spacing:-.04em}
.blk-head p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.blk.warn .blk-head h2::before{content:'⚠ ';font-size:16px}

.tks{border-top:1.5px solid var(--ink)}
.tk{
  display:flex;gap:13px;align-items:flex-start;
  border-bottom:1px solid var(--rule);padding:14px 2px;transition:opacity .15s ease;
}
.tk.busy{opacity:.45;pointer-events:none}
.tk-check{
  flex:none;width:20px;height:20px;margin-top:2px;padding:0;
  border:1.5px solid var(--ink-3);border-radius:50%;background:var(--paper);cursor:pointer;
  display:grid;place-items:center;transition:border-color .15s ease,background .15s ease;
}
.tk-check:hover{border-color:var(--ink);background:var(--paper-2)}
.tk-check span{width:8px;height:8px;border-radius:50%;background:transparent;transition:background .15s ease}
.tk-check:hover span{background:var(--ink)}
.tk-check.done{border-color:var(--ink-3);color:var(--ink-3);font-size:12px;cursor:default;background:transparent}

.tk-body b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.025em;line-height:1.5}

/* ══ 등록 창 ══ */
.modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px}
.modal-bg{position:absolute;inset:0;background:rgba(23,21,22,.55);backdrop-filter:blur(2px)}
.modal-box{
  position:relative;width:min(480px,100%);max-height:88vh;overflow-y:auto;
  background:var(--paper);border-radius:18px;padding:24px;
  box-shadow:0 24px 60px rgba(51,49,50,.3);

.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head b{font-size:19px;font-weight:900;letter-spacing:-.04em}
.modal-x{
  width:30px;height:30px;line-height:1;border:0;background:transparent;

.modal-box label > span{

}

}

.modal-box input:focus,.modal-box textarea:focus{outline:none;border-color:var(--ink)}
.modal-box input::placeholder,.modal-box textarea::placeholder{color:var(--ink-3)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.modal-box .btn{width:100%;margin-top:4px;border:0;cursor:pointer;font-family:var(--fs)}
.modal-msg{min-height:1.1em;margin:10px 0 0;font-size:13px;color:var(--ink-2);text-align:center}
.modal-msg.bad{color:var(--ink);font-weight:700}
.when-read{margin:-6px 0 12px;font-size:12.5px;color:var(--ink-3);min-height:1.2em}
.when-read.ok{color:var(--ink);font-weight:700}

.toast-go{

}

.isu-form{max-width:640px}
.isu-form label{display:block;margin-bottom:12px}
.isu-form label > span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}

}

.switch-t{font-size:13.5px;color:var(--ink-2);line-height:1.6}

/* ══ 화면 위 쪽지 (알림 권한이 없을 때) ══ */

<body>

<div id="site-header"></div>

<div class="wrap board" id="board"></div>

<div class="wrap">
  <div class="sec-head row" style="margin-top:8px">
    <div>
      <span class="tag">CALENDAR</span>
      <h2>이번 달</h2>
      <p>점이 찍힌 날에 할 일이 있습니다</p>
    </div>
  </div>
  <div class="home-rem">
    <div class="mini" id="homeReminder"></div>
    <div class="cal" id="homeCal"></div>
  </div>

  <p class="attic-line">잠깐 쉬어가려면 — <a href="attic.html">딴짓 창고</a></p>
</div>

<div class="wrap"><p style="font-size:12px;color:var(--ink-3);text-align:center;padding:0 0 8px">미리보기 파일입니다. 메뉴 링크는 폴더째 올린 뒤 동작합니다.</p></div>
<div id="site-footer"></div>

<script>
/* ══════════════════════════════════════════════════════════
   메뉴는 여기 한 곳에서만 고치면 모든 페이지에 반영됩니다.
   file  : 연결할 파일 이름
   name  : 화면에 보이는 이름
   sub   : 하위 메뉴 (없으면 생략)
   ══════════════════════════════════════════════════════════ */
const SITE = {
  logo: 'ㄱㅍㄹ',
  title: '일 잘하는 강프로',
  /* 오른쪽 위 버튼 — 링크가 아니라 업무 등록 창을 엽니다 */
  cta: { name: '＋ 잊지 말 업무', newtask: true },
  menu: [
    { file:'index.html', name:'업무 리마인더', sub:[
      { file:'index.html#late',   name:'지났는데 안 끝난 것' },
      { file:'index.html#soon',   name:'오늘·이번 주' },
      { file:'index.html#follow', name:'후속 조치' },
      { file:'index.html#stale',  name:'오래 안 본 업무' },
      { file:'index.html#done',   name:'지난주에 한 일' }
    ]},
    { file:'issues.html', name:'불편사항 & 개선', sub:[
      { file:'issues.html#write',   name:'불편한 점 적기' },
      { file:'issues.html#list',    name:'모인 불편' },
      { file:'issues.html#done',    name:'개선한 것' }
    ]},
    { file:'reminder.html', name:'반복 업무', sub:[
      { file:'reminder.html#alert',   name:'알림 받기' },
      { file:'reminder.html#month',   name:'월별 할 일' },
      { file:'reminder.html#always',  name:'매달 반복' }
    ]},
    { file:'files.html',  name:'자료실', sub:[
      { file:'files.html#form',     name:'리포트 서식' },
      { file:'files.html#reply',    name:'응대 문구 모음' },
      { file:'files.html#template', name:'QR 안내물 템플릿' }
    ]},
    { file:'attic.html',  name:'딴짓 창고', sub:[
      { file:'game.html', name:'모눈 회피 게임' },
      { file:'attic.html#wip', name:'만들다 만 것들' }
    ]}
  ]
};

(function(){
  const here = (location.pathname.split('/').pop() || 'index.html');
  const isOn = f => f.split('#')[0] === here;
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

  /* 오른쪽 위 버튼. newtask면 업무 등록 창을 열고, 아니면 링크로 갑니다. */
  const ctaHtml = () => SITE.cta.newtask
    ? '<button class="btn" type="button" data-newtask>' + esc(SITE.cta.name) + '</button>'
    : '<a class="btn" href="' + SITE.cta.file + '">' + esc(SITE.cta.name) + '</a>';

  /* ── 상단 바 ── */
  let nav = '<nav class="gnb"><div class="wrap">'
    + '<a class="logo" href="index.html" aria-label="' + esc(SITE.title) + ' — 홈으로">'
    +   '<span>' + esc(SITE.title) + '</span>'
    + '</a>'
    + '<ul class="menu">';

  for(const m of SITE.menu){
    const on = isOn(m.file) ? ' on' : '';
    if(m.sub && m.sub.length){
      nav += '<li class="has-sub"><a class="' + on.trim() + '" href="' + m.file + '">' + esc(m.name) + ' <em>▾</em></a>'
           + '<div class="sub"><ul>'
           + m.sub.map(x => '<li><a href="' + x.file + '">' + esc(x.name) + '</a></li>').join('')
           + '</ul></div></li>';
    }else{
      nav += '<li><a class="' + on.trim() + '" href="' + m.file + '">' + esc(m.name) + '</a></li>';
    }
  }

  nav += '</ul><div class="gnb-right">'
      + ctaHtml()
      + '<button class="burger" id="burger" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button>'
      + '</div></div></nav>';

  /* ── 모바일 서랍 ── */
  let drawer = '<div class="drawer" id="drawer" hidden><div class="drawer-in">';
  for(const m of SITE.menu){
    drawer += '<p>' + esc(m.name) + '</p>'
           + '<a class="' + (isOn(m.file)?'on':'') + '" href="' + m.file + '">' + esc(m.name) + ' 전체보기</a>';
    if(m.sub) drawer += m.sub.map(x => '<a href="' + x.file + '">' + esc(x.name) + '</a>').join('');
  }
  drawer += '</div></div>';

  const head = document.getElementById('site-header');
  if(head) head.outerHTML = nav + drawer;

  /* ── 아래 고정 버튼 + 푸터 ── */
  const foot = document.getElementById('site-footer');
  if(foot){
    foot.outerHTML =
      '<footer><div class="wrap">'
      + '<span>© 2026 강프로</span>'
      + '<span>이 페이지도 직접 만들었습니다</span>'
      + '</div></footer>'
      + '<div class="dock">' + ctaHtml() + '</div>';
  }

  /* ── 햄버거 동작 ── */
  const burger = document.getElementById('burger');
  const dw = document.getElementById('drawer');
  if(burger && dw){
    const setOpen = open => {
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      burger.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
      dw.hidden = !open;
      document.body.style.overflow = open ? 'hidden' : '';
    };
    burger.addEventListener('click', ()=> setOpen(dw.hidden));
    dw.addEventListener('click', e=>{ if(e.target.tagName==='A') setOpen(false); });
    addEventListener('keydown', e=>{ if(e.key==='Escape' && !dw.hidden) setOpen(false); });
    addEventListener('resize', ()=>{ if(innerWidth>760 && !dw.hidden) setOpen(false); });
  }
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   Supabase 연결 정보.

   여기 있는 키는 "공개 키(publishable)"입니다. 브라우저에 노출되라고
   만들어진 값이라 저장소에 그대로 올려도 됩니다.

   ★ 데이터베이스 비밀번호와 비밀 키(secret / service_role)는
     절대로 이 파일에 넣지 마십시오. 이 사이트는 정적 파일이라
     넣는 즉시 누구나 볼 수 있습니다.

   무엇을 넣고 읽을 수 있는지는 이 키가 아니라 데이터베이스 쪽
   RLS 정책이 정합니다. supabase/schema.sql을 보십시오.
   ══════════════════════════════════════════════════════════ */
const SUPABASE = {

<script>
/* ══════════════════════════════════════════════════════════
   로그인과 데이터 읽기·쓰기.

   팀이 공유하는 계정 하나로 로그인합니다.
   화면에서는 암호 한 칸만 물어보고, 계정 주소는 아래 설정에서 가져옵니다.

   ★ 왜 자바스크립트로 암호를 비교하지 않는가
     그렇게 하면 화면만 가릴 뿐 데이터는 못 지킵니다. 공개 키가 소스에
     들어 있어서, 사이트를 거치지 않고 데이터베이스에 직접 물어보면
     그대로 읽힙니다. 그래서 진짜 로그인을 씁니다. 암호가 틀리면
     서버가 토큰을 주지 않고, 토큰이 없으면 아무것도 읽히지 않습니다.

   외부 라이브러리를 쓰지 않습니다. Supabase의 REST 규격을 직접 부릅니다.
   ══════════════════════════════════════════════════════════ */
const DB = (function(){
  const BASE = SUPABASE.url.replace(/\/rest\/v1\/?$/, '');   // 프로젝트 루트
  const REST = BASE + '/rest/v1';
  const AUTH = BASE + '/auth/v1';
  const KEY  = SUPABASE.key;

  /* ── 저장 (막힌 환경이면 메모리로) ── */
  const mem = {};
  const store = {
    get(k){ try{ const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; }
            catch(e){ return mem[k] ?? null; } },
    set(k,v){ mem[k] = v; try{ localStorage.setItem(k,v); }catch(e){} },
    del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
  };
  const SKEY = 'kp.session';

  let session = (function(){
    try{ return JSON.parse(store.get(SKEY) || 'null'); }catch(e){ return null; }
  })();

  function keep(s){
    session = s
      ? { access_token:s.access_token, refresh_token:s.refresh_token,
          expires_at: Date.now() + (s.expires_in || 3600) * 1000 - 60000 }
      : null;
    if(session) store.set(SKEY, JSON.stringify(session));
    else store.del(SKEY);
  }

  /* ── 로그인 ── */
  async function login(password){
    const res = await fetch(AUTH + '/token?grant_type=password', {
      method:'POST',
      headers:{ 'apikey':KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email: SUPABASE.teamEmail, password: password })
    });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      const raw = (e.error_description || e.msg || e.message || '').toLowerCase();
      throw new Error(
        raw.includes('invalid login')   ? '암호가 맞지 않습니다.'
      : raw.includes('email not confirmed') ? '계정이 아직 확인되지 않았습니다. 대시보드에서 Auto Confirm을 켜주십시오.'
      : raw.includes('too many')       ? '시도가 잦습니다. 잠시 뒤 다시 해주십시오.'
      : raw.includes('failed to fetch')? '연결하지 못했습니다. 인터넷을 확인해 주십시오.'
      : '들어가지 못했습니다. 잠시 뒤 다시 해주십시오.'
      );
    }
    keep(await res.json());
    return true;
  }

  function logout(){ keep(null); }

  /* ── 토큰 갱신 ── */
  async function refresh(){
    if(!session?.refresh_token) return false;
    const res = await fetch(AUTH + '/token?grant_type=refresh_token', {
      method:'POST',
      headers:{ 'apikey':KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if(!res.ok){ keep(null); return false; }
    keep(await res.json());
    return true;
  }

  async function token(){
    if(!session) return null;
    if(Date.now() >= session.expires_at && !(await refresh())) return null;
    return session.access_token;
  }

  const isIn = () => !!session;

  /* ── 표 다루기 ──
     q('tasks', {select, order, eq, ...})  읽기
     insert / update / remove              쓰기
     모두 로그인 토큰을 붙입니다. 없으면 서버가 거절합니다. */
  async function call(path, opts, retried){
    const t = await token();
    if(!t) throw new Error('로그인이 필요합니다.');

    const res = await fetch(REST + path, Object.assign({}, opts, {
      headers: Object.assign({
        'apikey': KEY,
        'Authorization': 'Bearer ' + t,
        'Content-Type': 'application/json'
      }, (opts && opts.headers) || {})
    }));

    if(res.ok) return res.status === 204 ? null : res.json().catch(()=>null);

    const e = await res.json().catch(()=>({}));
    const raw = (e.message || e.msg || '').toLowerCase();

    /* 토큰이 거절되는 경우가 있습니다. 흔한 것이 'JWT issued at future' 로,
       발급 시각이 서버 기준으로 미래라 생깁니다(시계 어긋남).
       한 번은 새 토큰을 받아 조용히 다시 시도합니다. */
    const badToken = res.status === 401 || res.status === 403
      || raw.includes('jwt') || raw.includes('token');
    if(badToken && !retried){
      if(await refresh()) return call(path, opts, true);
      keep(null);                                  // 갱신도 안 되면 다시 로그인받습니다
      throw new Error('로그인이 풀렸습니다. 새로고침한 뒤 암호를 다시 넣어주십시오.');
    }

    throw new Error(
      raw.includes('jwt') ? '인증이 거절됐습니다. 새로고침해 주십시오.'
                          : (e.message || '요청 실패 (' + res.status + ')')
    );
  }

  const q = (table, query) => call('/' + table + (query ? '?' + query : ''), { method:'GET' });

  const insert = (table, row) => call('/' + table, {
    method:'POST', headers:{ 'Prefer':'return=representation' },
    body: JSON.stringify(row)
  });

  const update = (table, query, patch) => call('/' + table + '?' + query, {
    method:'PATCH', headers:{ 'Prefer':'return=representation' },
    body: JSON.stringify(patch)
  });

  const remove = (table, query) => call('/' + table + '?' + query, { method:'DELETE' });

  /* ── 암호 물어보는 화면 ──
     로그인이 필요한 페이지에서 DB.gate()를 부르면
     로그인될 때까지 화면을 덮고, 끝나면 done()을 실행합니다. */
  function gate(done){
    if(isIn()){ done(); return; }

    const el = document.createElement('div');
    el.className = 'gate';
    el.innerHTML =
      '<form class="gate-box">'
      + '<b>일 잘하는 강프로</b>'
      + '<p>팀 암호를 입력하십시오.</p>'
      + '<input type="password" id="gatePw" autocomplete="current-password" '
      +   'placeholder="암호" aria-label="팀 암호" required>'
      + '<button class="btn lg" type="submit">들어가기</button>'
      + '<span class="gate-msg" role="status" aria-live="polite"></span>'
      + '</form>';
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';

    const form = el.querySelector('form');
    const pw   = el.querySelector('#gatePw');
    const msg  = el.querySelector('.gate-msg');
    const btn  = el.querySelector('button');
    pw.focus();

    form.addEventListener('submit', async e => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = '확인 중입니다…';
      msg.classList.remove('bad');
      try{
        await login(pw.value);
        el.remove();
        document.body.style.overflow = '';
        done();
      }catch(err){
        msg.textContent = err.message;
        msg.classList.add('bad');
        pw.select();
      }finally{
        btn.disabled = false;
      }
    });
  }

  return { login, logout, isIn, q, insert, update, remove, gate };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   "언제" 를 사람 말로 받습니다.

   "3일 뒤", "다음 주 금요일", "매주 금요일", "매달 25일", "9/15"
   같은 입력을 날짜와 반복 규칙으로 바꿉니다.

   parseWhen('매주 금요일')
     → { due_on:'2026-08-28', repeat:'weekly:5', label:'매주 금요일' }

   못 알아들으면 null을 돌려줍니다. 그때는 화면에서 날짜를 직접 고르게 합니다.
   ══════════════════════════════════════════════════════════ */
const WHEN = (function(){
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const midnight = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const plus = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

  const DOW = ['일','월','화','수','목','금','토'];

  /* 숫자 — 아라비아 숫자와 한글 수를 모두 받습니다 */
  const WORD = {
    '하루':1, '이틀':2, '사흘':3, '나흘':4, '닷새':5, '엿새':6, '이레':7,
    '여드레':8, '아흐레':9, '열흘':10,
    '한':1, '두':2, '세':3, '네':4, '다섯':5, '여섯':6, '일곱':7,
    '여덟':8, '아홉':9, '열':10
  };
  function num(s){
    if(s == null) return null;
    s = String(s).trim();
    if(/^\d+$/.test(s)) return parseInt(s,10);
    return WORD[s] ?? null;
  }

  /* 그 주의 특정 요일 — week 0=이번 주, 1=다음 주 */
  function dowDate(dow, week){
    const t = midnight();
    const mon = plus(t, -((t.getDay() + 6) % 7));      // 이번 주 월요일
    const base = plus(mon, week * 7);
    const want = plus(base, (dow + 6) % 7);            // 월요일 기준 자리
    // 이번 주인데 이미 지났으면 다음 주로 넘깁니다
    return (week === 0 && want < t) ? plus(want, 7) : want;
  }

  function parseWhen(input){
    if(!input) return null;
    const s = String(input).trim().replace(/\s+/g,' ');
    if(!s) return null;
    const T = midnight();

    /* ── 반복 ────────────────────────────────────── */
    if(/^매일|날마다$/.test(s) || /^매일/.test(s))
      return { due_on: ymd(T), repeat:'daily', label:'매일' };

    let m = s.match(/^매주\s*([일월화수목금토])(요일)?$/);
    if(m){
      const d = DOW.indexOf(m[1]);
      return { due_on: ymd(dowDate(d, 0)), repeat:'weekly:'+d, label:'매주 '+m[1]+'요일' };
    }

    m = s.match(/^(?:매달|매월)\s*(\d{1,2})\s*일?$/);
    if(m){
      const day = Math.min(parseInt(m[1],10), 28);
      const next = new Date(T.getFullYear(), T.getMonth(), day);
      return {
        due_on: ymd(next < T ? new Date(T.getFullYear(), T.getMonth()+1, day) : next),
        repeat: 'monthly:'+day, label:'매달 '+day+'일'
      };
    }
    if(/^(매달|매월)\s*(말일?|마지막)$/.test(s))
      return { due_on: ymd(new Date(T.getFullYear(), T.getMonth()+1, 0)),
               repeat:'monthly:28', label:'매달 말' };

    m = s.match(/^매년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일?$/);
    if(m){
      const mm = +m[1], dd = +m[2];
      const next = new Date(T.getFullYear(), mm-1, dd);
      return {
        due_on: ymd(next < T ? new Date(T.getFullYear()+1, mm-1, dd) : next),
        repeat: 'yearly:'+pad(mm)+'-'+pad(dd), label:'매년 '+mm+'월 '+dd+'일'
      };
    }

    /* ── 한 번만 ─────────────────────────────────── */
    if(/^오늘$/.test(s))  return { due_on: ymd(T),         repeat:null, label:'오늘' };
    if(/^내일$/.test(s))  return { due_on: ymd(plus(T,1)), repeat:null, label:'내일' };
    if(/^모레$/.test(s))  return { due_on: ymd(plus(T,2)), repeat:null, label:'모레' };
    if(/^글피$/.test(s))  return { due_on: ymd(plus(T,3)), repeat:null, label:'글피' };

    // "이틀 뒤", "사흘 후", "열흘 뒤" — 수와 단위가 한 낱말인 경우
    m = s.match(/^(하루|이틀|사흘|나흘|닷새|엿새|이레|여드레|아흐레|열흘)\s*(뒤|후|있다가|지나서)$/);
    if(m) return { due_on: ymd(plus(T, WORD[m[1]])), repeat:null, label: m[1] + ' 뒤' };

    // "3일 뒤", "일주일 뒤", "2주 후", "한 달 뒤"
    m = s.match(/^(\S+?)\s*(일|주일?|개월|달)\s*(뒤|후|있다가|지나서)$/);
    if(m){
      const n = num(m[1]) ?? (m[1] === '일' ? 1 : null);
      if(n != null){
        const unit = m[2];
        if(unit === '일'){
          return { due_on: ymd(plus(T,n)), repeat:null, label:n+'일 뒤' };
        }
        if(unit.startsWith('주')){
          return { due_on: ymd(plus(T,n*7)), repeat:null, label:n+'주 뒤' };
        }
        const d = new Date(T); d.setMonth(d.getMonth()+n);
        return { due_on: ymd(d), repeat:null, label:n+'개월 뒤' };
      }
    }
    // "일주일 뒤"처럼 수가 앞에 붙은 형태
    m = s.match(/^일\s*주일?\s*(뒤|후)$/);
    if(m) return { due_on: ymd(plus(T,7)), repeat:null, label:'일주일 뒤' };

    // "이번 주 금요일", "다음 주 월요일", "담주 화요일"
    m = s.match(/^(이번|금|다음|담|차)\s*주\s*([일월화수목금토])(요일)?$/);
    if(m){
      const week = /이번|금/.test(m[1]) ? 0 : 1;
      const d = DOW.indexOf(m[2]);
      return { due_on: ymd(dowDate(d, week)), repeat:null,
               label:(week ? '다음 주 ' : '이번 주 ') + m[2] + '요일' };
    }
    if(/^(다음|담)\s*주$/.test(s))
      return { due_on: ymd(dowDate(1,1)), repeat:null, label:'다음 주 월요일' };
    if(/^(이번|금)\s*주\s*(말|끝)$/.test(s))
      return { due_on: ymd(dowDate(5,0)), repeat:null, label:'이번 주 금요일' };

    // "다음 달"
    if(/^(다음|담)\s*(달|월)$/.test(s)){
      const d = new Date(T.getFullYear(), T.getMonth()+1, 1);
      return { due_on: ymd(d), repeat:null, label:'다음 달 1일' };
    }
    // "월말", "이번 달 말"
    if(/^(월말|이번\s*달\s*말)$/.test(s))
      return { due_on: ymd(new Date(T.getFullYear(), T.getMonth()+1, 0)), repeat:null, label:'이번 달 말' };

    /* ── 날짜를 그대로 적은 경우 ──────────────────── */
    m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);
    if(m){
      const d = new Date(+m[1], +m[2]-1, +m[3]);
      return { due_on: ymd(d), repeat:null, label: m[2]+'월 '+m[3]+'일' };
    }
    m = s.match(/^(\d{1,2})\s*[/월]\s*(\d{1,2})\s*일?$/);
    if(m){
      const mm = +m[1], dd = +m[2];
      const y = new Date(T.getFullYear(), mm-1, dd) < T ? T.getFullYear()+1 : T.getFullYear();
      return { due_on: ymd(new Date(y, mm-1, dd)), repeat:null, label: mm+'월 '+dd+'일' };
    }

    return null;
  }

  /* 반복 규칙을 사람이 읽는 말로 */
  function repeatLabel(rule){
    if(!rule) return '';
    if(rule === 'daily') return '매일';
    let m = rule.match(/^weekly:(\d)$/);
    if(m) return '매주 ' + DOW[+m[1]] + '요일';
    m = rule.match(/^monthly:(\d{1,2})$/);
    if(m) return '매달 ' + m[1] + '일';
    m = rule.match(/^yearly:(\d{2})-(\d{2})$/);
    if(m) return '매년 ' + (+m[1]) + '월 ' + (+m[2]) + '일';
    return rule;
  }

  /* 반복 업무를 끝냈을 때 다음 차례가 언제인지 */
  function nextDue(rule, from){
    if(!rule) return null;
    const base = from ? new Date(from + 'T00:00:00') : midnight();
    if(rule === 'daily') return ymd(plus(base,1));

    let m = rule.match(/^weekly:(\d)$/);
    if(m){
      const want = +m[1];
      let d = plus(base,1);
      while(d.getDay() !== want) d = plus(d,1);
      return ymd(d);
    }
    m = rule.match(/^monthly:(\d{1,2})$/);
    if(m) return ymd(new Date(base.getFullYear(), base.getMonth()+1, +m[1]));

    m = rule.match(/^yearly:(\d{2})-(\d{2})$/);
    if(m) return ymd(new Date(base.getFullYear()+1, +m[1]-1, +m[2]));
    return null;
  }

  /* 남은 날을 사람 말로 — 목록에 붙이는 꼬리표 */
  function untilLabel(due){
    if(!due) return { text:'날짜 없음', tone:'none' };
    const d = new Date(due + 'T00:00:00');
    const days = Math.round((d - midnight()) / 86400000);
    if(days < -1) return { text:(-days) + '일 지남', tone:'late' };
    if(days === -1) return { text:'어제까지', tone:'late' };
    if(days === 0) return { text:'오늘', tone:'today' };
    if(days === 1) return { text:'내일', tone:'soon' };
    if(days <= 7) return { text:days + '일 뒤', tone:'soon' };
    return { text:(d.getMonth()+1) + '월 ' + d.getDate() + '일', tone:'far' };
  }

  return { parseWhen, repeatLabel, nextDue, untilLabel, ymd, midnight };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   '잊지 말 업무 등록' 창.

   오른쪽 위 버튼이나 [data-newtask] 를 누르면 열립니다.
   날짜는 "3일 뒤", "매주 금요일"처럼 사람 말로 적으면
   아래에 해석 결과가 바로 보입니다.
   ══════════════════════════════════════════════════════════ */
const TaskForm = (function(){
  const CATS = ['시설','총무','인사','예산','계약','안전','비품','보고','기타'];
  let box = null;

  function close(){
    box?.remove();
    box = null;
    document.body.style.overflow = '';
  }

  function open(preset){
    if(box) return;
    preset = preset || {};

    box = document.createElement('div');
    box.className = 'modal';
    box.innerHTML =
      '<div class="modal-bg" data-close></div>'
      + '<form class="modal-box" role="dialog" aria-modal="true" aria-label="잊지 말 업무 등록">'
      + '<div class="modal-head"><b>잊지 말 업무</b>'
      +   '<button type="button" class="modal-x" data-close aria-label="닫기">×</button></div>'

      + '<label><span>무슨 일입니까</span>'
      +   '<textarea name="title" rows="2" maxlength="300" required '
      +   'placeholder="예: 소화기 유효기간 확인하고 대장에 기록"></textarea></label>'

      + '<label><span>언제 <em>사람 말로 적으셔도 됩니다</em></span>'
      +   '<input name="when" maxlength="60" autocomplete="off" '
      +   'placeholder="3일 뒤 · 다음 주 금요일 · 매주 금요일 · 매달 25일 · 9/15" '
      +   'value="' + (preset.when || '') + '"></label>'
      + '<p class="when-read" id="whenRead"></p>'

      + '<div class="modal-row">'
      +   '<label><span>담당자</span>'
      +     '<input name="owner" maxlength="60" list="ownerList" autocomplete="off" placeholder="이름"></label>'
      +   '<label><span>분류</span>'
      +     '<input name="category" maxlength="40" list="catList" autocomplete="off" placeholder="고르거나 직접 입력"></label>'
      + '</div>'
      + '<datalist id="catList">' + CATS.map(c => '<option value="'+c+'">').join('') + '</datalist>'
      + '<datalist id="ownerList"></datalist>'

      + '<label><span>메모 <em>선택</em></span>'
      +   '<textarea name="note" rows="2" maxlength="2000" '
      +   'placeholder="다음에 볼 때 도움이 될 내용"></textarea></label>'

      + '<button class="btn lg" type="submit">등록</button>'
      + '<p class="modal-msg" role="status" aria-live="polite"></p>'
      + '</form>';

    document.body.appendChild(box);
    document.body.style.overflow = 'hidden';

    const form = box.querySelector('form');
    const when = form.when;
    const read = box.querySelector('#whenRead');
    const msg  = box.querySelector('.modal-msg');
    const btn  = form.querySelector('button[type=submit]');

    /* 이미 쓴 담당자 이름을 골라 쓸 수 있게 */
    DB.q('tasks', 'select=owner&owner=not.is.null&limit=200').then(rows => {
      const names = [...new Set((rows||[]).map(r => r.owner).filter(Boolean))];
      box && (box.querySelector('#ownerList').innerHTML =
        names.map(n => '<option value="'+n.replace(/"/g,'&quot;')+'">').join(''));
    }).catch(()=>{});

    /* 적는 대로 해석 결과 보여주기 */
    function readWhen(){
      const v = when.value.trim();
      if(!v){ read.textContent = '비워두면 날짜 없는 업무로 담깁니다.'; read.className = 'when-read'; return null; }
      const r = WHEN.parseWhen(v);
      if(!r){
        read.textContent = '이 말은 아직 못 알아듣습니다. 9/15 처럼 날짜로 적어주십시오.';
        read.className = 'when-read bad';
        return null;
      }
      const d = new Date(r.due_on + 'T00:00:00');
      read.textContent = '→ ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일'
        + ' (' + ['일','월','화','수','목','금','토'][d.getDay()] + ')'
        + (r.repeat ? ' 부터, ' + WHEN.repeatLabel(r.repeat) : '');
      read.className = 'when-read ok';
      return r;
    }
    when.addEventListener('input', readWhen);
    readWhen();

    box.addEventListener('click', e => { if(e.target.closest('[data-close]')) close(); });
    addEventListener('keydown', function esc(e){
      if(e.key === 'Escape'){ close(); removeEventListener('keydown', esc); }
    });
    form.title.focus();

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const title = form.title.value.trim();
      if(!title){ form.title.focus(); return; }

      const w = when.value.trim() ? WHEN.parseWhen(when.value.trim()) : null;
      if(when.value.trim() && !w){
        msg.textContent = '언제인지 알아듣지 못했습니다. 9/15 처럼 적어주십시오.';
        msg.classList.add('bad');
        when.focus();
        return;
      }

      btn.disabled = true;
      msg.className = 'modal-msg';
      msg.textContent = '담는 중입니다…';

      try{
        await DB.insert('tasks', {
          title: title,
          note: form.note.value.trim() || null,
          owner: form.owner.value.trim() || null,
          category: form.category.value.trim() || null,
          due_on: w ? w.due_on : null,
          repeat_rule: w ? w.repeat : null,
          follow_up_of: preset.follow_up_of || null
        });
        close();
        document.dispatchEvent(new CustomEvent('tasks:changed'));
      }catch(err){
        msg.textContent = err.message;
        msg.classList.add('bad');
        btn.disabled = false;
      }
    });
  }

  /* 버튼 연결 — 페이지 어디든 [data-newtask]면 열립니다 */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-newtask]');
    if(b){ e.preventDefault(); open({ follow_up_of: b.dataset.followup || null }); }
  });

  return { open, close };
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   메인 화면 — 업무 리마인더.

   들어오자마자 두 가지가 보여야 합니다.
     "오늘 뭘 해야 하지?"   "전에 하던 것 중 놓친 게 없나?"

   그래서 블록을 이 순서로 둡니다.
     ① 지났는데 안 끝남   가장 급합니다
     ② 오늘 · 이번 주
     ③ 후속 조치 필요     "그거 그 뒤로 어떻게 됐지?"
     ④ 오래 안 본 업무    묻혀버린 것
     ⑤ 지난주에 한 일     "저번 주에 뭐 했더라?"
   ══════════════════════════════════════════════════════════ */
(function(){
  const host = document.getElementById('board');
  if(!host) return;

  const STALE = 14;                 // 며칠 넘게 안 보면 '묻힌' 것으로 봅니다
  const T = WHEN.midnight();
  const ymd = WHEN.ymd;
  const shift = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

  const today   = ymd(T);
  const weekEnd = ymd(shift(T, 7));
  const staleAt = new Date(Date.now() - STALE*86400000).toISOString();
  const lastWeek= new Date(Date.now() - 7*86400000).toISOString();

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

  /* ── 한 줄 그리기 ── */
  function row(t, opt){
    opt = opt || {};
    const u = WHEN.untilLabel(t.due_on);
    const meta = [];
    if(t.owner) meta.push(esc(t.owner));
    if(t.category) meta.push(esc(t.category));
    if(t.repeat_rule) meta.push(WHEN.repeatLabel(t.repeat_rule));

    return '<div class="tk" data-id="' + t.id + '">'
      + (opt.done
          ? '<span class="tk-check done" aria-hidden="true">✓</span>'
          : '<button type="button" class="tk-check" data-do="done" aria-label="완료">'
            + '<span></span></button>')
      + '<div class="tk-body">'
      +   '<b>' + esc(t.title) + '</b>'
      +   (t.note ? '<p>' + esc(t.note) + '</p>' : '')
      +   '<span class="tk-meta">'
      +     (opt.seen
            ? '<i class="tk-when late">' + opt.seen + '</i>'
            : '<i class="tk-when ' + u.tone + '">' + u.text + '</i>')
      +     (meta.length ? '<em>' + meta.join(' · ') + '</em>' : '')
      +   '</span>'
      + '</div>'
      + (opt.done ? '' :
          '<div class="tk-acts">'
          + '<button type="button" class="tk-btn" data-do="snooze" data-n="3">3일 뒤</button>'
          + '<button type="button" class="tk-btn" data-do="snooze" data-n="7">다음 주</button>'
          + '</div>')
      + '</div>';
  }

  function block(id, tag, title, hint, rows, opt){
    if(!rows.length) return '';
    return '<section class="blk' + (opt && opt.warn ? ' warn' : '') + '" id="' + id + '">'
      + '<div class="blk-head"><span class="tag">' + tag + '</span>'
      +   '<h2>' + title + '</h2><p>' + hint + '</p></div>'
      + '<div class="tks">' + rows.join('') + '</div>'
      + '</section>';
  }

  /* ── 불러오기 ── */
  async function load(){
    host.innerHTML = '<p class="board-load">불러오는 중입니다…</p>';

    let late, soon, follow, stale, done;
    try{
      [late, soon, follow, stale, done] = await Promise.all([
        DB.q('tasks', 'select=*&status=eq.open&due_on=lt.' + today + '&order=due_on.asc&limit=50'),
        DB.q('tasks', 'select=*&status=eq.open&due_on=gte.' + today + '&due_on=lte.' + weekEnd + '&order=due_on.asc&limit=50'),
        DB.q('tasks', 'select=*&status=eq.open&follow_up_of=not.is.null&order=due_on.asc&limit=30'),
        DB.q('tasks', 'select=*&status=eq.open&last_seen_at=lt.' + staleAt + '&order=last_seen_at.asc&limit=30'),
        DB.q('tasks', 'select=*&status=eq.done&done_at=gte.' + lastWeek + '&order=done_at.desc&limit=30')
      ]);
    }catch(err){
      host.innerHTML = '<p class="board-load bad">불러오지 못했습니다. ' + esc(err.message) + '</p>';
      return;
    }

    // 후속·묻힌 업무가 위 블록과 겹치지 않게 걸러냅니다
    const shown = new Set([].concat(late, soon).map(t => t.id));
    follow = follow.filter(t => !shown.has(t.id));
    follow.forEach(t => shown.add(t.id));
    stale = stale.filter(t => !shown.has(t.id));

    const html =
        block('late',   'OVERDUE',    '지났는데 안 끝났습니다', '가장 먼저 보셔야 합니다',
              late.map(t => row(t)), {warn:true})
      + block('soon',   'THIS WEEK',  '오늘과 이번 주',         '앞으로 7일',
              soon.map(t => row(t)))
      + block('follow', 'FOLLOW UP',  '후속 조치가 남았습니다', '전에 한 일에서 이어진 것',
              follow.map(t => row(t)))
      + block('stale',  'FORGOTTEN',  '오래 들여다보지 않았습니다', STALE + '일 넘게 손대지 않은 업무',
              stale.map(t => row(t, { seen: daysSince(t.last_seen_at) + '일째 안 봄' })))
      + block('done',   'LAST WEEK',  '지난 7일 동안 끝낸 일',  '주간 보고에 그대로 쓰십시오',
              done.map(t => row(t, { done:true })));

    host.innerHTML = html || empty();
    if(stale.length) markSeen(stale.map(t => t.id));
  }

  const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / 86400000);

  function empty(){
    return '<div class="board-empty">'
      + '<b>아직 담아둔 업무가 없습니다.</b>'
      + '<p>오른쪽 위 <b>잊지 말 업무</b>를 눌러 하나 담아보십시오.<br>'
      + '"3일 뒤", "매주 금요일"처럼 사람 말로 적으셔도 됩니다.</p>'
      + '<button class="btn lg" type="button" data-newtask>업무 담기</button>'
      + '</div>';
  }

  /* 목록에 띄운 순간 '봤다'고 기록합니다 — 방치 감지의 기준입니다 */
  function markSeen(ids){
    if(!ids.length) return;
    DB.update('tasks', 'id=in.(' + ids.join(',') + ')',
              { last_seen_at: new Date().toISOString() }).catch(()=>{});
  }

  /* ── 완료 · 미루기 ── */
  host.addEventListener('click', async e => {
    const btn = e.target.closest('[data-do]');
    if(!btn) return;
    const card = btn.closest('.tk');
    const id = card.dataset.id;
    card.classList.add('busy');

    try{
      if(btn.dataset.do === 'snooze'){
        const n = Number(btn.dataset.n);
        await DB.update('tasks', 'id=eq.' + id, {
          due_on: ymd(shift(T, n)),
          last_seen_at: new Date().toISOString()
        });
      }else{
        // 반복 업무는 끝내도 다음 차례로 넘어갑니다
        const cur = (await DB.q('tasks', 'select=*&id=eq.' + id))[0];
        const next = cur && WHEN.nextDue(cur.repeat_rule, cur.due_on);
        if(next){
          await DB.update('tasks', 'id=eq.' + id,
                          { due_on: next, last_seen_at: new Date().toISOString() });
        }else{
          await DB.update('tasks', 'id=eq.' + id,
                          { status:'done', done_at: new Date().toISOString() });
          askFollowUp(cur);
        }
      }
      load();
    }catch(err){
      card.classList.remove('busy');
      alert('처리하지 못했습니다. ' + err.message);
    }
  });

  /* 끝낼 때 한 번 묻습니다 — 이래야 후속 조치가 쌓입니다 */
  function askFollowUp(t){
    if(!t) return;
    const el = document.createElement('div');
    el.className = 'toast-wrap';
    el.innerHTML =
      '<div class="toast">'
      + '<button type="button" class="toast-x" aria-label="닫기">×</button>'
      + '<b>' + esc(t.title) + ' — 끝냈습니다</b>'
      + '<ul><li>이어서 확인할 일이 있습니까?</li></ul>'
      + '<button type="button" class="toast-go">후속 업무 담기</button>'
      + '</div>';
    document.body.appendChild(el);
    const kill = () => el.remove();
    el.querySelector('.toast-x').addEventListener('click', kill);
    el.querySelector('.toast-go').addEventListener('click', () => {
      kill();
      TaskForm.open({ follow_up_of: t.id, when: '다음 주' });
    });
    setTimeout(kill, 10000);
  }

  document.addEventListener('tasks:changed', load);
  DB.gate(load);
})();

</script>

<script>
/* ══════════════════════════════════════════════════════════
   홈의 달력.

   assets/tasks.js의 목록을 달력 위에 얹습니다.
   할 일이 있는 날에는 점이 찍히고, 누르면 아래에 내용이 나옵니다.
   목록을 고치면 달력도 따라 바뀝니다. 여기를 손댈 일은 없습니다.
   ══════════════════════════════════════════════════════════ */
(function(){
  const host = document.getElementById('homeCal');
  if(!host || typeof TASKS === 'undefined' || typeof MONTHLY === 'undefined') return;

  const NOW = new Date();
  const TY = NOW.getFullYear(), TM = NOW.getMonth() + 1, TD = NOW.getDate();
  const DOW = ['일','월','화','수','목','금','토'];

  let y = TY, m = TM, sel = TD;

  /* 그 날짜에 걸린 일 — 이 달만 하는 일 + 매달 반복되는 일 */
  function itemsOn(month, day){
    return TASKS.filter(t => t.m === month && t.d === day)
                .map(t => ({ t:t.t, tag:month + '월 ' + day + '일', to:'#month' }))
      .concat(MONTHLY.filter(t => t.d === day)
                .map(t => ({ t:t.t, tag:'매달 ' + day + '일', to:'#always' })));
  }

  function render(){
    const lead = new Date(y, m - 1, 1).getDay();   // 1일의 요일
    const last = new Date(y, m, 0).getDate();      // 이 달의 마지막 날

    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<span class="cal-day off"></span>';

    for(let d = 1; d <= last; d++){
      const n = itemsOn(m, d).length;
      const isToday = (y === TY && m === TM && d === TD);
      let cls = 'cal-day';
      if(n) cls += ' has';
      if(isToday) cls += ' today';
      if(d === sel) cls += ' sel';

      cells += n
        ? '<button type="button" class="' + cls + '" data-d="' + d + '"'
          + ' aria-label="' + m + '월 ' + d + '일, 할 일 ' + n + '건">' + d + '</button>'
        : '<span class="' + cls + '">' + d + '</span>';
    }

    host.innerHTML =
      '<div class="cal-head">'
      + '<button type="button" class="cal-nav" data-go="-1" aria-label="이전 달">‹</button>'
      + '<b>' + y + '년 ' + m + '월</b>'
      + '<button type="button" class="cal-nav" data-go="1" aria-label="다음 달">›</button>'
      + '</div>'
      + '<div class="cal-grid">'
      + DOW.map(d => '<span class="cal-dow">' + d + '</span>').join('')
      + cells
      + '</div>'
      + '<div class="cal-list" id="calList"></div>';

    paintList();
  }

  function paintList(){
    const el = host.querySelector('#calList');
    if(!el) return;
    const list = sel ? itemsOn(m, sel) : [];

    if(!list.length){
      el.innerHTML = '<p class="cal-none">'
        + (sel ? m + '월 ' + sel + '일에는 예정된 일이 없습니다.' : '점이 찍힌 날을 눌러보십시오.')
        + '</p>';
      return;
    }
    el.innerHTML = list.map(x =>
      '<a class="cal-item" href="reminder.html' + x.to + '">'
      + '<b>' + x.t + '</b><span>' + x.tag + '</span>'
      + '</a>'
    ).join('');
  }

  host.addEventListener('click', e => {
    const nav = e.target.closest('.cal-nav');
    if(nav){
      m += Number(nav.dataset.go);
      if(m < 1){ m = 12; y--; }
      if(m > 12){ m = 1; y++; }
      sel = (y === TY && m === TM) ? TD : null;
      render();
      return;
    }
    const day = e.target.closest('.cal-day[data-d]');
    if(day){
      sel = Number(day.dataset.d);
      render();
    }
  });

  render();
})();

</script>
<script>
/* ══════════════════════════════════════════════════════════
   리마인더 알림.

   ★ 한계를 먼저 적어둡니다.
     이 사이트는 서버가 없는 정적 파일입니다. 그래서 사이트를 닫아둔 사이에
     폰 알람처럼 울리는 알림은 만들 수 없습니다. 그건 푸시 서버가 필요합니다.
     여기서 하는 일은 "사이트를 열었을 때 그때까지 할 일을 알려주는" 것입니다.
     진짜 알람이 필요하면 리마인더 페이지의 '담기'로 캘린더에 넣으십시오.

   동작
     일간 — 오늘 할 일이 있으면 하루 한 번
     주간 — 앞으로 7일 안의 할 일을 주 한 번
     월간 — 이 달 할 일을 달 한 번

   알림 방식
     브라우저 알림 권한이 있으면 시스템 알림으로, 없으면 화면 위 쪽지로 띄웁니다.
   ══════════════════════════════════════════════════════════ */
(function(){
  if(typeof TASKS === 'undefined' || typeof MONTHLY === 'undefined') return;

  const KINDS = [
    { k:'daily',   name:'일간', desc:'오늘 할 일이 있으면 알립니다.' },
    { k:'weekly',  name:'주간', desc:'앞으로 7일 안의 할 일을 알립니다.' },
    { k:'monthly', name:'월간', desc:'이 달 할 일을 한 번에 알립니다.' }
  ];

  /* ── 저장 (막힌 환경이면 메모리로) ── */
  const mem = {};
  const store = {
    get(k){ try{ const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; }
            catch(e){ return mem[k] ?? null; } },
    set(k,v){ mem[k] = v; try{ localStorage.setItem(k,v); }catch(e){} }
  };
  const isOn  = k => store.get('notify.' + k) === '1';
  const setOn = (k,v) => store.set('notify.' + k, v ? '1' : '0');

  /* ── 날짜 ── */
  const NOW = new Date();
  const Y = NOW.getFullYear(), M = NOW.getMonth() + 1, D = NOW.getDate();
  const midnight = new Date(Y, NOW.getMonth(), D);
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());

  /* 같은 기간에 두 번 알리지 않기 위한 열쇠 */
  function periodKey(kind){
    if(kind === 'daily')   return ymd(midnight);
    if(kind === 'monthly') return Y + '-' + pad(M);
    const mon = new Date(midnight);              // 그 주의 월요일
    mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    return ymd(mon);
  }

  /* ── 무엇이 걸려 있나 ── */
  const ofMonth = mm => TASKS.filter(t => t.m === mm).map(t => ({ t:t.t, d:t.d, m:mm }))
    .concat(MONTHLY.map(t => ({ t:t.t, d:t.d, m:mm })));

  function due(kind){
    if(kind === 'monthly') return ofMonth(M).sort((a,b) => a.d - b.d);
    if(kind === 'daily')   return ofMonth(M).filter(x => x.d === D);

    // 주간 — 오늘부터 7일. 달을 넘어가는 경우까지 본다.
    const out = [];
    for(let i = 0; i < 7; i++){
      const day = new Date(Y, NOW.getMonth(), D + i);
      ofMonth(day.getMonth() + 1)
        .filter(x => x.d === day.getDate())
        .forEach(x => out.push({ t:x.t, d:x.d, m:day.getMonth() + 1 }));
    }
    return out;
  }

  /* ── 화면 위 쪽지 (알림 권한이 없을 때) ──
     여러 개가 동시에 뜰 수 있으므로 덮어쓰지 않고 아래로 쌓습니다. */
  function toast(title, lines){
    let wrap = document.querySelector('.toast-wrap');
    if(!wrap){
      wrap = document.createElement('div');
      wrap.className = 'toast-wrap';
      document.body.appendChild(wrap);
    }
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML =
      '<button type="button" class="toast-x" aria-label="알림 닫기">×</button>'
      + '<b>' + title + '</b>'
      + '<ul>' + lines.map(l => '<li>' + l + '</li>').join('') + '</ul>';
    el.querySelector('.toast-x').addEventListener('click', () => el.remove());
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 12000);
  }

  function fire(kind, list){
    const label = KINDS.find(x => x.k === kind).name;
    const title = label + ' 리마인더 · ' + list.length + '건';
    const lines = list.slice(0,3).map(x => x.m + '월 ' + x.d + '일 · ' + x.t);
    if(list.length > 3) lines.push('그 밖에 ' + (list.length - 3) + '건');

    if('Notification' in window && Notification.permission === 'granted'){
      try{
        new Notification(title, { body: lines.join('\n'), icon: 'assets/favicon.svg' });
        return;
      }catch(e){ /* 실패하면 아래 쪽지로 */ }
    }
    toast(title, lines);
  }

  /* ── 켜져 있는 것만, 기간당 한 번 ──
     only를 주면 그 종류만 봅니다. 스위치 하나를 켰을 때
     켜져 있던 나머지까지 다시 뜨지 않게 하려는 것입니다. */
  function run(force, only){
    KINDS.forEach(({k}) => {
      if(only && k !== only) return;
      if(!isOn(k)) return;
      const key = periodKey(k);
      if(!force && store.get('notify.last.' + k) === key) return;
      const list = due(k);
      if(!list.length) return;
      store.set('notify.last.' + k, key);
      fire(k, list);
    });
  }

  /* ── 설정 화면 ── */
  const host = document.getElementById('notifySwitches');
  if(host){
    host.innerHTML = KINDS.map(({k,name,desc}) =>
      '<label class="switch">'
      + '<input type="checkbox" data-k="' + k + '"' + (isOn(k) ? ' checked' : '') + '>'
      + '<span class="switch-t"><b>' + name + '</b>' + desc + '</span>'
      + '</label>'
    ).join('') + '<button type="button" class="ics" id="notifyTest">지금 한 번 보기</button>'
      + '<p class="switch-state" id="notifyState"></p>';

    const state = host.querySelector('#notifyState');

    function paintState(){
      if(!('Notification' in window)){
        state.textContent = '이 브라우저는 시스템 알림을 지원하지 않습니다. 화면 위 쪽지로 알려드립니다.';
        return;
      }
      const p = Notification.permission;
      state.textContent =
        p === 'granted' ? '시스템 알림으로 받습니다.'
      : p === 'denied'  ? '알림이 차단돼 있어 화면 위 쪽지로 알려드립니다. 주소창의 자물쇠에서 바꿀 수 있습니다.'
                        : '켜면 알림 권한을 물어봅니다. 거절하셔도 화면 위 쪽지로 알려드립니다.';
    }
    paintState();

    host.addEventListener('change', async e => {
      const box = e.target.closest('input[data-k]');
      if(!box) return;
      setOn(box.dataset.k, box.checked);

      // 권한 요청은 사용자가 직접 켤 때만 (브라우저 규칙)
      if(box.checked && 'Notification' in window && Notification.permission === 'default'){
        try{ await Notification.requestPermission(); }catch(e){}
      }
      paintState();
      if(box.checked) run(true, box.dataset.k);
    });

    host.querySelector('#notifyTest').addEventListener('click', () => {
      const on = KINDS.filter(({k}) => isOn(k));
      if(!on.length){ toast('켜진 알림이 없습니다', ['위에서 하나 이상 켜주십시오.']); return; }
      let shown = false;
      on.forEach(({k}) => { const l = due(k); if(l.length){ fire(k, l); shown = true; } });
      if(!shown) toast('지금은 알릴 것이 없습니다', ['켜두시면 해당하는 날에 알려드립니다.']);
    });
  }

  run(false);
})();

</script>
<script>
/* 홈의 이번 달 미리보기 — 반복되는 일반 업무 목록에서 뽑습니다 */
(function(){
  const el = document.getElementById('homeReminder');
  if(!el || typeof TASKS === 'undefined') return;
  const M = new Date().getMonth() + 1;

  const peek = TASKS.filter(t => t.m === M).sort((a,b) => a.d - b.d)
    .map(t => ({ t:t.t, when:M + '월 ' + t.d + '일', to:'#month' }));
  MONTHLY.slice().sort((a,b) => a.d - b.d).forEach(t => {
    if(peek.length < 3) peek.push({ t:t.t, when:'매월 ' + t.d + '일', to:'#always' });
  });

  el.innerHTML = peek.slice(0,3).map(x =>
    '<a href="reminder.html' + x.to + '">' + x.t + ' <span>' + x.when + '</span></a>'
  ).join('');
})();
</script>
