<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tw-build" content="20261120.4">
<title>샘플오피스 워크스페이스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="icon" id="fav" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='%232383e2'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Pretendard%2CMalgun Gothic%2CArial%2Csans-serif' font-size='28' font-weight='800' fill='%23fff' letter-spacing='-1'%3EW%3C/text%3E%3C/svg%3E">
<style>
:root{
  --f1:10pt; --f2:20pt; --f3:30pt; /* 글자 크기 3단계 */
  --bg:#ffffff; --side:#f7f7f5; --text:#37352f; --muted:#787774; --faint:#a5a29c;
  --line:#e9e9e7; --hover:rgba(55,53,47,.06); --soft:#fafaf9; --hover2:rgba(55,53,47,.1);
  --accent:#2383e2; --accentbg:#e7f3f8; --red:#eb5757; --redbg:#fdebec;
  --yellowbg:#fbf3db; --greenbg:#edf3ec; --green:#448361; --card:#fff;
  --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:var(--f1);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
#app{display:flex;height:100vh}
#sideRs{width:7px;margin:0 -4px 0 -3px;flex-shrink:0;cursor:col-resize;position:relative;z-index:5}
#sideRs::after{content:'';position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s}
#sideRs:hover::after,#sideRs.on::after{background:var(--accent);opacity:.5}
body.rsz,body.rsz *{cursor:col-resize!important;user-select:none!important}
@media (max-width:820px){#sideRs{display:none}}

/* ---------- sidebar ---------- */
#side{width:var(--sidew,250px);flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;user-select:none}
.ws{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;cursor:pointer;font-weight:600;font-size:var(--f1)}
.ws:hover{background:var(--hover)}
.wsic{width:22px;height:22px;border-radius:5px;background:#37352f;color:#fff;display:grid;place-items:center;font-size:var(--f1);flex-shrink:0}
.wsn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sscroll{flex:1;overflow:auto;padding-bottom:12px}
/* 스크롤바: 얇고 둥글게, 화살표 없이. 평소엔 옅게 · 올리면 진하게
   (크롬·엣지는 scrollbar-color를 쓰면 화살표 달린 기본 모양이 되므로 아래 webkit 방식만 쓰고, 지원 안 하는 브라우저에만 표준 속성 적용) */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(55,53,47,.16);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(55,53,47,.34);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
.sscroll::-webkit-scrollbar{width:6px}
.sscroll::-webkit-scrollbar-thumb{background:transparent;border:1px solid transparent;background-clip:padding-box}
#side:hover .sscroll::-webkit-scrollbar-thumb{background:rgba(55,53,47,.18);background-clip:padding-box}   /* 메뉴 스크롤바는 마우스를 올렸을 때만 */
.sscroll{scrollbar-gutter:stable}
.sscroll::-webkit-scrollbar-thumb:hover{background:rgba(55,53,47,.32);background-clip:padding-box}
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:rgba(55,53,47,.2) transparent}
}
.si{display:flex;align-items:center;gap:8px;padding:3px 10px;margin:1px 6px;border-radius:5px;cursor:pointer;font-size:var(--f1);color:#5f5e5b;min-height:28px}
.si:hover{background:var(--hover)}
.si.on{background:var(--hover2);color:var(--text);font-weight:600}
.si .ic{width:20px;text-align:center;flex-shrink:0;color:var(--muted)}
.si .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si.unread .lb{color:var(--text);font-weight:700}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:var(--f1);padding:0 7px;font-weight:700;line-height:19px}
.badge.gray{background:var(--hover2);color:var(--muted)}
.kbd{font-size:var(--f1);color:var(--faint)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 3px;font-size:var(--f1);color:var(--muted);font-weight:600}
.sec button{width:20px;height:20px;border-radius:4px;color:var(--muted);font-size:var(--f1);line-height:1}
.sec button:hover{background:var(--hover2)}
.sec.fold{cursor:pointer;user-select:none;border-radius:5px;margin:0 6px;padding-left:10px;padding-right:10px}
.sec.fold:hover{color:var(--text)}
.secl{display:flex;align-items:center;gap:4px}
.secl .badge{margin-left:4px}
.sec .car{display:inline-block;width:12px;text-align:center;color:var(--faint);font-size:var(--f1);transition:transform .15s;opacity:.6}
.sec.fold:hover .car{opacity:1}
.sec.closed .car{transform:rotate(-90deg)}
.secgrp{border-radius:6px;position:relative}
.si.sidrag{background:var(--accentbg)!important;box-shadow:0 0 0 1px var(--accent) inset;cursor:grabbing}
body.sidragging,body.sidragging *{cursor:grabbing!important}
.sidrop{position:absolute;left:10px;right:10px;height:2px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:3}
.secgrp.secdrag{opacity:.4}
.secgrp.dropb{box-shadow:inset 0 2px 0 var(--accent)}
.secgrp.dropa{box-shadow:inset 0 -2px 0 var(--accent)}
.sfoot{border-top:1px solid var(--line);padding:8px 6px}
.sync{font-size:var(--f1);color:var(--muted);padding:4px 10px;border-radius:5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.sync:hover{background:var(--hover)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.dot.ok{background:#4dab9a}.dot.wait{background:#f2c94c}.dot.err{background:var(--red)}

.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex-shrink:0;line-height:1}

/* ---------- main ---------- */
#main{flex:1;overflow:auto;position:relative;min-width:0}
#main.chmode{display:flex;flex-direction:row;overflow:hidden}
#rmban{position:fixed;right:20px;top:16px;z-index:80;width:340px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:10px 10px 6px}
#rmban .rmh{display:flex;justify-content:space-between;font-weight:700;padding:2px 6px 8px}#rmban .rmh span{color:var(--muted);font-weight:400;font-size:12px}
#rmban .rmrow{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);padding:6px 0}
#rmban .rmt{flex:1;min-width:0;cursor:pointer;padding:2px 6px;border-radius:6px}#rmban .rmt:hover{background:var(--hover)}
#rmban .rmre{font-size:12px;color:var(--muted);padding:3px 7px;border-radius:6px;border:1px solid var(--line)}#rmban .rmre:hover{background:var(--hover)}
#rmban .rmt b{display:block;font-size:12px;color:var(--muted);font-weight:600}#rmban .rmt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chcol{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#thpanel{display:none}
#main.thon #thpanel{display:flex;flex-direction:column;width:400px;flex-shrink:0;border-left:1px solid var(--line);background:var(--bg);min-height:0}
@media (max-width:1100px){ #main.thon #thpanel{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.08)} #main.chmode{position:relative} }
.thhead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.thhead .thch{color:var(--muted);font-size:var(--f1)}
.thlist{flex:1;overflow:auto;padding:10px 0 8px}
.thlist .mtext{font-size:var(--chfs,var(--f1))}
.thsep{display:flex;align-items:center;gap:8px;margin:6px 16px 8px;color:var(--faint);font-size:12px}
.thsep::after{content:'';flex:1;height:1px;background:var(--line)}
.thcomp{padding:8px 14px 14px}
.thchip{display:inline-flex;align-items:center;gap:7px;margin:3px 0 2px;padding:3px 10px 3px 4px;border-radius:8px;border:1px solid transparent;font-size:12px;color:var(--accent);cursor:pointer;align-self:flex-start}
.msg.mine .thchip{align-self:flex-end}
.thchip:hover,.thchip.on{background:var(--soft);border-color:var(--line)}
.thchip .tht{color:var(--faint);font-weight:400}
.thchip.new b::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#e5484d;margin-left:5px;vertical-align:2px}
.thav{display:inline-flex}
.thav i{width:18px;height:18px;border-radius:5px;background:var(--accentbg);color:var(--accent);font-style:normal;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:-3px;box-shadow:0 0 0 1.5px var(--bg)}
.flth{font-size:12px;color:var(--accent);cursor:pointer;margin-top:2px}
.wrap{max-width:860px;margin:0 auto;padding:56px 64px 160px}
.wrap.wide{max-width:1160px}
.wrap.spwrap{max-width:none;padding:40px 32px 120px} /* 업무 전달: 내 공간과 같은 여백 */
.h1{font-size:var(--f3);font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:var(--f1);margin-bottom:28px}
.topbar{display:none}

/* home */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hcard{border:1px solid var(--line);border-radius:8px;padding:14px 4px 8px;min-height:150px}
.hcard h3{font-size:var(--f1);margin:0 12px 8px;color:var(--muted);font-weight:600}
.hitem{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;border-radius:5px;cursor:pointer;margin:0 4px}
.hitem:hover{background:var(--hover)}
.hitem .t{font-size:var(--f1);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hitem .m{font-size:var(--f1);color:var(--muted)}
.empty{color:var(--faint);font-size:var(--f1);padding:8px 12px}

/* channel */
.chhead{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.chn{font-weight:700;font-size:var(--f2)}
.chd{color:var(--muted);font-size:var(--f1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:32px;height:32px;border-radius:5px;color:var(--muted);font-size:var(--f2);line-height:1;margin-left:auto}
.ib:hover{background:var(--hover)}
#pins{flex-shrink:0}
.pinbar{background:var(--yellowbg);padding:7px 24px;font-size:var(--f1);cursor:pointer;display:flex;gap:8px;align-items:center}
.pinlist{background:#fffbea;border-bottom:1px solid var(--line);max-height:200px;overflow:auto}
.pinitem{padding:6px 24px;font-size:var(--f1);cursor:pointer;display:flex;gap:8px}
.pinitem:hover{background:var(--hover)}
.pinitem b{flex-shrink:0}
.pinitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow:auto;padding:12px 0 8px}
.daysep{display:flex;align-items:center;margin:14px 24px 6px;color:var(--muted);font-size:var(--f1);font-weight:600}
.daysep:before,.daysep:after{content:"";flex:1;height:1px;background:var(--line)}
.daysep span{padding:0 10px}
.msg{display:flex;gap:10px;padding:6px 24px 4px;position:relative}
.msg.compact{padding-top:0}
.msg.compact{padding-top:1px}
.msg:hover{background:var(--soft)}
.msg.ment{background:#fff8e6}
.msg.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--accentbg)}100%{background:transparent}}
.mgut{width:36px;flex-shrink:0;display:flex;justify-content:center}
.msg.compact .mgut .mt{white-space:nowrap;visibility:hidden;font-size:var(--f1);margin-top:4px}
.msg.compact:hover .mgut .mt{visibility:visible}
.mbody{flex:1;min-width:0}
.mhead{display:flex;gap:8px;align-items:baseline}
.mhead b{font-size:var(--f1)}
.mt{color:var(--faint);font-size:var(--f1)}
.pintag{font-size:var(--f1);background:var(--yellowbg);border-radius:4px;padding:0 5px;color:#9a6700}
.mtext{white-space:pre-wrap;word-break:break-word;font-size:var(--f1)}
.mtext b,.btx b{font-weight:700}
#msgs .mtext{font-size:var(--chfs,var(--f1))}
.btx .md{color:var(--faint);font-weight:400;text-decoration:none}
.btx .md,.mtext .md,.rtx .md,.devtx .md{display:none}   /* 꾸밈 표시 글자는 항상 숨김 */
.rtx{white-space:pre-wrap;word-break:break-word;outline:none;min-height:1.5em;overflow-y:auto;cursor:text;line-height:1.5}
.rtx:empty:before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.compbox .rtx{width:100%;max-height:220px;font-size:var(--f1)}
.rtx.medit{max-height:60vh}
s.fx-s{color:#9b9a97;text-decoration:line-through}
.fxpop{padding:6px 6px 4px}
.fxrow{display:flex;align-items:center;gap:3px;padding:2px}
.fxb{min-width:28px;height:28px;border-radius:5px;font-weight:600;font-size:var(--f1);padding:0 4px}
.fxb:hover{background:var(--hover)}
.fx-b{font-weight:800}.fx-u{text-decoration:underline}.fx-st{text-decoration:line-through;color:#9b9a97}
.fx-t{font-weight:400;color:var(--muted);padding:0 8px}.fx-c{font-weight:800}
.fxl{color:var(--muted);margin:0 4px 0 2px;font-size:var(--f1)}
.fxsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.edited{color:var(--faint);font-size:var(--f1)}
.medt{color:var(--faint);font-size:12px;font-weight:400;margin-left:6px}
.mtext .medt{margin-left:0}
.mline>.medt{align-self:flex-end;margin:0 6px 4px;white-space:nowrap}
.mention{background:var(--accentbg);color:#0b6bcb;border-radius:3px;padding:0 2px;font-weight:600}
.mention.me{background:#fbe4a0;color:#7a5200}
.mention.all{background:#fde7d2;color:#b54708}
.ackrow{margin-top:4px;font-size:var(--f1);border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--muted);background:#fff}
.ackrow.on{border-color:#a8d4c5;background:var(--greenbg);color:var(--green)}
.mtools{position:absolute;left:70px;top:-14px;z-index:2;display:none;background:#fff;box-shadow:var(--shadow);border-radius:6px;padding:2px}
.msg:hover .mtools{display:flex}
.mtools.inh{position:static;display:flex;visibility:hidden;align-self:center;margin-left:4px;box-shadow:none;border:1px solid var(--line);padding:1px}
.msg:hover .mtools.inh{visibility:visible}
.mtools.inh button{width:26px;height:22px}
.mtools.inh{margin-top:-6px;margin-bottom:-6px}   /* 줄 높이를 늘리지 않게 (글이 밀리지 않도록) */
.mtools{user-select:none}
.msg .mtools.inl,.msg:hover .mtools.inl{display:inline-flex}
.mtools.inl{display:inline-flex;align-self:center;margin:-6px 0;white-space:nowrap;line-height:1}
/* 말풍선 */
.msg{padding-top:4px;padding-bottom:2px}
.msg:hover{background:transparent}
.msg.ment{background:transparent}
.mhead{margin-bottom:3px}
.mline{display:flex;align-items:center;gap:8px;width:100%}
.mbub{background:#f1f1ef;border-radius:4px 14px 14px 14px;padding:7px 12px;max-width:min(680px,78%);min-width:0;touch-action:pan-y}
.mline{position:relative}
.swhint{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:background .12s,transform .12s;pointer-events:none}
.swhint.go{background:var(--accent);transform:scale(1.15)}
.mbub.swready{box-shadow:0 4px 14px rgba(0,0,0,.12);transition:box-shadow .12s;cursor:grab}
body.swiping,body.swiping *{user-select:none!important;cursor:grabbing!important}
.msg.compact .mbub{border-radius:14px}
.msg.mine .mbody{display:flex;flex-direction:column;align-items:flex-end}
.msg.mine .mhead{flex-direction:row-reverse}
.msg.mine .mline{flex-direction:row-reverse}
.msg.mine .mbub{background:var(--accentbg);border-radius:14px 4px 14px 14px}
.msg.mine.compact .mbub{border-radius:14px}
.msg.mine .atts{justify-content:flex-end}
.mbub .atts{margin-top:8px}
.mbub.notx{padding:5px}.mbub.notx .atts{margin-top:0}
.mbub .att.chat{background:transparent;line-height:0;border-radius:10px}
.mbub .att.chat img,.mbub .att.chat .attph{border-radius:10px;max-width:340px;max-height:240px}   /* px로 고정해야 사진 옆 빈칸이 안 생김 */
.mbub .att.chat .attph{line-height:1.5;border-radius:10px;background:rgba(255,255,255,.6)}
.msg.ment .mbub{background:#fff1c7;box-shadow:inset 0 0 0 1px #f4d77a}
.mbub.hasth{box-shadow:inset 0 0 0 1.5px #9cc7ee}
.msg.mine .mbub.hasth{box-shadow:inset 0 0 0 1.5px #6fb0e8}
.mbub.hasth{position:relative}
.mbub.hasth::after{content:'💬';position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px #9cc7ee;font-size:10px;display:flex;align-items:center;justify-content:center}
.msg.mine .mbub.hasth::after{right:auto;left:-8px}
.msg:hover .mbub{filter:brightness(.98)}
.msg .mbub:has(.medit),.msg.mine .mbub:has(.medit){width:min(680px,100%);max-width:100%;background:transparent;padding:0}
.msg.mine .mtools:not(.inh){left:auto;right:24px}
.mtools button{width:30px;height:28px;border-radius:4px;font-size:var(--f1)}
.mtools button:hover{background:var(--hover)}
.medit{width:100%;border:1px solid var(--accent);border-radius:6px;padding:6px 8px;resize:none;min-height:36px;outline:none;font-family:inherit;line-height:1.5;overflow-y:auto;display:block}
.meditb{font-size:var(--f1);color:var(--muted);margin-top:4px}
.comp{padding:8px 24px 18px;flex-shrink:0}
.compbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.compbox:focus-within{border-color:#c8c7c4}
.compbox textarea{width:100%;border:0;outline:0;resize:none;max-height:220px;font-size:var(--f1);line-height:1.5;background:transparent}
.comprow{display:flex;align-items:center;justify-content:space-between}
.hint{font-size:var(--f1);color:var(--faint)}
.send{background:var(--accent);color:#fff;border-radius:6px;padding:3px 14px;font-size:var(--f1);font-weight:600}
.send:hover{filter:brightness(.95)}
.chempty{text-align:center;color:var(--muted);padding:60px 20px;font-size:var(--f1)}

/* page editor */
.phead{margin-bottom:4px}
.picon{font-size:var(--f3);line-height:1;border-radius:6px;padding:4px}
.picon:hover{background:var(--hover)}
.ptitle{font-size:var(--f3);font-weight:700;outline:none;margin:6px 0 2px;letter-spacing:-.01em;word-break:break-word}
.ptitle:empty:before{content:attr(data-ph);color:#d3d1cb}
.pmeta{font-size:var(--f1);color:var(--faint);margin-bottom:22px;display:flex;gap:14px}
.lnk{color:var(--faint);text-decoration:underline;font-size:var(--f1)}
.lnk:hover{color:var(--red)}
.blocks{margin-left:-28px;position:relative}
.wrap.pgwrap{max-width:none;padding:44px 56px 160px}
.blocks.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:start}

// 불러온 데이터는 항상 형식 검사를 거친다 (다른 PC에서 온 값 포함)
function clean(raw){
  const d=emptyDB(); if(!raw||typeof raw!=='object') return d;
  const m=raw.meta||{};
  d.meta={wsName:S(m.wsName,40).trim()||'샘플오피스 워크스페이스',
    members:Array.isArray(m.members)?[...new Set(m.members.map(x=>S(x,30).trim()).filter(Boolean))].slice(0,60):[],
    mj:nameMap(m.mj), mg:nameMap(m.mg), labels:navLabelMap(m.labels), lkInit:m.lkInit===true, u:Number.isFinite(+m.u)?+m.u:0};
  d.meta.members=activeMembers(d.meta);
  if(raw.deleted&&typeof raw.deleted==='object') for(const k in raw.deleted){const t=+raw.deleted[k]; if(validId(k)&&Number.isFinite(t)) d.deleted[k]=t;}
  for(const c of COLS){
    const arr=Array.isArray(raw[c])?raw[c].slice(-MAX_REC):[], sch=SCHEMA[c], seen=new Map();
    for(const r of arr){
      if(!r||typeof r!=='object'||!validId(r.id)) continue;
      const o={id:r.id,u:Number.isFinite(+r.u)?+r.u:0}; let ok=true;
      for(const f in sch){
        const t=sch[f], v=r[f];
        if(/^s\d+$/.test(t)) o[f]=S(v,+t.slice(1));
        else if(t==='n') o[f]=Number.isFinite(+v)?+v:0;
        else if(t==='b') o[f]=!!v;
        else if(t==='id'){ if(!validId(v)) ok=false; o[f]=v; }
        else if(t==='atts') o[f]=(Array.isArray(v)?v:[]).filter(a=>a&&IMG_RE.test(a.id)).slice(0,10).map(a=>({id:a.id,name:S(a.name,100),w:Math.max(0,+a.w||0)|0,h:Math.max(0,+a.h||0)|0,size:Math.max(0,+a.size||0)|0}));
        else if(t==='rep') o[f]=['','day','week','month'].includes(v)?v:'';
        else if(t==='tm') o[f]=/^([01]\d|2[0-3]):[0-5]\d$/.test(v)?v:'';
        else if(t==='ost') o[f]=OST.some(x=>x[0]===v)?v:'req';
        else if(t==='cat') o[f]=CATS.some(c=>c[0]===v)?v:'gen';
        else if(t==='oid') o[f]=(typeof v==='string'&&validId(v))?v:'';
        else if(t==='st') o[f]=['todo','doing','done'].includes(v)?v:'todo';
        else if(t==='d') o[f]=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';
        else if(t==='blocks') o[f]=(Array.isArray(v)?v:[]).slice(0,3000).filter(b=>b&&validId(b.id))
              .map(b=>({id:b.id,t:TYPES.includes(b.t)?b.t:'text',text:S(b.text,20000),done:!!b.done,u:Number.isFinite(+b.u)?+b.u:0,...(b.c===1?{c:1}:{})}));
        else if(t==='delmap'){ o[f]={}; if(v&&typeof v==='object') Object.keys(v).filter(validId).slice(-500).forEach(k=>{ if(Number.isFinite(+v[k])) o[f][k]=+v[k]; }); }
      }
      if(ok){ const j=seen.get(o.id); if(j==null){ seen.set(o.id,d[c].length); d[c].push(o); } else if(o.u>d[c][j].u) d[c][j]=o; }
    }
  }
  return d;
}
function canon(db){
  const c=clean(db);
  for(const k of COLS) c[k].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  c.meta.members.sort(); for(const k of ['mj','mg']){ const o={}; Object.keys(c.meta[k]).sort().forEach(n=>o[n]=c.meta[k][n]); c.meta[k]=o; }
  const del={}; Object.keys(c.deleted).sort().forEach(k=>del[k]=c.deleted[k]); c.deleted=del;
  return JSON.stringify(c);
}
// 같은 페이지를 동시에 고쳐도 블록 단위로 합친다 (제목·순서·블록별 최신 우선, 지운 블록 기록 유지)
function mergePage(l,r){
  if(l===r) return l;
  const bdel={...(l.bdel||{})}; for(const k in (r.bdel||{})) if(!(bdel[k]>=r.bdel[k])) bdel[k]=r.bdel[k];
  const lm=new Map(l.blocks.map(b=>[b.id,b])), rm=new Map(r.blocks.map(b=>[b.id,b]));
  const pick=id=>{ const a=lm.get(id), b=rm.get(id); return !a?b:!b?a:((b.u||0)>(a.u||0)?b:a); };
  const [base,other]=(r.ou||r.u)>(l.ou||l.u)?[r,l]:[l,r];
  const order=base.blocks.map(b=>b.id);
  other.blocks.forEach((b,i)=>{ if(order.includes(b.id)) return; let j=-1;
    for(let k=i-1;k>=0;k--){ j=order.indexOf(other.blocks[k].id); if(j>=0) break; }
    order.splice(j+1,0,b.id); });
  const blocks=order.map(pick).filter(b=>!(bdel[b.id]>=(b.u||0)));
  const keys=Object.keys(bdel); if(keys.length>500) keys.sort((a,b)=>bdel[a]-bdel[b]).slice(0,keys.length-500).forEach(k=>delete bdel[k]);
  const T=(r.tu||r.u)>(l.tu||l.u)?r:l, N=r.u>l.u?r:l;
  return {...l,title:T.title,icon:T.icon,fs:T.fs||0,lay:T.lay||0,tu:Math.max(l.tu||0,r.tu||0),ou:Math.max(l.ou||0,r.ou||0),by:N.by,u:Math.max(l.u,r.u),bdel,blocks:blocks.length?blocks:l.blocks};
}
// local을 먼저 넣어 동률일 때 내 PC의 객체를 유지한다
function merge(local,remote){
  const out={app:APP,v:1,meta:null,deleted:{}};
  const mu=(remote.meta.u||0)>(local.meta.u||0);
  const mx=(a,b)=>{ const o=Object.create(null); for(const x of [a||{},b||{}]) for(const k in x) if(!(o[k]>=x[k])) o[k]=x[k]; return o; };
  out.meta={...(mu?remote.meta:local.meta),members:[...new Set([...local.meta.members,...remote.meta.members,...Object.keys(local.meta.mg||{}),...Object.keys(remote.meta.mg||{})])],mj:mx(local.meta.mj,remote.meta.mj),mg:mx(local.meta.mg,remote.meta.mg)};
  out.meta.members=activeMembers(out.meta);
  out.deleted={...local.deleted};
  for(const k in remote.deleted) if(!(out.deleted[k]>=remote.deleted[k])) out.deleted[k]=remote.deleted[k];
  const cut=now()-90*DAY; for(const k in out.deleted) if(out.deleted[k]<cut) delete out.deleted[k];
  for(const c of COLS){
    const m=new Map(); for(const r of local[c]) m.set(r.id,r);
    for(const r of remote[c]){const x=m.get(r.id);
      if(c==='pages'&&x){ const mp=mergePage(x,r); if(mp!==x){ Object.assign(x,mp); } continue; } // 편집 중인 객체를 그대로 유지
      if(!x||r.u>x.u) m.set(r.id,r);}
    out[c]=[...m.values()].filter(r=>!(out.deleted[r.id]>=r.u));
  }
  return out;
}

/* ---------- 로그인 · 데이터 암호화 ----------
   · 팀 공용 비밀번호 → PBKDF2(SHA-256, 60만 회)로 열쇠를 만들고 AES-GCM 256으로 공유 파일·백업을 암호화
   · 비밀번호와 열쇠는 이 창의 메모리에만 있음 (어디에도 저장하지 않음 → 열 때마다 로그인)
   · 브라우저 내장 암호화(Web Crypto)만 사용 · 외부 통신 없음 */
const ENC={cred:null,old:null,salt:null,iter:600000};
// 암호화 전 팀 파일을 처음 암호화하는 단계 허용 여부 — 팀 파일이 암호화된 뒤에는 false로 바꿔 배포 (평문 JSON으로 화면을 여는 길 차단)
const ALLOW_PLAIN_SETUP=false;
const CRYPTO_OK=!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
const encReady=()=>!!ENC.cred;
const b64e=u=>{ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const b64d=s=>{ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
const isEnc=r=>!!r&&typeof r==='object'&&!Array.isArray(r)&&r.tw_enc===1&&typeof r.ct==='string'&&typeof r.iv==='string'&&typeof r.salt==='string';
const mkCred=(id,pw)=>({id:String(id||'').trim(),pw:String(pw||''),keys:new Map()});
async function keyFor(cred,salt,iter){
  const k=salt+'|'+iter; if(cred.keys.has(k)) return cred.keys.get(k);
  if(cred.pw==null) throw new Error('다시 로그인이 필요합니다');   // 「오늘 하루 로그인 유지」로 열쇠만 있는 경우
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(cred.id+'\u0000'+cred.pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(salt),iterations:iter},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  cred.keys.set(k,key); return key;
}
async function encText(plain,cred){
  cred=cred||ENC.cred; if(!cred) throw new Error('로그인이 필요합니다');
  if(!ENC.salt) ENC.salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
  const key=await keyFor(cred,ENC.salt,ENC.iter), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plain)));
  return JSON.stringify({tw_enc:1,app:'tw-enc',kdf:'PBKDF2-SHA256',iter:ENC.iter,salt:ENC.salt,iv:b64e(iv),ct:b64e(ct)});
}
async function tryDec(env,cred){
  const it=Number(env.iter); if(!(it>=100000&&it<=5000000)) throw new Error('암호화 정보가 올바르지 않습니다');
  const key=await keyFor(cred,env.salt,it);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},key,b64d(env.ct)));
}
// 현재 계정 → (비밀번호를 바꾼 직후라면) 이전 계정 순서로 풀어 봄. cur=false면 이전 계정으로 풀린 것 (다음 저장 때 새 계정으로 다시 암호화)
async function decEnv(env){
  for(const c of [ENC.cred,ENC.old]){ if(!c) continue;
    try{ const t=await tryDec(env,c); if(c===ENC.cred) ENC.salt=env.salt; return {t,cur:c===ENC.cred}; }catch(e){} }
  const e=new Error('비밀번호가 이 파일과 맞지 않습니다'); e.key=true; throw e;
}
// 파일 내용 → 워크스페이스 데이터 (암호화 파일은 풀고, 암호화 전의 예전 파일도 읽음)
async function parseWs(text){ let raw=JSON.parse(text), enc=false, cur=true;
  if(isEnc(raw)){ const d=await decEnv(raw); raw=JSON.parse(d.t); enc=true; cur=d.cur; } return {raw,enc,cur}; }
// 백업 파일이 예전 비밀번호로 저장돼 있으면 그때의 정보를 물어서 풂
async function parseWsAsk(text,title){
  try{ return await parseWs(text); }catch(e){ if(!e.key) throw e; }
  const env=JSON.parse(text), pw=h('input',{class:'inp',type:'password'});
  for(;;){ const r=await modal(title||'백업 파일 열기',h('div',null,h('div',{class:'mtxt'},'이 백업은 지금과 다른 비밀번호로 저장돼 있습니다.\n백업할 당시의 비밀번호를 입력하세요.'),h('label',{class:'lbl'},'비밀번호'),pw),[{label:'취소',val:null},{label:'열기',val:'ok',primary:true}]);
    if(r!=='ok') throw new Error('백업 파일을 열지 않았습니다');
    try{ return {raw:JSON.parse(await tryDec(env,mkCred('',pw.value))),enc:true,cur:false}; }catch(e){ toast('비밀번호가 맞지 않습니다'); } }
}
async function saveVerifier(){ try{ LS.set('encv',JSON.parse(await encText('tw-ok'))); }catch(e){} saveKeep(); }
/* 오늘 하루 로그인 유지: 비밀번호가 아니라 꺼낼 수 없는 열쇠(CryptoKey)만 이 PC 브라우저에 자정까지 보관 */
const midnight=()=>{ const d=new Date(); d.setHours(24,0,0,0); return d.getTime(); };
async function saveKeep(){
  if(!ENC.keep||!ENC.cred||!ENC.salt) return;
  try{ const key=await keyFor(ENC.cred,ENC.salt,ENC.iter); await idbSet('keep',{key,salt:ENC.salt,iter:ENC.iter,exp:midnight()}); }catch(e){}
}
const clearKeep=()=>idbSet('keep',null);
async function loadKeep(){
  const k=await idbGet('keep'); if(!k) return false;
  if(!(k.exp>Date.now())||!(k.key instanceof CryptoKey)||typeof k.salt!=='string'){ clearKeep(); return false; }
  const cred={id:'',pw:null,keys:new Map([[k.salt+'|'+k.iter,k.key]])};
  ENC.cred=cred; ENC.salt=k.salt; ENC.iter=k.iter; ENC.keep=true; ENC.verOk=true; return true;
}
async function checkVerifier(cred){ const v=LS.get('encv',null); if(!isEnc(v)) return null; try{ return (await tryDec(v,cred))==='tw-ok'; }catch(e){ return false; } }

// 로그인 화면. mode='relogin'이면 다른 PC에서 비밀번호가 바뀐 뒤 다시 들어오는 경우 (화면의 데이터·연결은 그대로 유지)
function loginGate(mode){
  return new Promise(resolve=>{
    const old=document.getElementById('login'); if(old) old.remove();
    const pw=h('input',{class:'inp',id:'lgPw',type:'password',autocomplete:'off',maxlength:'100',placeholder:'비밀번호'});
    const pw2=h('input',{class:'inp',id:'lgPw2',type:'password',autocomplete:'off',maxlength:'100',placeholder:'비밀번호 확인'});
    const msg=h('div',{class:'lgmsg'}), note=h('div',{class:'lgnote'});
    const btn=h('button',{class:'btn pri lgbtn',id:'lgBtn',type:'submit'},'로그인');
    const conf=h('div',{class:'lgconf'},h('label',{class:'lbl'},'비밀번호 확인'),pw2); conf.hidden=true;
    const keep=h('input',{type:'checkbox',id:'lgKeep'}); keep.checked=!!ENC.keep;
    const keepRow=h('label',{class:'lgkeep'},keep,h('span',null,'로그인 유지'));
    const form=h('form',{class:'lgcard',autocomplete:'off'},
      h('div',{class:'lgtit'},mode==='relogin'?'다시 로그인해 주세요':'샘플오피스 워크스페이스'),
      h('div',{class:'lgsub'},mode==='relogin'?'공유 파일의 비밀번호와 맞지 않습니다.\n다른 PC에서 바뀌었을 수 있습니다. 바뀐 비밀번호를 입력하면 이어서 쓸 수 있습니다.':'팀 공용 비밀번호를 입력하세요'),
      pw,conf,keepRow,note,msg,btn);
    const wrap=h('div',{id:'login'},form); document.body.append(wrap);
    if(!CRYPTO_OK){ [pw,btn].forEach(x=>x.disabled=true); msg.textContent='이 브라우저에서는 암호화 기능을 쓸 수 없습니다. 크롬 또는 엣지로 열어 주세요.'; return; }
    setTimeout(()=>pw.focus(),30);
    // 공유 파일로 비밀번호가 확인되기 전에는 화면을 열지 않음.
    // 이 PC가 공유 파일 위치를 모르고(캐시 삭제 · 새 PC) 확인용 값도 없으면 → 공유 파일을 골라 확인
    let setup=null, busy=false, pendHd=null;   // setup: 'file'(암호화 전 팀 파일을 처음 암호화)
    let pickMode=!(fh||fhPending)&&!isEnc(LS.get('encv',null));
    const baseLabel=()=>setup?'확인':'로그인';
    const setPick=on=>{ pickMode=on; btn.textContent=baseLabel(); sub.textContent=mode==='relogin'?sub.textContent:(on?'비밀번호 입력 후 공유폴더의 팀 파일을 선택하세요':'팀 공용 비밀번호를 입력하세요'); };
    const sub=form.querySelector('.lgsub'); setPick(pickMode);
    const fail=t=>{ msg.textContent=t; busy=false; btn.disabled=false; btn.textContent=baseLabel(); };
    const askSetup=()=>{ setup='file'; conf.hidden=false; pw.readOnly=true; pw2.value=''; msg.textContent='';
      note.textContent='공유 파일이 아직 암호화되지 않았습니다.\n지금 입력한 비밀번호로 암호화합니다. 팀원 모두 이 비밀번호로 로그인해야 합니다.\n비밀번호를 한 번 더 입력하세요.';
      busy=false; btn.disabled=false; btn.textContent=baseLabel(); setTimeout(()=>pw2.focus(),30); };
    const done=(cred,hd)=>{
      if(mode==='relogin'){ if(!ENC.cred||ENC.cred.pw!==cred.pw) ENC.old=ENC.cred; }
      ENC.cred=cred; ENC.keep=keep.checked; if(!ENC.keep) clearKeep();
      ENC.verOk=true; saveVerifier();
      wrap.remove(); resolve(hd||null); };
    // 내용이 있는 워크스페이스 파일인지 (빈 파일 · 껍데기 파일로는 처음 설정 불가)
    const hasContent=r=>isWorkspaceJson(r)&&((r.meta&&Array.isArray(r.meta.members)&&r.meta.members.length>0)||COLS.some(c=>Array.isArray(r[c])&&r[c].length>0));
    // 파일 내용으로 확인: 'ok' · 'bad'(비밀번호 틀림) · 'setup'(암호화 전 팀 파일) · 문구(막힘)
    const checkText=async(text,cred)=>{
      if(!text||!text.trim()) return '빈 파일입니다. 공유폴더의 팀 파일을 선택해 주세요';
      let raw; try{ raw=JSON.parse(text); }catch(e){ return '워크스페이스 공유 파일이 아닙니다. 공유폴더의 팀 파일을 선택해 주세요'; }
      if(isEnc(raw)){ try{ await tryDec(raw,cred); ENC.salt=raw.salt; return 'ok'; }catch(e){ return 'bad'; } }
      if(hasContent(raw)) return ALLOW_PLAIN_SETUP?'setup':'암호화된 팀 공유 파일이 아닙니다. 공유폴더의 팀 파일을 선택해 주세요';
      return '워크스페이스 공유 파일이 아닙니다. 공유폴더의 팀 파일을 선택해 주세요';
    };
    const readHd=async hd=>{ try{ const f=await withTimeout(hd.getFile(),30000,''); if(f.size>MAX_FILE) return null; return await f.text(); }catch(e){ return null; } };
    const settle=(r,hd)=>{
      if(r==='ok') return done(mkCred('',pw.value),hd);
      if(r==='bad') return fail('비밀번호가 올바르지 않습니다');
      if(r==='setup'){ pendHd=hd; return askSetup(); }
      return fail(r);
    };
    form.addEventListener('submit',async e=>{
      e.preventDefault(); if(busy) return;
      const cred=mkCred('',pw.value);
      if(setup){
        const reset=t=>{ setup=null; conf.hidden=true; pw.readOnly=false; pw.value=''; pw2.value=''; note.textContent=''; fail(t); pw.focus(); };
        if(pw2.value!==cred.pw) return reset('비밀번호가 서로 다릅니다. 처음부터 다시 입력하세요');
        if(cred.pw.length<8) return reset('공유 파일을 처음 암호화할 때는 비밀번호를 8자 이상으로 정해 주세요');
        if(pendHd&&pendHd!==fh){ fhPending=pendHd; idbSet('fh',pendHd); }
        return done(cred,pendHd);
      }
      if(!cred.pw) return fail('비밀번호를 입력하세요');
      busy=true; btn.disabled=true; msg.textContent='';
      // ⓪ 공유 파일 위치를 모르는 PC: 파일을 골라서 확인 (파일 선택 창은 클릭 직후 바로 열어야 뜸)
      if(pickMode){
        if(!FS_OK) return fail('이 브라우저에서는 공유 파일을 열 수 없습니다. 크롬 또는 엣지로 열어 주세요');
        let hd; try{ [hd]=await window.showOpenFilePicker({id:'tw-data',types:[{description:'워크스페이스 공유 파일 (.json)',accept:{'application/json':['.json']}}]}); }
        catch(err){ return fail(err&&err.name==='AbortError'?'공유 파일을 선택해야 로그인할 수 있습니다':'공유 파일을 열지 못했습니다'); }
        btn.textContent='확인 중…';
        let perm=null; try{ perm=await hd.requestPermission({mode:'readwrite'}); }catch(err){}
        if(perm!=='granted') return fail('파일 사용 권한이 허용되지 않았습니다. 다시 시도해서 「허용」을 눌러 주세요');
        const text=await readHd(hd); if(text==null) return fail('공유 파일을 읽지 못했습니다');
        const r=await checkText(text,cred);
        if(r==='ok'){ fhPending=hd; idbSet('fh',hd); }
        return settle(r,hd);
      }
      btn.textContent='확인 중…';
      // ① 기억된 공유 파일로 확인 (권한 요청은 클릭 직후 바로 해야 창이 뜸)
      const hd=fh||fhPending; let perm=fh?'granted':null;
      if(hd&&!perm){ try{ perm=await hd.requestPermission({mode:'readwrite'}); }catch(err){ perm=null; } }
      if(hd&&perm==='granted'){
        const text=await readHd(hd);
        if(text!=null) return settle(await checkText(text,cred),hd);
      }
      // ② 공유 파일에 접근할 수 없을 때: 예전에 공유 파일로 확인받은 PC만 (그때 남긴 확인용 값으로)
      const v=await checkVerifier(cred);
      if(v===true) return done(cred,null);
      if(v===false) return fail('비밀번호가 올바르지 않습니다');
      setPick(true); fail('공유 파일에 접근할 수 없습니다. 공유폴더의 팀 파일을 직접 선택해 주세요');
    });
  });
}
let reloginOpen=false;
async function keyLost(){
  if(reloginOpen) return; reloginOpen=true; clearKeep();
  try{ await loginGate('relogin'); }finally{ reloginOpen=false; }
  lastMod=-1; markDirty(); await syncNow(); refresh(); toast(syncState==='ok'?'다시 로그인했습니다':'동기화 오류: '+syncErr);
}
async function logout(){
  if(fh&&dirty){ try{ await syncNow(); }catch(e){} }
  await clearKeep();
  location.reload();
}
// 비밀번호 바꾸기 (공유 파일에 연결된 상태에서만). 바꾸면 다른 PC는 다시 로그인해야 함
async function changeCred(){
  if(!fh||syncState!=='ok') return toast('공유 파일에 연결된 상태에서만 바꿀 수 있습니다');
  const cur=h('input',{class:'inp',type:'password',autocomplete:'off'}),
    npw=h('input',{class:'inp',type:'password',autocomplete:'off',maxlength:'100'}), npw2=h('input',{class:'inp',type:'password',autocomplete:'off',maxlength:'100'});
  const body=h('div',null,h('div',{class:'mtxt'},'팀 공용 비밀번호를 바꿉니다.\n바꾸면 다른 PC는 새 비밀번호로 다시 로그인해야 합니다.\n이전에 저장된 자동 백업은 예전 비밀번호로 열립니다.'),
    h('label',{class:'lbl'},'현재 비밀번호'),cur,h('label',{class:'lbl'},'새 비밀번호 (8자 이상)'),npw,h('label',{class:'lbl'},'새 비밀번호 확인'),npw2);
  for(;;){ const r=await modal('비밀번호 변경',body,[{label:'취소',val:null},{label:'변경',val:'ok',primary:true}]);
    if(r!=='ok') return;
    let okCur=false; try{ okCur=(await tryDec(JSON.parse(await encText('tw-ok')),mkCred('',cur.value)))==='tw-ok'; }catch(e){}
    if(!okCur){ toast('현재 비밀번호가 맞지 않습니다'); continue; }
    if(npw.value.length<8){ toast('새 비밀번호는 8자 이상으로 정해 주세요'); continue; }
    if(npw.value!==npw2.value){ toast('새 비밀번호가 서로 다릅니다'); continue; }
    break; }
  ENC.old=ENC.cred; ENC.cred=mkCred('',npw.value); ENC.salt=null;
  markDirty(); await syncNow(); await saveVerifier();
  toast(syncState==='ok'?'비밀번호를 바꿨습니다. 다른 PC는 다시 로그인해야 합니다':'저장 오류: '+syncErr);
}
// 로그인 뒤 사용자 고르기 (계정은 공용, 사용자는 각자). 이 PC에서 지난번에 쓴 사용자가 맨 앞
async function pickUser(){
  const list=[...DB.meta.members].sort((a,b)=>a.localeCompare(b,'ko')); if(ME&&list.includes(ME)){ list.splice(list.indexOf(ME),1); list.unshift(ME); }
  const inp=h('input',{class:'inp',maxlength:'30',placeholder:'새 사용자 이름 (예: 홍길동)'}); let picked=null;
  const body=h('div',{class:'accpick'},
    list.length?h('div',null,h('div',{class:'lbl',style:'margin-top:0'},'사용자 고르기'),
      h('div',{class:'acclist'},list.map(n=>h('button',{class:'accbtn'+(n===ME?' on':''),onclick:()=>{ picked=n; body.closest('.ov')._done('ok'); }},avatar(n,28),h('span',null,n),n===ME?h('small',{class:'hint',style:'margin-left:auto'},'지난번 사용'):null)))):null,
    h('div',{class:'lbl'},list.length?'또는 새 사용자 추가':'사용자 이름'),
    h('div',{class:'accnew'},inp,h('button',{class:'btn pri',onclick:()=>{ if(!inp.value.trim()){ inp.focus(); return toast('이름을 입력하세요'); } body.closest('.ov')._done('ok'); }},list.length?'추가':'시작')),
    h('div',{class:'hint',style:'margin-top:8px'},'팀원에게 보일 이름입니다. 왼쪽 아래 이름을 눌러 바꿀 수 있습니다.'));
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); if(inp.value.trim()) body.closest('.ov')._done('ok'); } });
  for(;;){ const r=await modal('👤 사용자 선택',body,[],true); if(r!=='ok') continue;
    const v=(picked||inp.value).trim().slice(0,30); if(!v){ picked=null; continue; }

      if(!isWorkspaceJson(raw)) throw new Error('워크스페이스 데이터 파일이 아닙니다 (예: 라운지 대시보드 파일). 다른 파일을 골라 주세요'); // 팀 파일에 이 PC의 샘플이 섞이지 않게

function purgeSamples(d){

/* ---------- 꾸밈이 바로 보이는 입력칸 (채널 입력·메시지 수정) ----------

   textarea처럼 value / selectionStart / selectionEnd / setSelectionRange 를 쓸 수 있게 맞춰 두었다.
   화면을 다시 그리면 브라우저 기본 되돌리기가 끊기므로 Ctrl+Z / Ctrl+Y 는 직접 처리한다. */
function richInput(opts){
  const el=h('div',{class:'rtx '+(opts.cls||''),contenteditable:'plaintext-only',spellcheck:'false','data-ph':opts.placeholder||'',role:'textbox'});
  el._rich=true;
  const text=()=>el.textContent.replace(/ /g,' ');
  const sel=()=>selOffsets(el)||[text().length,text().length];
  const paint=(v,a,b)=>{ last=v||''; el.textContent=''; if(v) el.append(fmtFrag(v)); if(v&&v.endsWith('\n')) el.append(h('br')); /* 마지막 빈 줄이 보이도록 */ if(a!=null&&document.activeElement===el) selectRange(el,a,b==null?a:b); };
  // 되돌리기 기록
  const H={st:[{v:'',a:0,b:0}],i:0,t:0};
  const rec=(force)=>{ const v=text(), [a,b]=sel(), cur=H.st[H.i]; if(cur&&cur.v===v) { cur.a=a; cur.b=b; return; }
    const t=now(); if(!force&&t-H.t<700&&H.i>0&&H.st.length-1===H.i){ H.st[H.i]={v,a,b}; } else { H.st.splice(H.i+1); H.st.push({v,a,b}); if(H.st.length>200) H.st.shift(); H.i=H.st.length-1; } H.t=t; };
  const step=d=>{ const j=H.i+d; if(j<0||j>=H.st.length) return; H.i=j; const s=H.st[j]; paint(s.v,s.a,s.b); H.t=0; opts.onInput&&opts.onInput(); };
  Object.defineProperty(el,'value',{get:text,set:v=>{ paint(String(v||'')); H.st=[{v:String(v||''),a:0,b:0}]; H.i=0; }});
  Object.defineProperty(el,'selectionStart',{get:()=>sel()[0]});
  Object.defineProperty(el,'selectionEnd',{get:()=>sel()[1]});
  el.setSelectionRange=(a,b)=>{ el.focus(); selectRange(el,a,b==null?a:b); };
  el._set=(v,a,b)=>{ paint(v,a,b); rec(true); opts.onInput&&opts.onInput(); };   // 꾸미기 적용용
  let last='';
  const fix=()=>{ const r=fmtRepair(last,text(),sel()[0]); if(r){ paint(r.text,r.caret); } else if(hasFmt(text())||el.querySelector('b,u,s,span')){ const [a,b]=sel(); paint(text(),a,b); } last=text(); };
  el.addEventListener('input',e=>{
    if(el.textContent===''&&el.firstChild) el.textContent='';
    if(!e.isComposing){ fix(); rec(); } opts.onInput&&opts.onInput();
  });
  el.addEventListener('compositionend',()=>setTimeout(()=>{ fix(); rec(); },0));
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.shiftKey&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); const v=text(); let [a,b]=sel(); if(a===b) while(v[a]===FC){ a++; b++; } el._set(v.slice(0,a)+'\n'+v.slice(b),a+1); return; }   // Shift+Enter 줄바꿈 (꾸민 글자 끝이면 꾸밈 밖에서)
    if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.isComposing){ const k=e.key.toLowerCase();
      if(k==='z'&&!e.shiftKey){ e.preventDefault(); e.stopPropagation(); rec(); step(-1); return; }
      if(k==='y'||(k==='z'&&e.shiftKey)){ e.preventDefault(); e.stopPropagation(); step(1); return; } }
  });
  // 붙여넣기는 글자만 (사진은 따로 처리하는 곳에서 먼저 가로챔)
  el.addEventListener('paste',e=>{ if(e.defaultPrevented) return; let t=''; try{ const cd=e.clipboardData||window.clipboardData; t=cd&&cd.getData?cd.getData('text/plain'):''; }catch(_){} if(!t) return; e.preventDefault(); document.execCommand('insertText',false,t); });
  if(opts.value){ el.value=opts.value; }
  return el;
}

function richText0(text){
  const frag=document.createDocumentFragment();

  const shorts=shortAliases(); const sl=shorts.map(x=>reEsc(x[0])).sort((a,b)=>b.length-a.length);
  const re=new RegExp('@(?:(everyone|전체)(?![가-힣A-Za-z0-9])|('+(names.join('|')||'(?!)')+')|('+(sl.join('|')||'(?!)')+')'+SHORT_END+')','gi'); let last=0,m;

function mentionsMe(m,self){

  if(m.text.includes('@'+ME)) return true;

}

function modal(title,body,buttons,locked){

    const box=h('div',{class:'mod'},h('div',{class:'modt'},title),body,

    ov.append(box); if(!locked) ov.addEventListener('mousedown',e=>{if(e.target===ov)done(null);});
    document.body.append(ov); const f=box.querySelector('input:not([type=checkbox]):not([type=hidden]),textarea');
    // 입력칸이 없는 확인 창(삭제 등)은 확인 버튼에 바로 초점 → Enter 한 번으로 실행

/* ---------- 굿모닝 브리핑 · 퇴근 전 리마인드 (개인별 · 이 PC에 저장) ----------
   설정(하루 루틴·업무 범위·퇴근 시간)은 내 공간에서. 하루가 바뀌면 루틴 체크와 「오늘 꼭 할 일」은 새로 시작 */
const GM_DEF={routines:[],scope:'all',incTasks:true,incCal:true,auto:true,at:'08:00',off:'17:00'};
const gmCfg=()=>({...GM_DEF,...(LS.get('gm:'+ME,{})||{})});

function gmDay(){ const d=LS.get('gmDay:'+ME,null), t=ymd(now()); return d&&d.date===t?d:{date:t,rdone:[],must:[],shown:false,reminded:false}; }
const gmSetDay=o=>LS.set('gmDay:'+ME,{...gmDay(),...o});
const mySpaceOf=()=>ME?DB.spaces.find(sp=>isMe(spaceOwner(sp))):null;
function gmTasks(){ const c=gmCfg(), today=ymd(now()), sp=mySpaceOf();
  let list=sp?dirsOf(sp.id).filter(t=>t.status!=='done'):[];
  if(c.incTasks) for(const t of DB.tasks) if(!t.sp&&meAsg(t)&&t.status!=='done'&&!list.includes(t)) list.push(t);
  if(c.scope==='today') list=list.filter(t=>t.prio||(t.due&&t.due<=today)||gmDay().must.some(m=>m.task===t.id));
  const dk=t=>t.due||'9999'; return list.sort((a,b)=>(b.prio-a.prio)||(dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0)); }
const atMin=()=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(gmCfg().at||'')||[0,8,0]; return +m[1]*60+ +m[2]; };
const offMin=()=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(gmCfg().off||'')||[0,17,0]; return +m[1]*60+ +m[2]; };
const nowMin=()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const fMin=m=>`${m>=720?'오후':'오전'} ${((Math.floor(m/60)+11)%12)+1}:${String(m%60).padStart(2,'0')}`;
function mustDone(m){ if(m.task){ const t=DB.tasks.find(x=>x.id===m.task); if(t) return t.status==='done'; } return !!m.done; }
function setMust(m,on){ const d=gmDay(); const it=d.must.find(x=>x.id===m.id); if(!it) return;
  if(it.task){ const t=DB.tasks.find(x=>x.id===it.task); if(t){ t.status=on?'done':'todo'; if(on&&!t.ackAt){ t.ackAt=now(); t.ackBy=ME; } touchTask(t); } }
  it.done=on; gmSetDay({must:d.must}); }
function toggleMustTask(t){ const d=gmDay(), i=d.must.findIndex(m=>m.task===t.id);
  if(i>=0) d.must.splice(i,1); else d.must.push({id:uid(),task:t.id,text:t.title||'제목 없음',done:false}); gmSetDay({must:d.must}); return i<0; }
function addMust(text){ text=String(text||'').trim().slice(0,200); if(!text) return false; const d=gmDay(); d.must.push({id:uid(),text,done:false}); gmSetDay({must:d.must}); return true; }
// 브리핑·리마인드에서 함께 쓰는 「오늘 꼭 할 일」 목록
function mustBox(onChange){

        h('button',{class:'ib',title:'목록에서 빼기',onclick:e=>{ e.preventDefault(); const d2=gmDay(); gmSetDay({must:d2.must.filter(x=>x.id!==m.id)}); draw(); onChange&&onChange(); }},'×'))); }
    if(!d.must.length) box.append(h('div',{class:'hint gmempty'},'아직 없습니다. 업무 옆 ☆를 누르거나 아래에 직접 적어 두세요.'));

/* ----- 공휴일 자동: HOLI에서 그 달 공휴일을 묶어 상자로 (설·추석은 연휴로, 바로 붙은 대체공휴일도 함께) ----- */
function autoHolis(y,m){
  const pre=`${y}-${pad2(m)}-`, ks=Object.keys(HOLI).filter(k=>k.startsWith(pre)).sort(), out=[];
  const grp=n=>/설날/.test(n)?'seol':/추석/.test(n)?'chu':'';
  for(const k of ks){ const d=+k.slice(8), n=HOLI[k], l=out[out.length-1];
    if(l&&l.e===d-1&&(n==='대체공휴일'||(grp(n)&&grp(n)===l.g))){ l.e=d; l.names.push(n); continue; }
    out.push({key:k,s:d,e:d,g:grp(n),names:[n]}); }
  // 이전 달 끝에서 이어지는 대체공휴일 이름 찾기용
  const prevName=(d)=>{ for(let i=1;i<=7;i++){ const dt=new Date(y,m-1,d-i), kk=`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; const n=HOLI[kk]; if(n&&n!=='대체공휴일') return n.replace(/ 연휴$/,''); } return ''; };
  return out.map(o=>{ const main=o.names.find(n=>n!=='대체공휴일')||'';
    let box, note;
    if(!main){ const pn=prevName(o.s); box='대체 휴일'; note=pn?`${pn} 대체 공휴일`:'대체 공휴일'; }
    else if(o.g==='seol'){ box='설 연휴'; note='설 연휴'+(o.names.includes('대체공휴일')?' (대체 공휴일 포함)':''); }
    else if(o.g==='chu'){ box='추석 연휴'; note='추석 연휴'+(main.includes('개천절')?' (개천절 포함)':'')+(o.names.includes('대체공휴일')?' (대체 공휴일 포함)':''); }
    else if(o.e>o.s){ box=main+' 연휴'; note=`${main} 및 대체 공휴일`; }
    else { box=main; note=main; }
    return {key:o.key,s:o.s,e:o.e>o.s?o.e:'',box,note,auto:true}; });
}

/* 회의록: 안건 줄 → 회의 내용에 「N. 안건」 제목을 만들고 그 아래 「   - 」(3칸) · 「     · 」(5칸) 로 적음 */
const MIN_B1='   - ', MIN_B2='     · ', MIN_HD=/^(\d+)\.\s?(.*)$/;

  const lines=String(body||'')?String(body).split('\n'):[]; const pre=[], secs=[]; let cur=null;
  for(const l of lines){ const m=l.match(MIN_HD); if(m){ cur={t:m[2].trim(),c:[]}; secs.push(cur); } else (cur?cur.c:pre).push(l); }

function minAutoList(ta,kind){   /* Enter 때 다음 줄 머리말 자동 (한글 입력 중 Enter도 처리하려고 input 이벤트에서) */

    const v=ta.value, c=ta.selectionStart; if(c!==ta.selectionEnd||v[c-1]!=='\n') return;
    const ps=v.lastIndexOf('\n',c-2)+1, prev=v.slice(ps,c-1); let rep=null, ins=null, m;
    if(kind==='ag'){ if(m=prev.match(/^\s*(\d+)[.)]\s*(.*)$/)){ if(!m[2].trim()) rep=''; else ins=(+m[1]+1)+'. '; } }
    else if(prev===MIN_B2) rep=MIN_B1;
    else if(prev===MIN_B1) rep='';
    else if(prev.startsWith(MIN_B2)) ins=MIN_B2;
    else if(prev.startsWith(MIN_B1)) ins=MIN_B1;
    else if(MIN_HD.test(prev)) ins=MIN_B1;

/* ---------- 파싱 ---------- */
const RE_MAJOR=/^[□■☐◻]\s*/, RE_DETAIL=/^[·•∙‧ㆍ*○◦]\s*/, RE_MID=/^[-–—]\s*/;
const indentOf=s=>(s.match(/^[ \t　]*/)[0]).replace(/\t/g,'    ').replace(/　/g,'  ').length;
// 날짜로 시작하는 줄: "9/2 : 내용", "09/02: 내용", "9.2 : 내용", "~10/12 : 내용"
const RE_DATE=/^(~\s*)?(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*[:：]\s*/;
function dateTok(type,s){ const dm=s.match(RE_DATE); if(!dm) return null; return {type,text:s.replace(RE_DATE,'').trim(),raw:s,m:+dm[2],d:+dm[3],tilde:!!dm[1]}; }
// 엑셀 복사 시 생기는 따옴표 정리
const QD=/["“”＂]/g;
function cleanQuotes(s){
  s=s.trim().replace(/""/g,'"').replace(/[\\＼]/g,'₩');
  for(let k=0;k<4;k++){
    const before=s; s=s.replace(/^['‘’`´]+\s*/,'');
    const odd=((s.match(QD)||[]).length%2)===1, q=/^["“”＂]/.test(s), qe=/["“”＂]$/.test(s);
    if(q&&qe&&s.length>=2&&!/["“”＂]/.test(s.slice(1,-1))) s=s.slice(1,-1).trim();
    else if(odd&&q) s=s.slice(1).trim();
    else if(odd&&qe) s=s.slice(0,-1).trim();
    if(s===before) break;
  }
  return s;
}
function classify(raw){
  const lead=(raw.match(/^[ \t　]*/)||[''])[0]; raw=lead+cleanQuotes(raw);
  const t=raw.trim(); if(!t) return {type:'blank'};
  if(RE_MAJOR.test(t)) return {type:'major',text:t.replace(RE_MAJOR,'').trim()};
  if(RE_DETAIL.test(t)){ const orig=t.replace(RE_DETAIL,'').trim(); const x=orig.replace(/^['‘’`´]+\s*/,'').trim(); return Object.assign(dateTok('detail',x)||{type:'detail',text:x},{orig}); }
  const hadMid=RE_MID.test(t); const s=t.replace(RE_MID,'').replace(/^['‘’`´]+\s*/,'').trim();
  const dt=dateTok('mid',s); if(dt) return dt;
  if(hadMid) return {type:'mid',text:s};
  if(indentOf(raw)>=4) return {type:'detail',text:t};
  return {type:'plain',text:t};
}
function parseBulk(text){
  const toks=text.split(/\r?\n/).map(classify).filter(t=>t.type!=='blank');
  toks.forEach((t,i)=>{ if(t.type==='plain'){ const nx=toks[i+1]; t.type=(nx&&nx.type==='detail')?'mid':'major'; } });
  const result=[]; let cur=null;
  toks.forEach(t=>{
    if(t.type==='major'){ cur={title:t.text,lines:[]}; result.push(cur); return; }
    if(!cur){ cur={title:'',lines:[]}; result.push(cur); }
    cur.lines.push(t.type==='detail'?'        · '+(t.orig||t.text):(t.raw||t.text));
  });

function parseCounts(text){

const RE_NUMU=/(\d[\d,]*)\s*(EA|ea|Ea|건|개|대|명|회|매|부|장|곳|통|식|세트|SET|set|권|박스|BOX|box)/g;

function analyzeWeekly(body){
  const toks=(body||'').split(/\r?\n/).map(classify).filter(t=>t.type!=='blank');
  const entries=[]; let keep=true, cur=null, dated=0, hit=0;
  toks.forEach(t=>{

    keep=true; cur=null; entries.push({plain:I3+t.text});
  });
  if(opts.sum!==false){
    const groups=[];
    entries.forEach(e=>{
      if(!e.t||e.t.tilde) return; const c=parseCounts(e.t.text); if(!c) return;
      let g=groups.find(g=>g.items.some(it=>c.some(x=>sameLabel(x,it)))); if(!g){ g={items:[],ents:[]}; groups.push(g); }

const D1='   □ ', D2='      - ', D3='        · ';
function analyzeDaily(body){

function resSummary(cards){
  let res=0, can=0, last=null, order=0; const srcR=[], srcL=[]; const rest=new Map();
  cards.forEach(it=>{
    const blocks=[]; let cur=null;
    (it.body||'').split(/\r?\n/).forEach(line=>{ const t=classify(line); if(t.type==='blank') return; if(t.type==='detail'&&cur){ cur.dets.push({line,t}); return; } cur={line,t,dets:[]}; blocks.push(cur); });
    const keep=[]; const dateStr=t=>`${t.tilde?'~':''}${t.m}/${t.d} : `;
    const take=(x,when,ds)=>{
      const kept=[]; let inRemain=false, used=false;

        order++;

          }

function buildWeekly(){
  NOTES=[]; const parts=[]; let num=0;
  WGROUPS.forEach((gName,gi)=>{
    const lines=[];
    WCATS.filter(w=>w.g===gi).forEach(w=>{
      const cards=items.filter(i=>i.cat===w.k);
      const tpls=opts.lounge!==false?WSET.tpls.filter(x=>x.on&&x.to===w.k&&String(x.text||'').trim()):[];
      const S=tpls.some(x=>RE_TPL_RES.test(x.text))?resSummary(cards):{rest:new Map()};
      const blocks=tpls.map(tp=>renderTpl(tp,S));
      const list=cards.map(it=>{ const body=S.rest.has(it.id)?S.rest.get(it.id):it.body; return {it,a:analyze(body),cut:body!==it.body}; })
        .filter(x=>!(opts.skipNoToday&&x.a.dated&&!x.a.hit)&&!(x.cut&&!x.a.lines.length));
      if(!list.length&&!blocks.length) return;

      list.forEach(({it,a})=>{

        const blk=blocks.find(b=>b.key&&nk(title)===b.key); if(blk){ blk.lines.push(...a.lines); return; }

      rows.sort((x,y)=>{ if(x.start===null||y.start===null) return (x.start===null)-(y.start===null)||x.i-y.i; return x.start-y.start||(x.end-x.start)-(y.end-y.start)||x.i-y.i; });

function stripExcelQuotes(v){ const t=v.trim(); if(t.length>=2&&/^["“”]/.test(t)&&/["“”]$/.test(t)) return t.slice(1,-1).replace(/""/g,'"'); return v; }
// 엑셀 붙여넣기 → 셀 배열 (행 × 열). 줄바꿈이 있는 셀은 "..." 로 감싸져 오고, 안의 " 는 "" 로 옴
function parseCells(text){
  text=(text||'').replace(/\r\n?/g,'\n'); while(text.endsWith('\n')) text=text.slice(0,-1);
  const rows=[]; let row=[], f='', i=0; const isEnd=k=>k>=text.length||text[k]==='\t'||text[k]==='\n';
  while(i<text.length){
    const c=text[i];
    if(c==='"'&&f===''){
      let k=i+1, close=-1;
      while(k<text.length){ if(text[k]==='"'){ if(text[k+1]==='"'){ k+=2; continue; } if(isEnd(k+1)) close=k; break; } k++; }
      if(close>-1){ f=text.slice(i+1,close).replace(/""/g,'"'); i=close+1; continue; }
    }
    if(c==='\t'){ row.push(f); f=''; i++; continue; }
    if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; i++; continue; }
    f+=c; i++;
  }
  row.push(f); rows.push(row); return rows;
}
const normBody=body=>(body||'').split(/\r?\n/).map(classify).filter(t=>t.type!=='blank').map(t=>t.type==='detail'?'        · '+(t.orig||t.text):(t.raw||t.text)).join('\n');
const normTitle=t=>cleanQuotes((t||'').replace(/\s*\n\s*/g,' ')).replace(RE_MAJOR,'').trim();
const findMap=label=>{ const k=normKey(label); return k?CMAP.find(m=>normKey(m.l)===k):undefined; };
function splitSpace(s){ const m=(s||'').trim().match(/^(\S+)\s+([\s\S]+)$/); return m&&findMap(m[1])?{label:m[1],rest:m[2]}:null; }
function collectPairs(){
  const tRaw=R.inTitle.value, bRaw=R.inBody.value;
  const tRows=tRaw.trim()?parseCells(tRaw):[], nonEmpty=tRows.filter(r=>r.join('').trim());
  let rows, catMode=false;
  if(tRows.some(r=>r.length>=2&&(findMap(r[0])||isGubun(normTitle(r[0]))))){
    catMode=true;   // 엑셀 A열(구분) + B열(대분류) [+ C열(진행 내용)]
    rows=tRows.map(r=>{ if(r.length<2) return {cat:null,title:r[0]}; const m=findMap(r[0]); return {cat:m?m.c:null,gl:r[0],title:r[1],body:r[2]}; });
  }else if(nonEmpty.length>=2&&nonEmpty.every(r=>r.length===1&&splitSpace(r[0]))){
    catMode=true; rows=tRows.map(r=>{ const s=splitSpace(r[0]); return s?{cat:findMap(s.label).c,gl:s.label,title:s.rest}:{cat:null,title:r[0]}; });
  }else if(tRows.some(r=>r.length>=2)&&!bRaw.trim()){
    rows=tRows.map(r=>({cat:null,title:r[0],body:r[1]||''})); return {pairs:rows,tN:rows.length,bN:rows.length,catMode};
  }else rows=tRows.map(r=>({cat:null,title:r[0]}));
  if(rows.length<=1){
    const r=rows[0]||{cat:null,title:''}; let body=r.body;
    if(body===undefined||body===''){ const bRows=bRaw.trim()?parseCells(bRaw):[]; body=bRows.length===1?bRows[0].join(' '):stripExcelQuotes(bRaw); }
    return {pairs:[{...r,body}],tN:rows.length,bN:(body||'').trim()?1:0,catMode};
  }
  const hasCol=rows.some(r=>r.body);
  const bodies=hasCol?rows.map(r=>r.body||''):(bRaw.trim()?parseCells(bRaw).map(r=>r[0]):[]);
  const n=Math.max(rows.length,bodies.length), pairs=[];
  for(let k=0;k<n;k++){ const r=rows[k]||{cat:null,title:''}; pairs.push({cat:r.cat,gl:r.gl,title:r.title||'',body:bodies[k]||''}); }
  return {pairs,tN:rows.length,bN:hasCol?rows.length:bodies.length,catMode};
}
function updateCounts(){
  const el=R.count; if(!el) return;
  if(!R.inTitle.value.trim()&&!R.inBody.value.trim()){ el.textContent=''; return; }
  const {tN,bN,catMode}=collectPairs();
  el.textContent=`대분류 ${tN}개${catMode?'(구분 자동분류)':''} / 진행 내용 ${bN}개`;
  el.className='rcount'+(tN>1&&bN&&tN!==bN?' mis':'');
}
let importing=false;
async function doImport(){
  if(importing) return;
  const {pairs,tN,bN}=collectPairs();
  const list=pairs.map(p=>({cat:p.cat||null,gl:p.gl?normTitle(p.gl):undefined,title:normTitle(p.title),body:normBody(p.body)})).filter(p=>p.title||p.body);
  if(!list.length) return toast('입력한 내용이 없습니다');
  if(tN>1&&bN&&tN!==bN){ importing=true; const ok=await ask('개수가 다릅니다',`대분류 ${tN}개, 진행 내용 ${bN}개로 개수가 다릅니다.\n순서대로 짝지어 추가할까요?`,'추가'); importing=false; if(!ok) return; }

}

async function fromDaily(){
  const src=sanitize('daily',readStore('daily')).items;
  if(!src.length) return toast('일일보고에 항목이 없습니다');
  let add=0, upd=0;
  src.forEach(x=>{
    const k=normKey(x.title), ex=k&&items.find(i=>normKey(i.title)===k);
    if(ex){ ex.body=x.body; if(x.gl) ex.gl=x.gl; if(x.cat) ex.dc=x.cat; if(!ex.manual) ex.cat=guessSub(x.title,x.cat,ex.gl,true); upd++; }   /* 직접 옮긴 카드가 아니면 최신 규칙으로 다시 분류 */
    else { items.push({id:seq++,cat:guessSub(x.title,x.cat,x.gl),dc:x.cat||undefined,gl:x.gl,title:x.title,body:x.body}); add++; }
  });
  renderBoard(); toast(`일일보고에서 추가 ${add}개 · 갱신 ${upd}개`);
}

/* ---------- 업무 자동화 › 웹앱 바로가기 ----------
   데이터를 쌓는 웹앱(라운지 운영 대시보드, IT자산현황 등)은 각자 자기 파일에 저장하고, 워크스페이스는 새 탭으로 여는 바로가기만 가진다.
   이름·경로는 공유 파일에 저장되어 한 번 정해 두면 팀원 모두에게 유지된다. */
const LINK_DEF=[{id:'lk_lounge',name:'비즈니스 라운지 운영 대시보드',icon:'🏢',ord:1},{id:'lk_asset',name:'IT자산현황',icon:'💻',ord:2}];
const LINK_ICONS=['🔗','🏢','💻','📊','📋','🗂','📦','🧾','🛠','📈'];
// 처음 한 번만 기본 바로가기 두 개를 만든다 (지운 뒤에는 다시 만들지 않음).
// bump: 공유 파일과 합친 직후에만 meta 시각을 올려 표시를 팀에 퍼뜨린다 (연결 전에 올리면 팀의 이름 설정을 덮어쓸 수 있음)
function seedLinks(bump){
  if(DB.meta.lkInit) return false; let n=0;
  for(const d of LINK_DEF) if(!DB.links.some(x=>x.id===d.id)&&!DB.deleted[d.id]){ DB.links.push({...d,path:'',by:ME||'',u:1}); n++; }
  DB.meta.lkInit=true; if(bump) DB.meta.u=now(); return n>0||!!bump;
}
// 경로 → 여는 주소. 파일 이름만 쓰면 워크스페이스 HTML과 같은 폴더에서 찾는다
function linkUrl(p){
  p=String(p||'').trim().replace(/^"(.*)"$/,'$1').trim(); if(!p) return null;
  try{
    if(/^https?:\/\//i.test(p)||/^file:\/\//i.test(p)) return new URL(p).href;
    if(/^[a-zA-Z]:[\\/]/.test(p)) return new URL('file:///'+p.replace(/\\/g,'/')).href;        // Z:\폴더\파일.html
    if(/^\\\\[^\\]/.test(p)) return new URL('file://'+p.slice(2).replace(/\\/g,'/')).href;     // \\서버\공유\파일.html
    if(/^[a-z][a-z0-9+.-]*:/i.test(p)) return null;                                             // javascript: 같은 다른 형식은 막음
    return new URL(p.replace(/\\/g,'/'),location.href).href;                                    // 같은 폴더 기준 상대 경로
  }catch(e){ return null; }
}
// 저장할 때 경로를 읽기 쉽고 다른 PC에서도 통하게 정리:
//  · 주소창에서 복사한 file:///C:/Users/…/%EC%84%9C… 형태도 글자로 되돌림
//  · 같은 드라이브면 워크스페이스 HTML 위치를 기준으로 한 상대 경로로 저장
//    (예: 바탕화면에 두고 쓰면 사용자 이름이 PC마다 달라도 「업무툴\라운지.html」처럼 같은 구조면 열림)
function linkNorm(p){
  p=String(p||'').trim().replace(/^"(.*)"$/,'$1').trim(); const u=linkUrl(p); if(!u||!/^file:/i.test(u)) return p;
  try{
    const dec=x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } };
    const U=new URL(u), here=new URL('.',location.href);
    if(here.protocol==='file:'&&U.host.toLowerCase()===here.host.toLowerCase()){
      const a=dec(here.pathname).split('/').filter(Boolean), b=dec(U.pathname).split('/').filter(Boolean);
      const name=b.pop();
      if(name&&(!/^[a-zA-Z]:$/.test(a[0]||'')||(a[0]||'').toLowerCase()===(b[0]||'').toLowerCase())){
        let k=0; while(k<a.length&&k<b.length&&a[k].toLowerCase()===b[k].toLowerCase()) k++;
        if(k>0) return [...Array(a.length-k).fill('..'),...b.slice(k),name].join('\\');
      }
    }
    if(/^file:\/\//i.test(p)){ const path=dec(U.pathname); return U.host?'\\\\'+U.host+path.replace(/\//g,'\\'):path.replace(/^\/([a-zA-Z]:)/,'$1').replace(/\//g,'\\'); }
  }catch(e){}
  return p;
}
// 내 PC 전용 경로: 이 PC에만 저장. 있으면 팀 공통 경로보다 먼저 씀 (파일을 각자 다른 곳에 두는 경우)
const myLinkPath=l=>{ const m=LS.get('linkMine',{}); return m&&typeof m==='object'&&typeof m[l.id]==='string'?m[l.id]:''; };
function setMyLinkPath(l,p){ const m={...(LS.get('linkMine',{})||{})}; if(p) m[l.id]=p.slice(0,1000); else delete m[l.id]; LS.set('linkMine',m); }
const linkPathOf=l=>myLinkPath(l)||l.path;
function openLink(l){
  if(!linkPathOf(l)) return editLink(l,'먼저 이 웹앱의 경로를 지정하세요.');
  const u=linkUrl(linkPathOf(l)); if(!u){ toast('경로 형식을 확인하세요'); return editLink(l); }
  const w=window.open(u,'_blank'); if(!w) toast('새 탭을 열지 못했습니다. 브라우저 팝업 차단을 확인하세요');
}
// 「찾아보기」: 브라우저는 보안상 고른 파일의 전체 경로를 알려 주지 않는다.
// 그래서 워크스페이스 HTML이 들어 있는 상위 폴더(기준 폴더, 예: 바탕 화면)를 이 PC에서 한 번 골라 두고,
// 그 안에서 고른 파일이 기준 폴더로부터 어떤 폴더들을 거쳐 있는지 계산해 경로를 만든다. 기준 폴더는 이 PC에만 기억.
const LK_ROOT='lkRoot';
const lkDec=x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } };
// 기준 폴더가 워크스페이스 HTML의 상위 폴더인지 확인 → 맞으면 그 폴더까지의 경로 조각(예: ['C:','Users','나','Desktop'])
async function lkRootBase(root){
  const segs=lkDec(new URL('.',location.href).pathname).split('/').filter(Boolean), file=lkDec(location.pathname).split('/').pop();
  for(let i=segs.length-1;i>=0;i--){ if(segs[i].toLowerCase()!==String(root.name||'').toLowerCase()) continue;
    try{ let d=root; for(const x of segs.slice(i+1)) d=await d.getDirectoryHandle(x); await d.getFileHandle(file); return segs.slice(0,i+1); }catch(e){} }
  return null;
}
// 기준 폴더 고르기: 방금 고른 앱 파일이 있는 폴더에서 창이 열림. 폴더 고르기 창에는 파일이 보이지 않는 것이 정상
async function lkPickRoot(near,again){
  const ok=await modal('기준 폴더 지정 (이 PC에서 한 번만)',h('div',{class:'mtxt',style:'white-space:pre-line;line-height:1.7'},(again?'고른 파일이 기준 폴더 밖에 있습니다. 더 위의 폴더를 골라 주세요.\n\n':'브라우저는 보안상 파일의 전체 경로를 알려 주지 않아, 경로 계산용 기준 폴더가 한 번 필요합니다.\n\n')+'다음 창에서 워크스페이스 HTML과 이 앱 파일이 함께 들어 있는 폴더(보통 바탕 화면)로 이동한 뒤 「폴더 선택」을 누르세요.\n※ 폴더 고르기 창에서는 HTML 파일이 보이지 않는 것이 정상입니다.\n다음부터는 파일만 고르면 됩니다.'),[{label:'취소',val:null},{label:'폴더 고르기',val:'ok',primary:true}]);
  if(ok!=='ok') return null;
  let root; try{ root=await showDirectoryPicker({id:'lk-root',mode:'read',startIn:near||'desktop'}); }catch(e){ return null; }
  const base=await lkRootBase(root);
  if(!base){ toast('워크스페이스 HTML이 들어 있는 폴더나 그 위 폴더를 골라 주세요'); return null; }
  const st={h:root,base,host:new URL(location.href).host||''}; await idbSet(LK_ROOT,st); return st;
}
// 고른 파일의 경로 문자열을 돌려줌 (취소·실패면 ''). 순서: ① 앱 파일 고르기(HTML이 보임) → ② 처음 한 번만 기준 폴더
async function browseLink(){
  if(!window.showOpenFilePicker||!window.showDirectoryPicker||location.protocol!=='file:'){ toast('이 환경에서는 찾아보기를 쓸 수 없습니다. 경로를 붙여넣으세요'); return ''; }
  let st=await idbGet(LK_ROOT);
  if(st&&st.h){ try{ if((await st.h.queryPermission({mode:'read'}))!=='granted'&&(await st.h.requestPermission({mode:'read'}))!=='granted') st=null; }catch(e){ st=null; } } else st=null;
  let file; try{ [file]=await showOpenFilePicker({id:'lk-file',startIn:st?st.h:'desktop',types:[{description:'웹앱 (HTML)',accept:{'text/html':['.html','.htm']}}]}); }catch(e){ return ''; }
  for(let tries=0;tries<3;tries++){
    if(!st){ st=await lkPickRoot(file,tries>0); if(!st) return ''; }
    const rel=await st.h.resolve(file);
    if(rel){ const segs=[...st.base,...rel]; const abs=st.host?'\\\\'+st.host+'\\'+segs.join('\\'):segs.join('\\'); return linkNorm(abs); }
    await idbSet(LK_ROOT,null); st=null;
  }
  return '';
}
// 우클릭: 「수정」만 (삭제는 수정 창 안에서)

/* ---------- 원클릭 업데이트 (인터넷·서버 없이 PC 안에서만) ----------
   담당자가 새 버전 HTML을 공유 폴더(데이터 파일이 있는 폴더)에 넣어 두면, 각 PC는 「새 버전으로 업데이트」 한 번으로
   바탕화면 등 자기 PC의 워크스페이스 HTML을 새 버전으로 덮어쓴다. 브라우저가 허락한 파일만 읽고 쓰며 외부 통신은 없다.
   · 버전은 HTML 맨 위 <meta name="tw-build">로 비교 (숫자가 더 큰 파일만 업데이트)
   · 내 PC 파일은 처음 한 번만 「이 파일」을 골라 쓰기 허락 → 이 PC에 기억
   · 덮어쓰기 전 지금 버전을 이 PC에 보관해 「이전 버전으로 되돌리기」 가능 */
const MY_BUILD=(document.querySelector('meta[name="tw-build"]')||{}).content||'0';
const fmtB=b=>{ const m=/^20(\d{6})\.(\d+)$/.exec(String(b||'')); return m?`v${m[1]}_${m[2]}`:String(b||''); };   // 화면 표시용: 20261104.2 → v261104_2 (파일 안 표시는 숫자 그대로 두어 이전 버전과도 비교 가능)
const BUILD_RE=/<meta name="tw-build" content="([0-9.]+)"/;
let updAvail=null, hasPrev=false;   // updAvail: {build,hd,name} · hasPrev: 되돌릴 이전 버전 보관 여부
idbGet('prevHtml').then(x=>{ hasPrev=!!(x&&x.text); });
const buildCmp=(a,b)=>{ const x=String(a).split('.').map(Number), y=String(b).split('.').map(Number); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };
const myFileName=()=>{ try{ return decodeURIComponent(location.pathname.split('/').pop()); }catch(e){ return location.pathname.split('/').pop(); } };
// 새 버전을 찾을 폴더: 데이터 파일(.json)이 들어 있는 공유 폴더
async function updFolder(ask){
  const ok=async d=>{ try{ return !!fh&&await (await d.getFileHandle(fh.name)).isSameEntry(fh); }catch(e){ return false; } };
  if(dh&&await ok(dh)) return dh;
  let d=await idbGet('updDir');
  if(d){ try{ const st=await d.queryPermission({mode:'read'}); if(st==='granted'||(ask&&await d.requestPermission({mode:'read'})==='granted')) return d; }catch(e){} if(!ask) return null; }
  if(!ask) return null;
  if(!fh){ toast('먼저 공유 파일에 연결하세요'); return null; }
  if(await modal('공유 폴더 선택 (처음 한 번)',h('div',{class:'mtxt'},`새 버전 파일을 찾을 공유 폴더를 골라 주세요.\n데이터 파일(${fh.name})이 들어 있는 폴더입니다.`),[{label:'취소',val:null},{label:'폴더 고르기',val:'ok',primary:true}])!=='ok') return null;
  try{ d=await showDirectoryPicker({id:'e-workspace',mode:'read'}); }catch(e){ return null; }
  if(!await ok(d)){ toast(`데이터 파일(${fh.name})이 들어 있는 폴더가 아닙니다`); return null; }
  await idbSet('updDir',d); return d;
}
// 공유 폴더에서 지금보다 새 버전 HTML 찾기 (맨 앞 4KB만 읽어 버전 확인)
async function findNewBuild(d){
  let best=null;
  try{ for await (const [name,hd] of d.entries()){ if(hd.kind!=='file'||!/\.html?$/i.test(name)) continue;
    try{ const f=await hd.getFile(); const m=BUILD_RE.exec(await f.slice(0,4096).text()); if(m&&buildCmp(m[1],MY_BUILD)>0&&(!best||buildCmp(m[1],best.build)>0)) best={build:m[1],hd,name,lm:f.lastModified}; }catch(e){} } }catch(e){}
  return best;
}
async function checkUpdate(manual){
  if(location.protocol!=='file:'||!window.showDirectoryPicker) return;
  const d=await updFolder(!!manual); if(!d) return;
  const nb=await findNewBuild(d), had=!!updAvail; updAvail=nb;
  if(!!nb!==had||manual) renderSide();
  if(manual&&!nb) toast('지금이 최신 버전입니다 ('+fmtB(MY_BUILD)+')');
  if(manual&&nb) runUpdate();
}
// 내 PC의 워크스페이스 파일 (덮어쓸 대상): 처음 한 번 고르고 쓰기 허락
async function myFileHandle(){
  let h0=await idbGet('selfFile');
  if(h0){ try{ if(await h0.requestPermission({mode:'readwrite'})==='granted') return h0; }catch(e){} }
  if(await modal('지금 쓰는 파일 선택 (처음 한 번)',h('div',{class:'mtxt'},`업데이트할 내 PC의 워크스페이스 파일을 골라 주세요.\n지금 열려 있는 「${myFileName()}」 파일입니다. (보통 바탕 화면)\n이 PC에만 기억되어 다음부터는 바로 업데이트됩니다.`),[{label:'취소',val:null},{label:'파일 고르기',val:'ok',primary:true}])!=='ok') return null;
  let hd; try{ [hd]=await showOpenFilePicker({id:'tw-self',startIn:'desktop',types:[{description:'워크스페이스 (HTML)',accept:{'text/html':['.html','.htm']}}]}); }catch(e){ return null; }
  if(hd.name!==myFileName()){ toast(`지금 열려 있는 「${myFileName()}」 파일을 골라 주세요`); return null; }
  try{ const m=BUILD_RE.exec(await (await hd.getFile()).slice(0,4096).text()); if(!m||m[1]!==MY_BUILD){ toast('지금 열려 있는 파일과 버전이 다릅니다. 같은 파일을 골라 주세요'); return null; } }catch(e){ return null; }
  try{ const d=await updFolder(false); if(d&&await d.resolve(hd)){ toast('공유 폴더 안의 파일입니다. 바탕 화면 등 내 PC에 있는 워크스페이스 파일을 골라 주세요'); return null; } }catch(e){}
  if(await hd.requestPermission({mode:'readwrite'})!=='granted'){ toast('파일 쓰기 권한이 허용되지 않았습니다'); return null; }
  await idbSet('selfFile',hd); return hd;
}
async function writeSelf(hd,text){ const w=await hd.createWritable(); await w.write(text); await w.close(); }
const validApp=t=>BUILD_RE.test(t.slice(0,4096))&&t.includes('const NAV_DEF=')&&/<\/html>\s*$/i.test(t)&&t.length>200000;
async function runUpdate(){
  if(!updAvail) return checkUpdate(true);
  const nb=updAvail;
  const r=await modal('새 버전으로 업데이트',h('div',{class:'mtxt'},`공유 폴더의 「${nb.name}」(버전 ${fmtB(nb.build)}${nb.lm?` · ${fDay(nb.lm)} ${fTime(nb.lm)}에 올라옴`:''})로 이 PC의 워크스페이스를 업데이트합니다.\n지금 버전(${fmtB(MY_BUILD)})은 이 PC에 보관되어 언제든 되돌릴 수 있습니다.\n팀 데이터는 그대로입니다.`),[{label:'취소',val:null},{label:'업데이트',val:'ok',primary:true}]);
  if(r!=='ok') return;
  const self=await myFileHandle(); if(!self) return;
  try{
    if(await self.isSameEntry(nb.hd)){ toast('공유 폴더의 파일을 직접 열고 있습니다. 바탕 화면 등 내 PC의 파일로 열어 주세요'); return; }
    const text=await (await nb.hd.getFile()).text();
    if(!validApp(text)){ toast('새 버전 파일이 올바르지 않습니다. 담당자에게 확인하세요'); return; }
    const cur=await (await self.getFile()).text();
    await idbSet('prevHtml',{build:MY_BUILD,text:cur,at:now()}); hasPrev=true;
    await writeSelf(self,text);
    toast('업데이트했습니다. 새 버전으로 다시 엽니다'); setTimeout(()=>location.reload(),900);
  }catch(e){ toast('업데이트하지 못했습니다: '+e.message); }
}
async function rollbackUpdate(){
  const prev=await idbGet('prevHtml'); if(!prev||!prev.text) return toast('되돌릴 이전 버전이 없습니다');
  if(await modal('이전 버전으로 되돌리기',h('div',{class:'mtxt'},`이 PC의 워크스페이스를 이전 버전(${fmtB(prev.build)})으로 되돌립니다.\n팀 데이터는 그대로입니다.`),[{label:'취소',val:null},{label:'되돌리기',val:'ok',primary:true}])!=='ok') return;
  const self=await myFileHandle(); if(!self) return;
  try{ await writeSelf(self,prev.text); await idbSet('prevHtml',null); hasPrev=false; toast('이전 버전으로 되돌렸습니다. 다시 엽니다'); setTimeout(()=>location.reload(),900); }catch(e){ toast('되돌리지 못했습니다: '+e.message); }
}

/* ---------- 자동 백업: 공유 폴더 안 「백업」 폴더에 한 달에 한 번 ----------
   매달 1일(1일에 아무도 안 켜면 그 뒤 처음 켠 날) 처음 동기화한 PC가 백업_YYYY-MM.json을 만든다 (이미 있으면 건너뜀).
   최근 24개월치를 남기고 그보다 오래된 것은 정리한다. */
const BK_DIR='백업', BK_RE=/^백업_(\d{4}-\d{2}(?:-\d{2})?)\.json$/, BK_KEEP=24;
let bkBusy=false;
async function bkFolder(create){ if(!dh) return null; try{ return await dh.getDirectoryHandle(BK_DIR,{create:!!create}); }catch(e){ return null; } }
async function listBackups(bd){ const out=[]; if(!bd) return out; for await (const [name,hd] of bd.entries()){ const m=hd.kind==='file'&&name.match(BK_RE); if(m) out.push({name,date:m[1],hd}); } return out.sort((a,b)=>a.date<b.date?1:-1); }
async function autoBackup(force){
  const month=ymd(now()).slice(0,7);
  if(bkBusy||!dh||!fh||syncState!=='ok'||(!force&&LS.get('bkMonth','')===month)) return false;
  bkBusy=true;
  try{
    const bd=await bkFolder(true); if(!bd) return false;
    const name=force?`백업_${ymd(now())}.json`:`백업_${month}.json`; let has=false; try{ await bd.getFileHandle(name); has=true; }catch(e){}
    if(!has||force){ const out=await encText(canon(DB)); const f=await bd.getFileHandle(name,{create:true}); const w=await f.createWritable(); await w.write(out); await w.close(); }
    if(!force) LS.set('bkMonth',month);
    const d=new Date(); const cut=`${d.getFullYear()-2}-${String(d.getMonth()+1).padStart(2,'0')}`;
    for(const b of await listBackups(bd)) if(b.date.slice(0,7)<=cut){ try{ await bd.removeEntry(b.name); }catch(e){} }
    return true;
  }catch(e){ return false; }
  finally{ bkBusy=false; }
}
// 백업 날짜로 되돌리기: 백업에 있던 것은 되살리고, 백업 뒤에 생긴 것은 지운다 (모든 팀원에게 반영)
async function rollbackMenu(){
  const bd=await bkFolder(false); const list=await listBackups(bd);
  if(!list.length){ toast(dh?'아직 자동 백업이 없습니다':'사진·백업 저장 폴더를 먼저 연결하세요'); return; }
  const sel=h('select',{class:'inp'},list.map(b=>h('option',{value:b.name},b.date.length===7?`${b.date.replace('-','년 ')}월 백업`:`${b.date} (되돌리기 직전 백업)`)));
  const r=await modal('자동 백업에서 되돌리기',h('div',null,h('div',{class:'mtxt'},'고른 백업 시점의 상태로 워크스페이스 전체를 되돌립니다.\n그 시점 이후에 새로 생긴 메시지·할 일·일정 등은 지워지고, 그 사이 지운 것은 되살아납니다.\n공유 파일에 연결돼 있으면 모든 팀원의 화면에도 반영됩니다.'),h('label',{class:'lbl'},'백업'),sel),
    [{label:'취소',val:null},{label:'이 날짜로 되돌리기',val:'ok',danger:true}]);
  if(r!=='ok') return;
  const b=list.find(x=>x.name===sel.value); let raw;
  try{ raw=(await parseWsAsk(await (await b.hd.getFile()).text(),'자동 백업 열기')).raw; }catch(e){ toast(e.message&&/열지 않았/.test(e.message)?e.message:'백업 파일을 읽지 못했습니다'); return; }
  if(!isWorkspaceJson(raw)){ toast('워크스페이스 백업 파일이 아닙니다'); return; }
  if(!await typedConfirm('되돌리기 확인',`${b.date} 백업으로 되돌립니다. 지금 상태는 오늘 백업으로 먼저 저장해 둡니다.`,'되돌리기','되돌리기')) return;
  if(fh) await autoBackup(true);
  rollbackTo(clean(raw)); if(fh) await syncNow(); go({type:'cal'}); toast(`${b.date} 상태로 되돌렸습니다`);
}
function rollbackTo(B){
  const t=now();
  for(const c of COLS){
    const keep=new Set(B[c].map(r=>r.id));
    for(const r of DB[c]) if(!keep.has(r.id)) DB.deleted[r.id]=t;
    DB[c]=B[c].map(r=>{ const o={...r,u:t}; delete DB.deleted[r.id];
      if(c==='pages'){ const cur=DB.pages.find(x=>x.id===r.id); o.tu=t; o.ou=t; o.bdel={}; o.blocks=r.blocks.map(b=>({...b,u:t}));
        if(cur) for(const b of cur.blocks) if(!r.blocks.some(x=>x.id===b.id)) o.bdel[b.id]=t; }
      return o; });
  }
  DB.meta={...DB.meta,wsName:B.meta.wsName,labels:B.meta.labels||{},lkInit:true,u:t};
  SNAP.clear(); HIST.clear(); snapAll(); commit();
}

/* ---------- 업무 자동화 › 페널티 대응 ----------
   예약 시스템 표를 붙여넣으면 건마다 철회/반려를 고르고, 철회 사유(일관된 문구)와 답장 문구를 만들어 준다.
   가공 도구라 공유 파일에는 저장하지 않고, 작업 중인 내용만 이 PC에 잠시 남겨 둔다.
   용어: 예약 = 예약한 시작 시간, 입문 = 입실 체크 전에 스피드게이트에 출입 카드를 찍은 시각 */
const PEN=(()=>{
const REASONS=[['hosp','병원 진료'],['urgent','긴급 업무 대응'],['miss','입실 체크 누락'],['etc','직접 입력']];

async function typedConfirm(title,msg,word,okLabel){
  const inp=h('input',{class:'inp',placeholder:word}); const body=h('div',null,h('div',{class:'mtxt'},msg),h('label',{class:'lbl'},`계속하려면 「${word}」를 입력하세요`),inp);
  const pr=modal(title,body,[{label:'취소',val:null},{label:okLabel||'삭제',val:'ok',danger:true}]);
  const ok=body.closest('.mod').querySelector('.btn.dan'); ok.disabled=true; ok.style.opacity=.4;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&!ok.disabled){ e.preventDefault(); ok.click(); } });
  inp.addEventListener('input',()=>{ const y=inp.value.trim()===word; ok.disabled=!y; ok.style.opacity=y?1:.4; });
  return (await pr)==='ok'&&inp.value.trim()===word;
}

  od(-2,'물티슈 100매 10팩','라운지 다과 테이블용',K); od(-3,'건전지 AA 20입','프로젝터·에어컨 리모컨 교체',G); od(-5,'멀티탭 4구 3m 6개','A센터 2번 룸 좌석 추가분',Hn);
  // 내 공간 오늘 할 일 · 빠른 메모 (비어 있을 때만)
  const mySp=DB.spaces.find(x=>spaceOwner(x)===me)||out.spaces.find(x=>x.id==='sp_kang')||{id:'sp_kang'};
  const pt=DB.pages.find(x=>x.id==='pt_'+mySp.id), pm=DB.pages.find(x=>x.id==='pm_'+mySp.id);
  const empty=p=>!p||p.blocks.every(b=>!b.text);
  if(empty(pt)) page('','오늘 할 일','✅',me,[bl('todo','라운지 BEFORE 체크리스트',true),bl('todo','소방 점검 일정 관리사무소 문의'),bl('todo','MRO 비품 메모 정리'),bl('todo','11월 리포트 초안 목차 잡기')],mySp.id,'pt_'+mySp.id);
  if(empty(pm)) page('','빠른 메모','📝',me,[bl('text','관리사무소 내선 1234 (오전 9~6시)'),bl('text','라운지 프로젝터 리모컨 — 안내데스크 2번 서랍'),bl('bullet','다음 달 리포트: 의자 높이 조절 건 포함')],mySp.id,'pm_'+mySp.id);
  return out;
}
function insertExample(){
  const old=(c,r)=>isSample(r.id)||(c==='tasks'&&/^rt_(ex_|smp)/.test(r.id))||(c==='acks'&&isSample(r.msg))||(c==='notes'&&isSample(r.task));
  for(const c of COLS) if(c!=='spaces'){ for(const r of DB[c]) if(old(c,r)) tomb(r.id); DB[c]=DB[c].filter(r=>!old(c,r)); }
  const ex=exampleData();
  for(const c of Object.keys(ex)) for(const r of ex[c]){ delete DB.deleted[r.id]; const i=DB[c].findIndex(x=>x.id===r.id); if(i>=0) DB[c][i]=r; else DB[c].push(r); if(c==='pages') snap(r); }
  ['김OO','홍OO','박팀장',ME].filter(Boolean).forEach(n=>addMember(n));
  genRecurringTasks(); commit(); renderMain();
  const n=Object.values(ex).reduce((s,a)=>s+a.length,0); toast(`예시 데이터 ${n}건을 넣었습니다`);
}
async function clearSample(){ if(!await confirmBox('예시 데이터 지우기','넣어 둔 예시 채널·메시지·페이지·할 일·일정·비품 메모를 지웁니다. 직접 만든 데이터는 그대로입니다.','지우기')) return;
  const gone=(c,r)=>isSample(r.id)||(c==='tasks'&&/^rt_(ex_|smp)/.test(r.id))||(c==='acks'&&isSample(r.msg))||(c==='notes'&&isSample(r.task));
  for(const c of COLS) for(const r of DB[c]) if(gone(c,r)) tomb(r.id);
  for(const c of COLS) DB[c]=DB[c].filter(r=>!gone(c,r));
  ['김OO','이OO','홍OO','박팀장'].forEach(n=>{ if(DB.meta.members.includes(n)&&n!==ME) removeMember(n); }); DB.meta.u=now();
  commit(); go({type:'home'}); }

(async function init(){
  // 포트폴리오 데모: 로그인·공유 폴더 없이 열고, 이 브라우저에만 저장합니다
  try{ localStorage.removeItem('tw_sharedMode'); }catch(e){}
  if(!ME){ ME='방문자'; LS.set('me',ME); }
  const auto=true, okHd=null;
  if(sharedMode()){ const pend=await idbGet('pend'); // 지난번에 공유 파일에 못 올린 변경분 (암호화돼 있음)
    if(pend){ try{ DB=merge(DB,clean((await parseWs(pend)).raw)); dirty=true; editVer++; }catch(e){ idbSet('pend',null); } } }
  else if(seedLinks()) persist();
  snapAll();
  if(!LS.get('read',null)){ LS.set('read',{}); }
  if(['총무팀 워크스페이스','우리팀 워크스페이스','E 워크센터 워크스페이스'].includes(DB.meta.wsName)){ DB.meta.wsName='샘플오피스 워크스페이스'; DB.meta.u=now(); persist(); markDirty(); renderSide(); }
  if(!LS.get('spInit',false)){ for(const sp of DEFAULT_SPACES()) if(!DB.spaces.some(x=>x.id===sp.id)&&!DB.deleted[sp.id]) DB.spaces.push(sp); LS.set('spInit',true); persist(); }
  renderSide(); renderMain(); drawFloats();
  if(!LS.get('demoSeeded',false)){ insertExample(); LS.set('demoSeeded',true); }   // 처음 방문하면 예시 데이터를 채워 둡니다
  // 굿모닝 브리핑 · 퇴근 전 리마인드: 시작 창(공유 폴더 연결)을 기다리지 않고 바로 시계를 돌림. 탭으로 돌아오거나 창을 누르면 바로 다시 확인
  setTimeout(gmTick,1500); setInterval(gmTick,20000); setTimeout(rmTick,2000); setInterval(rmTick,20000); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') rmTick(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') setTimeout(gmTick,300); }); window.addEventListener('focus',()=>setTimeout(gmTick,300));
  // 처음 켤 때 이름을 묻지 않고 「미설정」으로 시작 (왼쪽 아래 👤 → 계정 변경에서 정함)
  // (원본은 여기서 공유 폴더 연결을 묻습니다. 데모에서는 건너뜁니다)
  if(genRecurringTasks()) refresh();
  drawFloats();
  if(!(auto&&ME)) await pickUser();   // 계정은 팀 공용, 사용자는 각자 고름 (하루 유지로 열면 지난번 사용자 그대로)
  let lastDay=ymd(now()); setInterval(()=>{ const d=ymd(now()); if(d!==lastDay){ lastDay=d; if(genRecurringTasks()) refresh(); else renderSide(); } },60000);
  setInterval(()=>{ if(fh) syncNow(); },4000);
  setTimeout(()=>checkUpdate(),5000); setInterval(()=>checkUpdate(),600000);   // 새 버전 확인: 켤 때 한 번, 그 뒤 10분마다 (공유 폴더 안에서만)
  setInterval(()=>{ drawSync(); const pm=$('#pmeta'); },20000);
})();
