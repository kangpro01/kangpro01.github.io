<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비즈니스 라운지 운영 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
/* Pretendard (SIL Open Font License 1.1) - 파일에 내장, 외부 접속 없음 */
:root{
  --ink:#182033;--ink2:#4b566b;--ink3:#7a8499;
  --line:#e5e9f0;--hair:#eef1f6;--fill:#f5f7fa;--paper:#fff;
  --pri:#2945d8;--pri-d:#243dcc;--pri-bg:#eaeefc;--gold:#b9852a;--side:#0f1b3d;
  --red:#b3261e;--red-bg:#fbe9e7;--amber:#8a5a00;--amber-bg:#fdf0d2;--green:#1e6b3a;--green-bg:#e3f2e8;
  --blue:#1b2a9a;
  --sh:0 1px 2px rgba(15,27,61,.05);--sh2:0 1px 2px rgba(15,27,61,.05),0 6px 16px -8px rgba(15,27,61,.16);
}
.rc0{--rc:#2945d8;--rcd:#243dcc;--rcb:#e8ecfc}.rc1{--rc:#e58b8b;--rcd:#cf6f6f;--rcb:#fdeeee}.rc2{--rc:#8250d8;--rcd:#7446c9;--rcb:#eee7fb}.rc3{--rc:#c26e00;--rcd:#a8620a;--rcb:#fbeeda}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;color:var(--ink);background:var(--fill);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}
body{font-feature-settings:'tnum'}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:#fff;padding:26px 14px 20px;display:flex;flex-direction:column;gap:26px}
.brand{background:none;border:0;cursor:pointer;color:#fff;text-align:left;padding:0 10px;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.brand small{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:0}
.brand:focus-visible,.tab:focus-visible{outline-color:#fff}
#tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:11px 12px;border-radius:10px;font-size:15.5px;font-weight:600;color:rgba(255,255,255,.72);white-space:nowrap;text-align:left}
.tab svg{width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:rgba(255,255,255,.07);color:#fff}
.tab.on{background:#fff;color:var(--ink)}
.tab.on svg{stroke:var(--pri)}
.bar{position:sticky;top:0;z-index:30;background:rgba(245,247,250,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar .wrap{padding-top:10px;padding-bottom:0}
.mon{display:flex;align-items:stretch;gap:18px;border-bottom:1px solid var(--line)}
.yr{display:flex;align-items:center;gap:2px;flex:0 0 auto;padding-bottom:6px}
.yr b{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-right:6px}
.mbtn{background:var(--paper);border:1px solid var(--line);border-radius:50%;cursor:pointer;width:28px;height:28px;font-size:15px;line-height:1;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0 0 2px}
.mbtn:hover{border-color:var(--pri);color:var(--pri)}
#months{display:grid;grid-template-columns:repeat(12,1fr);flex:1;min-width:0}
.mo{position:relative;background:none;border:0;cursor:pointer;padding:10px 4px 14px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap;border-radius:8px 8px 0 0}
.mo b{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2;position:relative}
.mo b i{font-style:normal;font-size:13px;font-weight:500;margin-left:1px}
.mo small{font-size:12px;font-weight:600;height:16px;line-height:16px;color:var(--ink3)}
.mo:hover{color:var(--ink);background:rgba(20,33,61,.04)}
.mo.on{color:var(--ink)}
.mo.on b{font-weight:800}
.mo.on small{color:var(--pri)}
.mo.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--pri)}
.mo.now b::after{content:"";position:absolute;top:0;right:-8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.saved{position:fixed;right:20px;bottom:20px;z-index:90;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s}
.saved.show{opacity:1}

/* page */
main{padding-bottom:80px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:32px 0 20px}
.ph h2{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.ph p{margin-top:4px;font-size:15.5px;color:var(--ink2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:16px;min-width:0;break-inside:avoid}
.card>h3{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card>h3 em{font-style:normal;font-size:14px;font-weight:500;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.span2{grid-column:1/-1}
.help{font-size:14px;color:var(--ink2);margin:12px 2px 0}
.empty{padding:22px 0;font-size:15px;color:var(--ink3);text-align:center}

.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-block}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#000}
.btn.sm{padding:5px 11px;font-size:13.5px}
.sel{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;background:#fff;max-width:100%}

/* kpi */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.kpi-l{font-size:14.5px;font-weight:600;color:var(--ink2)}
.kpi-v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.kpi-v small{font-size:16px;font-weight:600;margin-left:3px;color:var(--ink2);letter-spacing:0}
.kpi-d{font-size:13.5px;color:var(--ink3);font-weight:500}
.kpi.warn{border-color:var(--red);background:var(--red-bg)}
.kpi.warn .kpi-v{color:var(--red)}

/* charts */
.vb{display:flex;gap:3px;align-items:flex-end}
.vb-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.vb-area{height:130px;width:100%;display:flex;align-items:flex-end;padding-top:20px;border-bottom:1.5px solid var(--ink3)}
.vb-bar{width:100%;max-width:40px;margin:0 auto;background:var(--ink);position:relative;border-radius:3px 3px 0 0}
.vb-col.lt .vb-bar{background:#b9b3aa}
.vb-v{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:700;white-space:nowrap}
.vb-l{font-size:12.5px;color:var(--ink2);margin-top:5px;height:18px;white-space:nowrap}
.hb-row{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:15px}
.hb-l{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:14px;background:var(--hair);border-radius:3px;overflow:hidden}
.hb-f{display:block;height:100%;background:var(--ink)}
.hb-v{font-size:14.5px;font-weight:700;white-space:nowrap;min-width:70px;text-align:right}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
thead th{text-align:left;font-size:13.5px;font-weight:700;color:var(--ink2);padding:0 10px 9px;border-bottom:2px solid var(--ink);white-space:nowrap}
tbody td{padding:11px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
thead th:first-child,tbody td:first-child{padding-left:2px}
td.n,th.n{text-align:right}
td.nw{white-space:nowrap}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--fill)}
tr.off td{color:var(--ink3)}
tr.off td b{font-weight:500;text-decoration:line-through}
tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.sub{display:block;font-size:14px;color:var(--ink2)}
.bd{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px;white-space:nowrap;background:var(--fill);color:var(--ink2)}
.bd.r{background:var(--red-bg);color:var(--red)}
.bd.a{background:var(--amber-bg);color:var(--amber)}
.bd.g{background:var(--green-bg);color:var(--green)}

/* calendar */
.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-h span{font-size:14px;font-weight:700;color:var(--ink2);padding:9px 0;text-align:center}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--hair)}
.cd{background:var(--paper);border:0;min-height:104px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
div.cd{cursor:default;background:var(--fill)}
.cd.we{background:#faf9f6}
.cd:hover{background:var(--fill)}
.cd.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.cd:focus-visible{outline-offset:-3px}
.cd-n{font-size:15px;font-weight:700;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cd.we .cd-n{color:var(--ink3)}
.cd.today .cd-n{background:var(--ink);color:#fff}
.chip{display:flex;gap:5px;font-size:13px;line-height:1.4;background:var(--ink);color:#fff;padding:2px 6px;border-radius:4px;width:100%;overflow:hidden;white-space:nowrap}
.chip b{font-weight:700}
.chip i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.cal .chip{display:block;white-space:normal;overflow:visible;padding:4px 7px}
.cal .chip .c1{display:flex;gap:6px;align-items:baseline;min-width:0}
.cal .chip .c1 b{flex:0 0 auto;font-weight:800}
.cal .chip .c1 em{flex:0 0 auto;font-style:normal;font-weight:600;color:var(--ink2)}
.cal .chip .c1 i{font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .chip s{display:block;text-decoration:none;font-size:12px;font-weight:500;line-height:1.35;color:var(--ink2);margin-top:1px;word-break:keep-all;overflow-wrap:anywhere}
.cal .chip.off s{color:inherit}
.chip.off{background:var(--hair);color:var(--ink3);text-decoration:line-through}
.more{font-size:12.5px;color:var(--ink2);font-weight:700}

/* rows */
.rl{list-style:none}
.tgl{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:600;color:var(--ink3);cursor:pointer;user-select:none;padding:2px 7px 2px 5px;border:1px solid var(--line);border-radius:999px;background:#fff;line-height:1.4}
.tgl:hover{color:var(--ink2);border-color:#c9d0de}
#rpBody.hcx tr[data-x]{display:none}
.rp h3.h3t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tgl input{width:9px;height:9px;margin:0;accent-color:#2945d8;cursor:pointer}
.rl-n{flex:1.3 1 0;min-width:0;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-n:not(:empty){background:#f4f6fd;border-radius:8px;padding:6px 10px;color:#2945d8}
.rl-n:not(:empty)::before{content:'비고';font-weight:800;color:var(--ink2);margin-right:8px;font-size:12px}
.apv{margin:0 0 14px}
.apv textarea{width:100%;min-height:118px;border:1.5px dashed #b9c4ef;background:#f7f9ff;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
.apv textarea:focus{outline:0;border-color:#2945d8;background:#fff}
.apv-m{margin-top:6px;font-size:13px;color:var(--ink2);min-height:18px}
.apv-m b{color:#0fa89a;margin-right:4px}.apv-m em{font-style:normal;color:#c26e00;margin-left:8px}
@keyframes afl{from{background:#e6f6f4}to{background:inherit}}
.fm .af{animation:afl 1.2s ease-out}
.rl li{display:flex;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--hair);cursor:pointer}
.rl li:last-child{border-bottom:0}
.rl li:hover{background:var(--fill)}
.rl-t{font-size:16px;font-weight:800;white-space:nowrap;min-width:108px}
.rl-t small{display:block;font-weight:600;font-size:14px;color:var(--ink2)}
.rl-m{flex:1;min-width:0;font-size:16px;font-weight:700}
.rl-m small{display:block;font-size:14px;font-weight:500;color:var(--ink2)}

/* inquiries */
.qc{padding:16px 0;border-bottom:1px solid var(--hair)}
.qc:last-child{border-bottom:0}
.qc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-bottom:6px}
.qc-h b{color:var(--ink);font-size:15px}
.sp{flex:1}
.qc-c{font-size:16px;white-space:pre-wrap;word-break:break-word}
.qc-a{margin-top:6px;font-size:15px;color:var(--ink2);white-space:pre-wrap}

/* checklist */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 16px}
.field label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.field input,.ff input,.ff select,.ff textarea,.pa{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:16px;background:#fff}
.field input:focus,.ff input:focus,.ff select:focus,.ff textarea:focus,.pa:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.stg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.stg button{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;font-size:16px;font-weight:800}
.stg button small{display:block;font-size:13.5px;font-weight:500;color:var(--ink2)}
.stg button span{float:right;font-size:14px;font-weight:700;color:var(--ink2)}
.stg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
tr.ck{cursor:pointer}tr.ck:hover td{background:var(--fill)}
.stg button.on small,.stg button.on span{color:rgba(255,255,255,.8)}
.stg button.done:not(.on){border-color:var(--green);background:var(--green-bg)}
.item{display:block;position:relative;padding:14px 0 14px 42px;cursor:pointer;border-bottom:1px solid var(--hair)}
.item input{position:absolute;opacity:0;width:0;height:0}
.box{position:absolute;left:2px;top:15px;width:26px;height:26px;border:2px solid var(--ink3);border-radius:6px;background:#fff}
.box::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);opacity:0}
.item input:checked ~ .box{background:var(--ink);border-color:var(--ink)}
.item input:checked ~ .box::after{opacity:1}
.item input:focus-visible ~ .box{outline:2.5px solid var(--ink);outline-offset:3px}
.item-name{display:block;font-size:17px;font-weight:700}
.item-note{display:block;font-size:14.5px;color:var(--ink2);margin-top:1px}
.item input:checked ~ .item-name,.item input:checked ~ .item-note{color:var(--ink3)}
.item input:checked ~ .item-name{text-decoration:line-through;font-weight:500}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(22,21,20,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.md{background:#fff;width:100%;max-width:560px;border-radius:14px}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.md-h h3{font-size:19px;font-weight:800}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--ink2);padding:0 4px}
.md-b{padding:18px 22px 22px}
.kk-m{display:inline-flex;gap:2px;padding:3px;background:var(--fill);border-radius:10px;margin-bottom:10px}
.kk-m button{border:0;background:none;padding:7px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.kk-m button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(15,27,61,.12)}
.kk-d{display:flex;align-items:center;gap:8px;margin-bottom:10px}.kk-d[hidden]{display:none}
.kk-d input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.kk-os{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px}
.kk-o{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.kk-o input{accent-color:#2945d8}
.kk-t{width:100%;height:340px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;font:inherit;font-size:13.5px;line-height:1.6;white-space:pre}
.fm{display:flex;flex-wrap:wrap;gap:12px 14px}
.ff{flex:1 1 100%;min-width:0;display:block}
.ff.half{flex:1 1 calc(50% - 7px)}
.ff span{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.ff textarea{min-height:84px;resize:vertical}
.fm-b{flex:1 1 100%;display:flex;gap:8px;align-items:center;margin-top:8px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}

/* report (보고 양식) */
.rp{background:#fff;border:1px solid var(--line);padding:44px 48px 52px;margin-top:16px}
.rp-t{font-size:26px;font-weight:800;letter-spacing:-.03em;padding-bottom:10px;border-bottom:3px solid var(--blue)}
.rp h3{font-size:16px;font-weight:800;margin:24px 0 8px;break-after:avoid}
.rt{font-size:13.5px;text-align:center}
.rt thead th{background:var(--blue);color:#fff;text-align:center;font-size:12.5px;padding:6px 8px;border:0;border-left:1px solid rgba(255,255,255,.3)}
.rt thead th:first-child{padding-left:8px;border-left:0}
.rt tbody td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tbody td:first-child{padding-left:8px}
.rt td.l{text-align:left}
.rt td.mg,.rt td.kd{border-left:1px solid var(--line)}
.rt td.rm{font-weight:700}
.rt tr.tot td{background:#dfe4f5;font-weight:800;border-top:0;border-bottom:1px solid var(--line)}
.rt.ov1 td:first-child{border-right:1px solid var(--line)}
.rt.ov1 td{height:30px}
.rp-n{font-size:12.5px;color:#c0392b;margin-top:6px;line-height:1.5}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:14px;break-inside:avoid}
.g3>div{min-width:0}
.g3-t{text-align:center;font-size:14px;color:var(--ink2);margin-bottom:2px}
.rp .vb-bar{background:var(--blue);max-width:34px;border-radius:0}
.rp .vb-col.lt .vb-bar{background:#9aa3d6}
.rp .vb-area{height:96px;border-bottom:1px solid var(--line)}
.etc{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--blue);border-top:0;border-bottom:0;border-image:linear-gradient(var(--blue) 0 10px,transparent 10px calc(100% - 10px),var(--blue) calc(100% - 10px)) 1;padding:6px 0;min-height:150px}
.etc>div{padding:8px 20px;min-width:0}
.etc>div+div{border-left:1px dashed var(--ink3)}
.etc-t{font-weight:800;font-size:14.5px;margin-bottom:6px}
.etc ul{list-style:none;font-size:13.5px}
.etc li{padding:3px 0;word-break:break-word}

function parseTable(text) {
  text = String(text || '').replace(/^﻿/, '');

  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c; }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function parseDate(s) {
  s = String(s || '').trim(); let m, y, mo, d;

  else if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) { y = m[3]; mo = +m[1]; d = +m[2]; }

function restoreFile(f) {

  rd.onerror = rd.onabort = () => alert('파일을 읽지 못했습니다.\n(' + ((rd.error && rd.error.name) || '읽기 오류') + ')\n파일이 다른 프로그램에서 열려 있거나 문서보안이 걸린 파일일 수 있습니다.');

  try { rd.readAsText(f, 'utf-8'); } catch (x) { alert('파일을 읽지 못했습니다.\n' + (x && x.message || x)); }
}
function restoreText(t) {
  let d; try { d = JSON.parse(t.replace(/^﻿/, '').trim()); } catch (e) { d = null; }
  if (!d || typeof d !== 'object' || !Array.isArray(d.reservations)) { alert('대시보드 백업 파일이 아닙니다.\n(내용이 비어 있거나 형식이 다릅니다 · 앞부분: ' + JSON.stringify(t.slice(0, 40)) + ')'); return; }

  /* 복원한 기록은 '지금 수정한 것'으로 찍어, 다른 PC의 지난 삭제 기록에 지워지지 않게 합니다 */
  COLS.forEach(k => DB[k].forEach(r => { r.u = Math.max(now, (del[r.id] || 0) + 1, (r.u || 0) + 1); delete DB.deleted[r.id]; }));
  if (od) DB.settings.order = od; DB.settings.inqMap = om || null; save(); render(); alert('복원했습니다 · 예약 ' + DB.reservations.length + '건');
}
/* 파일 선택창이 막힌 환경을 위한 대안: JSON 파일을 화면에 끌어다 놓으면 복원 */

const fabClose = () => { const m = $('#fabm'); if (m && !m.hidden) { m.hidden = true; $('.fabb').setAttribute('aria-expanded', 'false'); } };

document.addEventListener('dragstart', e => { const g = e.target.closest && e.target.closest('.grip'); if (!g) return;
