<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문제 &amp; 개선 — 일 잘하는 강프로</title>
<meta name="description" content="업무하며 느낀 불편을 적고, 개선으로 이어 붙여요.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=20260829u">
<!-- 화면이 그려지기 전에 밝기를 정합니다. 늦으면 흰 화면이 한 번 번쩍입니다. -->
<script src="assets/theme.js?v=20260829u"></script>
</head>
<body>

<div id="site-header"></div>

<div class="page-head slim">
  <div class="wrap">
    <span class="tag">ISSUES</span>
    <h1>문제 &amp; 개선</h1>
    <p>불편했던 점을 적어주세요.</p>
  </div>
</div>

<section id="write">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">WRITE</span>
        <h2>불편한 점</h2>
      </div>
    </div>
    <div id="issueForm"></div>
  </div>
</section>

<section id="list" style="background:var(--paper-2)">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">IDEAS</span>
        <h2>개선 아이디어</h2>
        <p>불편했던 점과 해결 방법을 가볍게 적어보세요.</p>
      </div>
    </div>
    <div id="issueList"></div>
  </div>
</section>

<section id="done">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">IMPROVED</span>
        <h2>개선한 것</h2>
        <p>실제로 개선하거나 바꾼 내용을 남겨주세요.</p>
      </div>
    </div>
    <div id="issueDone"></div>
  </div>
</section>

<section id="ref" style="background:var(--paper-2)">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">REFERENCE</span>
        <h2>레퍼런스</h2>
        <p>참고하고 싶은 링크나 사례를 저장해 두세요.</p>
      </div>
      <button class="ics" type="button" id="refAdd">+ 레퍼런스 추가</button>
    </div>
    <div id="refList"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/site.js?v=20260829u"></script>
<script src="assets/supabase.js?v=20260829u"></script>
<script src="assets/db.js?v=20260829u"></script>
<script src="assets/when.js?v=20260829u"></script>
<script src="assets/task-form.js?v=20260829u"></script>
<script src="assets/issues.js?v=20260829u"></script>
</body>
</html>
