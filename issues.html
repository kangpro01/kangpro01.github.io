<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문제 &amp; 개선 — 일 잘하는 강프로</title>
<meta name="description" content="업무하며 느낀 불편을 적고, 개선으로 이어 붙여요.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=20260830n">
<!-- 화면이 그려지기 전에 밝기를 정합니다. 늦으면 흰 화면이 한 번 번쩍입니다. -->
<script src="assets/theme.js?v=20260830n"></script>
</head>
<body>

<div id="site-header"></div>

<div class="page-head slim">
  <div class="wrap">
    <span class="tag">ISSUES</span>
    <h1>문제 &amp; 개선</h1>
    <p>불편했던 점을 적어주세요.</p>
  </div>
</div>

<section class="kan-sec">
  <div class="wrap kan-wrap">

    <div class="kan">
      <section class="kan-col" id="write">
        <div class="kan-head">
          <div class="kan-title">
            <h2>불편한 점</h2>
            <p>불편했던 점을 적어주세요.</p>
          </div>
          <span class="kan-count" id="cntNew">0</span>
          <button class="kan-add" type="button" id="isuToggle"
                  aria-expanded="false" aria-controls="issueForm">+ 등록</button>
        </div>
        <div id="issueForm" hidden></div>
        <div class="kan-body" id="issueNew"></div>
      </section>

      <section class="kan-col" id="list">
        <div class="kan-head">
          <div class="kan-title">
            <h2>개선 아이디어</h2>
            <p>고칠 방법을 적으면 여기로 와요.</p>
          </div>
          <span class="kan-count" id="cntDoing">0</span>
        </div>
        <div class="kan-body" id="issueList"></div>
      </section>

      <section class="kan-col" id="done">
        <div class="kan-head">
          <div class="kan-title">
            <h2>개선한 것</h2>
            <p>실제로 개선하거나 바꾼 내용이에요.</p>
          </div>
          <span class="kan-count" id="cntDone">0</span>
        </div>
        <div class="kan-body" id="issueDone"></div>
      </section>
    </div>

    <section class="kan-col ref-col" id="ref">
      <div class="kan-head">
        <div class="kan-title">
          <h2>레퍼런스</h2>
          <p>참고하고 싶은 링크나 사례를 저장해 두세요.</p>
        </div>
        <span class="kan-count" id="cntRef">0</span>
        <button class="kan-add" type="button" id="refAdd">+ 추가</button>
      </div>
      <div id="refList"></div>
    </section>

  </div>
</section>

<div id="site-footer"></div>

<script src="assets/site.js?v=20260830n"></script>
<script src="assets/supabase.js?v=20260830n"></script>
<script src="assets/db.js?v=20260830n"></script>
<script src="assets/when.js?v=20260830n"></script>
<script src="assets/task-form.js?v=20260830n"></script>
<script src="assets/issues.js?v=20260830n"></script>
</body>
</html>
