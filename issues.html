<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문제 &amp; 개선 — 일 잘하는 강프로</title>
<meta name="description" content="업무하며 느낀 불편을 적고, 개선으로 이어 붙여요.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=20260831g">
<!-- 화면이 그려지기 전에 밝기를 정합니다. 늦으면 흰 화면이 한 번 번쩍입니다. -->
<script src="assets/theme.js?v=20260831g"></script>
</head>
<body>

<div id="site-header"></div>

<div class="split">

  <!-- 왼쪽 — 어디에 얼마나 쌓였는지 -->
  <aside class="side">
    <nav class="side-nav" aria-label="문제 &amp; 개선 안쪽 메뉴">
      <a class="side-item on" href="#write"><span>불편한 점</span><em class="cnt" data-cnt="new">0</em></a>
      <a class="side-item"    href="#list"><span>개선 아이디어</span><em class="cnt" data-cnt="doing">0</em></a>
      <a class="side-item"    href="#done"><span>개선한 것</span><em class="cnt" data-cnt="done">0</em></a>
      <a class="side-item"    href="#ref"><span>레퍼런스</span><em class="cnt" data-cnt="ref">0</em></a>
    </nav>
  </aside>

  <!-- 오른쪽 — 피드 -->
  <main class="feed">
    <header class="feed-head">
      <div class="feed-head-row">
        <h1>문제 &amp; 개선</h1>
        <button class="btn sm" type="button" id="isuToggle"
                aria-expanded="false" aria-controls="issueForm">+ 새 등록</button>
      </div>
      <p>불편했던 점을 적어주세요.</p>
    </header>

    <section class="feed-card" id="write">
      <div class="feed-card-head">
        <h2>불편한 점</h2>
        <em class="cnt" data-cnt="new">0</em>
      </div>
      <div id="issueForm" hidden></div>
      <div class="kan-body" id="issueNew"></div>
    </section>

    <section class="feed-card" id="list">
      <div class="feed-card-head">
        <h2>개선 아이디어</h2>
        <em class="cnt" data-cnt="doing">0</em>
      </div>
      <div class="kan-body" id="issueList"></div>
    </section>

    <section class="feed-card" id="done">
      <div class="feed-card-head">
        <h2>개선한 것</h2>
        <em class="cnt" data-cnt="done">0</em>
      </div>
      <div class="kan-body" id="issueDone"></div>
    </section>

    <section class="feed-card" id="ref">
      <div class="feed-card-head">
        <h2>레퍼런스</h2>
        <em class="cnt" data-cnt="ref">0</em>
        <button class="kan-add" type="button" id="refAdd">+ 추가</button>
      </div>
      <div class="kan-body" id="refList"></div>
    </section>

    <div id="site-footer"></div>
  </main>

</div>

<script src="assets/site.js?v=20260831g"></script>
<script src="assets/supabase.js?v=20260831g"></script>
<script src="assets/db.js?v=20260831g"></script>
<script src="assets/when.js?v=20260831g"></script>
<script src="assets/task-form.js?v=20260831g"></script>
<script src="assets/issues.js?v=20260831g"></script>
</body>
</html>
