<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문제 &amp; 개선 — 일 잘하는 강프로</title>
<meta name="description" content="업무하며 느낀 불편을 적고, 개선으로 이어 붙입니다.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=20260829f">
</head>
<body>

<div id="site-header"></div>

<div class="page-head slim">
  <div class="wrap">
    <span class="tag">ISSUES</span>
    <h1>문제 &amp; 개선</h1>
    <p>느낀 그대로 한 줄 적어두십시오. 같은 불편이 쌓이면 무엇을 먼저 고쳐야 할지가 저절로 드러납니다.</p>
  </div>
</div>

<section id="write">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">WRITE</span>
        <h2>불편한 점 적기</h2>
        <p>다듬지 마시고 느낀 대로</p>
      </div>
    </div>
    <div id="issueForm"></div>
  </div>
</section>

<section id="list" style="background:var(--paper-2)">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">IDEAS</span>
        <h2>개선 아이디어</h2>
        <p>아직 고치지 못한 것. 각 건에서 아이디어를 뽑고 업무로 넘깁니다</p>
      </div>
    </div>
    <div id="issueList"></div>
  </div>
</section>

<section id="done">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">IMPROVED</span>
        <h2>개선한 것</h2>
        <p>없앤 불편이 여기에 쌓입니다</p>
      </div>
    </div>
    <div id="issueDone"></div>
  </div>
</section>

<section id="ref" style="background:var(--paper-2)">
  <div class="wrap">
    <div class="sec-head row">
      <div>
        <span class="tag">REFERENCE</span>
        <h2>레퍼런스</h2>
        <p>참고한 것과 참고할 것</p>
      </div>
      <button class="ics" type="button" id="refAdd">＋ 레퍼런스 담기</button>
    </div>
    <div id="refList"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/site.js?v=20260829f"></script>
<script src="assets/supabase.js?v=20260829f"></script>
<script src="assets/db.js?v=20260829f"></script>
<script src="assets/when.js?v=20260829f"></script>
<script src="assets/task-form.js?v=20260829f"></script>
<script src="assets/issues.js?v=20260829f"></script>
</body>
</html>
