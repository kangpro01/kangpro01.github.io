<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일 잘하는 강프로</title>
<meta name="description" content="잊기 쉬운 업무를 다시 떠올리게 하는 팀 업무 보조 도구.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-head slim">
  <div class="wrap">
    <span class="tag">TODAY</span>
    <h1 id="greet">오늘 뭘 해야 하지?</h1>
    <p>놓친 것과 해야 할 것을 위에서부터 보여드립니다. 오른쪽 위에서 새 업무를 담으실 수 있습니다.</p>
  </div>
</div>

<div class="wrap board" id="board"></div>

<div class="wrap">
  <div class="sec-head row" style="margin-top:8px">
    <div>
      <span class="tag">CALENDAR</span>
      <h2>이번 달</h2>
      <p>점이 찍힌 날에 할 일이 있습니다</p>
    </div>
  </div>
  <div class="home-rem">
    <div class="mini" id="homeReminder"></div>
    <div class="cal" id="homeCal"></div>
  </div>

  <p class="attic-line">잠깐 쉬어가려면 — <a href="attic.html">딴짓 창고</a></p>
</div>

<div id="site-footer"></div>

<script src="assets/site.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/db.js"></script>
<script src="assets/when.js"></script>
<script src="assets/task-form.js"></script>
<script src="assets/home.js"></script>
<script src="assets/tasks.js"></script>
<script src="assets/cal.js"></script>
<script src="assets/notify.js"></script>
<script>
/* 시간대에 맞춘 인사 — 들어온 때를 알아채게 합니다 */
(function(){
  const el = document.getElementById('greet');
  if(!el) return;
  const h = new Date().getHours();
  const d = new Date().getDay();
  if(d === 5)          el.textContent = '금요일입니다. 이번 주 마무리하셨습니까?';
  else if(d === 1)     el.textContent = '월요일입니다. 지난주에 놓친 것부터 봅니다.';
  else if(h < 11)      el.textContent = '오늘 뭘 해야 하지?';
  else if(h < 17)      el.textContent = '남은 오늘, 무엇이 급합니까?';
  else                 el.textContent = '오늘 놓친 것은 없습니까?';
})();

/* 홈의 이번 달 미리보기 — 반복되는 일반 업무 목록에서 뽑습니다 */
(function(){
  const el = document.getElementById('homeReminder');
  if(!el || typeof TASKS === 'undefined') return;
  const M = new Date().getMonth() + 1;

  const peek = TASKS.filter(t => t.m === M).sort((a,b) => a.d - b.d)
    .map(t => ({ t:t.t, when:M + '월 ' + t.d + '일', to:'#month' }));
  MONTHLY.slice().sort((a,b) => a.d - b.d).forEach(t => {
    if(peek.length < 3) peek.push({ t:t.t, when:'매월 ' + t.d + '일', to:'#always' });
  });

  el.innerHTML = peek.slice(0,3).map(x =>
    '<a href="reminder.html' + x.to + '">' + x.t + ' <span>' + x.when + '</span></a>'
  ).join('');
})();
</script>
</body>
</html>
