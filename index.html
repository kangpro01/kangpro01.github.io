<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일 잘하는 강프로</title>
<meta name="description" content="잊기 쉬운 업무를 다시 떠올리게 하는 팀 업무 보조 도구.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap hub">

  <section class="card card-cal">
    <div class="card-head"><h2>캘린더</h2></div>
    <div class="card-body"><div class="cal" id="homeCal"></div></div>
  </section>

  <section class="card card-now">
    <div class="card-head"><h2>당장 해야 할 일</h2>
      <span class="card-hint" id="nowCount"></span></div>
    <div class="card-body" id="nowList"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>일간 업무</h2>
      <button type="button" class="card-add" data-newtask data-when="매일" aria-label="일간 업무 담기">＋</button></div>
    <div class="card-body" id="dailyList"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>주간 업무</h2>
      <button type="button" class="card-add" data-newtask data-when="매주 금요일" aria-label="주간 업무 담기">＋</button></div>
    <div class="card-body" id="weeklyList"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>월간 업무</h2>
      <button type="button" class="card-add" data-newtask data-when="매달 25일" aria-label="월간 업무 담기">＋</button></div>
    <div class="card-body" id="monthlyList"></div>
  </section>

</div>

<div class="wrap board" id="board"></div>

<div class="wrap">
  <p class="attic-line">잠깐 쉬어가려면 — <a href="attic.html">딴짓 창고</a></p>
</div>

<!-- ══ 떠 있는 단추 — 누르면 업무 담기와 알림 설정이 열립니다 ══ -->
<div class="fab-wrap">
  <div class="fab-pop" id="fabPop" hidden>
    <div class="fab-sec">
      <b>업무 담기</b>
      <button class="btn" type="button" data-newtask>＋ 잊지 말 업무</button>
    </div>
    <div class="fab-sec">
      <b>알림 받기</b>
      <p class="fab-note">켜두면 들어왔을 때 알려드립니다.</p>
      <div class="switches" id="notifySwitches"></div>
    </div>
  </div>
  <button type="button" class="fab" id="fabBtn" aria-expanded="false" aria-controls="fabPop"
          aria-label="업무 담기와 알림 설정 열기"></button>
</div>

<div id="site-footer"></div>

<script src="assets/site.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/db.js"></script>
<script src="assets/when.js"></script>
<script src="assets/task-form.js"></script>
<script src="assets/tasks.js"></script>
<script src="assets/cal.js"></script>
<script src="assets/home.js"></script>
<script src="assets/fab.js"></script>
<script src="assets/notify.js"></script>
</body>
</html>
