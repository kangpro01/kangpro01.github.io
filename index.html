<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일 잘하는 강프로</title>
<meta name="description" content="잊기 쉬운 업무를 다시 떠올리게 하는 팀 업무 보조 도구.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=20260831e">
<!-- 화면이 그려지기 전에 밝기를 정합니다. 늦으면 흰 화면이 한 번 번쩍입니다. -->
<script src="assets/theme.js?v=20260831e"></script>
</head>
<body>

<div id="site-header"></div>

<div class="wrap hub">

  <main class="hub-main">
    <section class="card card-cal">
      <div class="card-head"><h2>캘린더</h2>
        <button type="button" class="side-toggle" id="sideOpen"
                aria-controls="sideDrawer" aria-expanded="false" aria-label="업무 위젯 서랍 열기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>
          </svg>
          <span>업무 위젯</span>
        </button>
      </div>
      <div class="card-body"><div class="cal" id="homeCal"></div></div>
    </section>
  </main>

  <div class="hub-dock" id="hubDock">
    <aside class="hub-side" id="hubSide" aria-label="업무 위젯">
    <section class="card widget" id="now" data-w="now">
      <div class="card-head">
        <button type="button" class="w-grip" aria-label="지금 해야 할 일 순서 바꾸기">⋮⋮</button>
        <h2>지금 해야 할 일</h2>
        <span class="card-hint" id="nowCount"></span>
        <button type="button" class="card-fold" data-fold
                aria-expanded="true" aria-controls="nowList" aria-label="접기"></button>
      </div>
      <div class="card-body" id="nowList"></div>
    </section>
    <section class="card widget" id="daily" data-w="daily">
      <div class="card-head">
        <button type="button" class="w-grip" aria-label="일간 업무 순서 바꾸기">⋮⋮</button>
        <h2>일간 업무</h2>
        <button type="button" class="card-add" data-newtask data-when="매일" aria-label="일간 업무 담기">＋</button>
        <button type="button" class="card-fold" data-fold
                aria-expanded="true" aria-controls="dailyList" aria-label="접기"></button>
      </div>
      <div class="card-body" id="dailyList"></div>
    </section>
    <section class="card widget" id="weekly" data-w="weekly">
      <div class="card-head">
        <button type="button" class="w-grip" aria-label="주간 업무 순서 바꾸기">⋮⋮</button>
        <h2>주간 업무</h2>
        <button type="button" class="card-add" data-newtask data-when="매주 금요일" aria-label="주간 업무 담기">＋</button>
        <button type="button" class="card-fold" data-fold
                aria-expanded="true" aria-controls="weeklyList" aria-label="접기"></button>
      </div>
      <div class="card-body" id="weeklyList"></div>
    </section>
    <section class="card widget" id="monthly" data-w="monthly">
      <div class="card-head">
        <button type="button" class="w-grip" aria-label="월간 업무 순서 바꾸기">⋮⋮</button>
        <h2>월간 업무</h2>
        <button type="button" class="card-add" data-newtask data-when="매달 25일" aria-label="월간 업무 담기">＋</button>
        <button type="button" class="card-fold" data-fold
                aria-expanded="true" aria-controls="monthlyList" aria-label="접기"></button>
      </div>
      <div class="card-body" id="monthlyList"></div>
    </section>
    </aside>
  </div>

</div>

<!-- ══ 오른쪽 서랍 — 위젯 묶음이 여기로 옮겨 왔다 돌아갑니다 ══ -->
<div class="drawer-scrim" id="sideScrim"></div>
<aside class="side-drawer" id="sideDrawer" aria-label="업무 위젯" aria-hidden="true">
  <div class="side-drawer-head">
    <b>업무 위젯</b>
    <button type="button" class="side-drawer-x" id="sideClose" aria-label="닫기">×</button>
  </div>
  <div class="side-drawer-body" id="sideDrawerBody"></div>
</aside>

<!-- ══ 떠 있는 단추 — 누르면 업무 담기와 알림 설정이 열립니다 ══ -->
<div class="fab-wrap">
  <div class="fab-pop" id="fabPop" hidden>
    <div class="fab-sec">
      <b>업무추가</b>
      <button class="btn" type="button" data-newtask>＋ 업무추가</button>
    </div>
    <div class="fab-sec">
      <b>알림 받기</b>
      <p class="fab-note">켜두면 들어왔을 때 알려드려요.</p>
      <div class="switches" id="notifySwitches"></div>
    </div>
  </div>
  <button type="button" class="fab" id="fabBtn" aria-expanded="false" aria-controls="fabPop"
          aria-label="업무추가와 알림 설정 열기">
    <img src="assets/kang.png" alt="" width="252" height="340">
    <i class="fab-x" aria-hidden="true"></i>
  </button>
</div>

<div id="site-footer"></div>

<script src="assets/site.js?v=20260831e"></script>
<script src="assets/supabase.js?v=20260831e"></script>
<script src="assets/db.js?v=20260831e"></script>
<script src="assets/when.js?v=20260831e"></script>
<script src="assets/task-form.js?v=20260831e"></script>
<script src="assets/holidays.js?v=20260831e"></script>
<script src="assets/cal.js?v=20260831e"></script>
<script src="assets/notify.js?v=20260831e"></script>
<script src="assets/home.js?v=20260831e"></script>
<script src="assets/fab.js?v=20260831e"></script>
</body>
</html>
