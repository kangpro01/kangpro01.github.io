# Supabase 무료 플랜은 한동안 요청이 없으면 프로젝트를 일시정지합니다.
# 정지되면 불편사항 접수 폼이 실패합니다.
#
# 사흘에 한 번 가볍게 찔러서 깨어 있게 유지합니다.
# 읽기는 RLS로 막혀 있어 빈 배열이 돌아옵니다. 그래도 요청 기록으로는 남습니다.
#
# 여기 쓰인 키는 브라우저에도 노출되는 공개 키입니다. 비밀이 아닙니다.

name: Supabase 깨워두기

on:
  schedule:
    - cron: '0 3 */3 * *'    # 사흘마다 (UTC 03:00)
  workflow_dispatch:          # 필요하면 손으로도 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 접수 테이블 한 번 두드리기
        run: |
          URL="https://jtjveoqyocmcsfkvucwb.supabase.co/rest/v1/issues?select=id&limit=1"
          KEY="sb_publishable_pA7soUU0UiQm6vswDtm5mw_sVGs5kJH"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" -H "apikey: $KEY")
          echo "응답 $code"
          # 200이면 살아 있음. 그 밖의 값이면 실패로 처리해 알림이 오게 합니다.
          test "$code" = "200"
